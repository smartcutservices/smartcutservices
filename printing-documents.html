<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131921">
  <title>Impression Documents | Smart Cut Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./site-foundation.css?v=20260829-16">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
    html, body { width: 100%; max-width: 100%; overflow-x: clip; }
    body {
      font-family: 'Amazon Ember', Arial, Helvetica, sans-serif;
      color: var(--sc-ink);
      background: var(--sc-canvas);
      overflow-x: clip;
    }
    /* No padding-top at desktop widths: #sierra-header-root already reserves that
       exact space (header.js sizes it to the real header height once mounted). */
    #printing-documents-root { width: 100%; padding-top: 1.25rem; }
    @media (max-width: 1024px) {
      #printing-documents-root {
        padding-top: calc(var(--announce-height, 44px) + var(--header-height-mobile, 70px) + 1rem);
      }
    }
  </style>
</head>
<body>
  <div id="sierra-header-root"></div>
  <main id="printing-documents-root"></main>
  <div id="sierra-footer-root"></div>

  <script type="module">
    import './firebase-init.js';

    const mount = async (rootId, loader, options = {}) => {
      const root = document.getElementById(rootId);
      if (!root) return;
      try {
        const mod = await loader();
        if (typeof mod.getCartManager === 'function') {
          mod.getCartManager(options);
          return;
        }
        new mod.default(rootId, options);
      } catch (error) {
        console.error(`Erreur composant ${rootId}:`, error);
      }
    };

    mount('sierra-header-root', () => import('./header.js?v=20260829-16'));
    mount('printing-documents-root', () => import('./printing-documents.js?v=20260829-16'));
    mount('sierra-footer-root', () => import('./footer.js'), {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    });
  </script>
</body>
</html>
