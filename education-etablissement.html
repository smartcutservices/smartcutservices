<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131921">
  <title>Établissement | Smart Cut Education</title>
  <meta name="description" content="Fiche détaillée d'un établissement présenté sur Smart Cut Education : présentation, domaines enseignés et formations associées.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./site-foundation.css?v=20260901-1">
  <link rel="stylesheet" href="./education.css?v=20260901-1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
    html, body { width: 100%; max-width: 100%; overflow-x: clip; }
    body {
      font-family: 'Amazon Ember', Arial, Helvetica, sans-serif;
      color: #16181D;
      background: #FFFFFF;
      overflow-x: clip;
    }
    #education-etablissement-root {
      width: 100%;
      max-width: 100%;
      padding-top: calc(var(--header-height, 156px) + .35rem);
    }
    @media (max-width: 1023px) {
      #education-etablissement-root { padding-top: var(--header-height-mobile, 92px); }
    }
    #education-etablissement-boot-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      min-height: 50vh;
      color: #4B5160;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <div id="sierra-header-root"></div>
  <main id="education-etablissement-root">
    <div id="education-etablissement-boot-loading"><i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Chargement de l'établissement...</div>
  </main>
  <div id="sierra-footer-root"></div>

  <script type="module">
    import './firebase-init.js';

    const mount = async (rootId, loader, options = {}) => {
      const root = document.getElementById(rootId);
      if (!root) return;
      try {
        const mod = await loader();
        new mod.default(rootId, options);
      } catch (error) {
        console.error(`Erreur composant ${rootId}:`, error);
      }
    };

    mount('sierra-header-root', () => import('./header.js?v=20260901-1'));
    mount('education-etablissement-root', () => import('./education-etablissement.js?v=20260901-1'));
    mount('sierra-footer-root', () => import('./footer.js'), {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    });
  </script>
</body>
</html>
