<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131921">
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Catalogue | Smart Cut Services</title>
  <meta name="description" content="Parcourez le catalogue Smart Cut Services : produits des vendeurs vérifiés, filtres par catégorie et par ligne, prix en gourdes, livraison locale.">
  <link rel="canonical" href="https://smartcutservices.com/catalogue.html">
  <meta property="og:site_name" content="Smart Cut Services">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catalogue Smart Cut Services">
  <meta property="og:description" content="Produits des vendeurs vérifiés, filtres par catégorie, prix en gourdes, livraison locale.">
  <meta property="og:url" content="https://smartcutservices.com/catalogue.html">
  <meta property="og:image" content="https://smartcutservices.com/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catalogue Smart Cut Services">
  <meta name="twitter:description" content="Produits des vendeurs vérifiés, filtres par catégorie, prix en gourdes.">
  <meta name="twitter:image" content="https://smartcutservices.com/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./tailwind-site.css?v=20260901-1">
  <link rel="stylesheet" href="./site-foundation.css?v=20260901-1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
    html, body { width: 100%; max-width: 100%; overflow-x: clip; }
    html.catalogue-document, body.catalogue-body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Amazon Ember', Arial, Helvetica, sans-serif;
      color: #1f1e1c;
      background:
        radial-gradient(circle at top left, rgba(198, 167, 94, 0.14), transparent 24%),
        linear-gradient(180deg, #fbf7ef 0%, #f2ebde 100%);
      overflow-x: clip;
    }
    #catalogue-page-root {
      width: 100%;
      height: calc(100dvh - var(--header-height, 156px));
      min-height: 0;
      overflow: hidden;
      padding-top: 0;
    }
    #catalogue-section-root { flex: 1; min-height: 0; overflow: hidden; }
    #taxonomy-browser-root { position: relative; z-index: 2; }
    .taxonomy-browser { max-width: 1440px; margin: 0 auto; padding: 20px 24px 12px; background: #fffdf8; border-bottom: 1px solid #eadfcd; }
    .taxonomy-browser header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 10px 0 14px; }
    .taxonomy-browser header p { margin: 0; color: #a06b13; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .taxonomy-browser h1 { margin: 0; color: #172129; font-size: clamp(1.25rem, 2vw, 1.7rem); letter-spacing: -.03em; }
    .taxonomy-browser header span { color: #68737a; font-size: .8rem; }
    .taxonomy-back { border: 0; padding: 0; background: transparent; color: #425057; font: inherit; font-size: .82rem; cursor: pointer; }
    .taxonomy-back:hover { color: #a06b13; }
    .taxonomy-categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: thin; }
    .taxonomy-category { flex: 0 0 min(290px, 78vw); padding: 10px; border: 1px solid #eee3d4; border-radius: 12px; background: #fff; }
    .taxonomy-category > button { display: flex; width: 100%; justify-content: space-between; gap: 10px; border: 0; padding: 0; background: transparent; color: #172129; text-align: left; cursor: pointer; font: inherit; font-size: .84rem; }
    .taxonomy-category > button i { color: #b57b18; }
    .taxonomy-category > div { display: flex; gap: 6px; overflow: hidden; margin-top: 9px; }
    .taxonomy-subcategory { overflow: hidden; flex: 0 1 auto; max-width: 150px; border: 0; border-radius: 999px; padding: 5px 8px; background: #f5f1ea; color: #59656b; cursor: pointer; font: inherit; font-size: .7rem; text-overflow: ellipsis; white-space: nowrap; }
    .taxonomy-subcategory:hover, .taxonomy-subcategory.active { background: #173f3a; color: #fff; }
    .catalogue-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    /* La grille catalogue commence directement par les produits et filtres. */
    #catalogue-page-root .catalogue-header { display: none !important; }
    #catalogue-page-root [class^="catalogue-container-"] {
      width: 100% !important;
      max-width: none !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    @media (max-width: 1023px) {
      #catalogue-page-root {
        height: 100dvh;
        padding-top: var(--header-height-mobile, 92px);
      }
    }
  </style>
</head>
<body class="catalogue-body">
  <div id="sierra-header-root"></div>
  <main id="catalogue-page-root">
    <div class="catalogue-shell">
      <div id="taxonomy-browser-root"></div>
      <div id="catalogue-section-root"></div>
    </div>
  </main>
  <div id="sierra-footer-root"></div>

  <script type="module">
    const ASSET_VERSION = '20260910-1';
    window.SMART_CUT_ASSET_VERSION = ASSET_VERSION;
    await import(`./firebase-init.js?v=${ASSET_VERSION}`);

    const params = new URLSearchParams(window.location.search);
    const initialCategory = params.get('category') || 'all';
    const initialDepartment = params.get('department') || '';
    const initialSubcategory = params.get('subcategory') || '';
    const initialLineKey = params.get('line') || '';
    const openFiltersOnInit = params.get('filters') === 'open';
    const legacyProductId = params.get('product') || '';

    if (legacyProductId) {
      const redirectUrl = new URL('./product.html', window.location.href);
      redirectUrl.searchParams.set('product', legacyProductId);
      window.location.replace(redirectUrl.toString());
    }

    const mount = async (rootId, loader, options = {}) => {
      const root = document.getElementById(rootId);
      if (!root) return;
      try {
        const mod = await loader();
        new mod.default(rootId, options);
      } catch (error) {
        console.error(`Erreur composant ${rootId}:`, error);
      }
    };

    mount('sierra-header-root', () => import(`./header.js?v=${ASSET_VERSION}`));
    mount('catalogue-section-root', () => import(`./categories-section.js?v=${ASSET_VERSION}`), {
      collectionName: 'products',
      productsPerPage: 12,
      initialCategory,
      initialDepartment,
      initialSubcategory,
      initialLineKey,
      openFiltersOnInit,
      imageBasePath: './',
      isInModal: false
    });
    mount('taxonomy-browser-root', () => import(`./taxonomy-browser.js?v=${ASSET_VERSION}`), {
      initialDepartment,
      initialCategory,
      initialSubcategory
    });
    mount('sierra-footer-root', () => import(`./footer.js?v=${ASSET_VERSION}`), {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    });

  </script>
</body>
</html>
