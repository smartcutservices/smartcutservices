<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vérifier un document | SmartCut Services</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f6f8;color:#111827;font-family:Inter,system-ui,sans-serif}.box{width:min(560px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:32px;box-shadow:0 24px 70px rgba(15,23,42,.1)}.mark{display:grid;place-items:center;width:45px;height:45px;border-radius:12px;background:#f59e0b;font-weight:900}h1{font-size:32px;margin:20px 0 8px}p{color:#64748b;line-height:1.65}form{display:flex;gap:8px;margin-top:22px}input{min-width:0;flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:22px;padding:18px;border-radius:12px;background:#f8fafc}.valid{border-left:4px solid #10b981}.invalid{border-left:4px solid #ef4444}.result strong,.result span{display:block}.result span{margin-top:6px;color:#64748b}@media(max-width:500px){form{display:grid}.box{padding:24px}}
  </style>
</head>
<body><main class="box"><span class="mark">SC</span><h1>Vérifier un document</h1><p>Entrez le code figurant au bas de la facture ou du reçu SmartCut. Seules les informations indispensables sont affichées.</p><form id="verifyForm"><label hidden for="code">Code de vérification</label><input id="code" name="code" required autocomplete="off" placeholder="Code de vérification"><button>Vérifier</button></form><div id="result" aria-live="polite"></div></main><script type="module">import{billingApi,money,esc,dateLabel}from'./logiciel proformat/api-v2.js';const f=document.querySelector('#verifyForm'),r=document.querySelector('#result'),q=new URLSearchParams(location.search);document.querySelector('#code').value=q.get('code')||'';f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;r.innerHTML='<div class="result">Vérification…</div>';try{const p=await billingApi('VerifyDocument',{query:{code:new FormData(f).get('code')}}),d=p.document;r.innerHTML=`<div class="result valid"><strong>Document authentique · ${esc(d.status)}</strong><span>${esc(d.number)} · ${money(d.amountMinor)}</span><span>Prestataire : ${esc(d.provider)}</span><span>Date : ${dateLabel(d.date)}</span></div>`}catch(x){r.innerHTML=`<div class="result invalid"><strong>Document non vérifié</strong><span>${esc(x.message)}</span></div>`}finally{b.disabled=false}});if(q.get('code'))f.requestSubmit();</script></body></html>
