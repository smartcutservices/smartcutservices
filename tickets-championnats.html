<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tickets officiels des championnats JwetPro, paiement sécurisé par Smart Cut Services.">
  <title>Tickets & Championnats | Smart Cut Services</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/tailwind-site.css?v=20260830-2">
  <link rel="stylesheet" href="/site-foundation.css?v=20260830-2">
  <link rel="stylesheet" href="/tickets-championnats.css?v=20260821-3">
</head>
<body>
  <div id="sierra-header-root"></div>
  <main>
    <section class="ticket-hero">
      <div>
        <p class="eyebrow">JwetPro</p>
        <h1>Inscriptions ouvertes</h1>
      </div>
      <span id="ticket-count" aria-live="polite"></span>
    </section>
    <section class="catalogue" aria-label="Championnats avec inscription ouverte">
      <div id="ticket-list" class="ticket-grid" aria-live="polite">
        <div class="ticket-state">Chargement…</div>
      </div>
    </section>
  </main>
  <div id="sierra-footer-root"></div>
  <script type="module">
    const ASSET_VERSION = '20260901-1';
    window.SMART_CUT_ASSET_VERSION = ASSET_VERSION;

    const [{ default: Header }, { default: Footer }] = await Promise.all([
      import(`/header.js?v=${ASSET_VERSION}`),
      import(`/footer.js?v=${ASSET_VERSION}`)
    ]);

    new Header('sierra-header-root');
    new Footer('sierra-footer-root', {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    });
  </script>
  <script type="module" src="/tickets-championnats.js?v=20260821-3"></script>
</body>
</html>
