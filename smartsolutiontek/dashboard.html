    // ---------- Workspace lifecycle ----------

    function normalizeCatalog(raw) {
      const defaults = {
        name: '', description: '', logoUrl: null, bannerUrl: null,
        contactInfo: { phone: '', email: '' },
        heroTitle: '', heroSubtitle: '', heroAlign: 'left', heroHeight: 'normal',
        design: { colors: { primary: '#0F172A', accent: '#F59E0B', buttonColor: '#F59E0B', backgroundColor: '#F8FAFC' }, textColor: '#0F172A', font: 'system', radius: 14, density: 'normal', buttonStyle: 'rounded', cardStyle: 'shadow' },
        layout: 'minimal',
        sections: { order: ['hero', 'featured', 'collection', 'trust', 'delivery', 'contact'], visibility: { hero: true, featured: true, collection: true, trust: true, delivery: true, contact: true }, announcement: null },
        delivery: { pickupEnabled: true, pickupAddress: null, pickupHours: null, deliveryEnabled: false, zones: [], freeDeliveryThreshold: null, minOrderAmount: 0, instructions: null, phoneRequired: false },
        seo: { pageTitle: null, description: null, shareImageUrl: null },
        socialLinks: { instagram: null, facebook: null, tiktok: null, whatsapp: null },
        legal: { deliveryPolicy: null, returnPolicy: null, terms: null },
        closedTemporarily: false, closedMessage: null,
        status: 'draft',
      };
      const catalog = { ...defaults, ...(raw || {}) };
      catalog.design = {
        ...defaults.design,
        ...(raw?.design || {}),
        colors: { ...defaults.design.colors, ...(raw?.design?.colors || {}) }
      };
      catalog.contactInfo = { ...defaults.contactInfo, ...(raw?.contactInfo || {}) };
      catalog.sections = { ...defaults.sections, ...(raw?.sections || {}), visibility: { ...defaults.sections.visibility, ...(raw?.sections?.visibility || {}) } };
      catalog.delivery = { ...defaults.delivery, ...(raw?.delivery || {}) };
      catalog.seo = { ...defaults.seo, ...(raw?.seo || {}) };
      catalog.socialLinks = { ...defaults.socialLinks, ...(raw?.socialLinks || {}) };
      catalog.legal = { ...defaults.legal, ...(raw?.legal || {}) };
      return catalog;
    }

    function isShopWsDirty() {
      return !!shopWs && JSON.stringify(shopWs.catalog) !== shopWs.savedJson;
    }
    function isShopWsHttpUrl(value) {
      if (!String(value || '').trim()) return true;
      try { return ['https:', 'http:'].includes(new URL(value).protocol); }
      catch (_) { return false; }
    }
    function shopWsBeforeUnload(e) {
      if (shopWs && isShopWsDirty()) { e.preventDefault(); e.returnValue = ''; }
    }
    function shopWsKeydownHandler(e) {
      if (e.key !== 'Escape') return;
      if (document.querySelector('.sst-shop-ws-drawer-overlay')) return;
      if (shopWs) closeShopWorkspace(false);
    }
    function markShopWsDirty() {
      renderShopWsHeader();
      renderShopWsTabs();
    }
    function setShopWsField(path, value) {
      const parts = path.split('.');
      let obj = shopWs.catalog;
      for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
      obj[parts[parts.length - 1]] = value;
      markShopWsDirty();
    }

    async function openShopWorkspace(org, catalogId) {
      let workingCatalogId = catalogId;
      if (!workingCatalogId) {
        try {
          const result = await callSst('SaveShopCatalog', { method: 'POST', auth: currentUser, body: { organizationId: org.id, name: 'Nouvelle boutique' } });
          workingCatalogId = result.catalogId;
        } catch (error) { showToast(error.message, 'error'); return; }
      }
      const snap = await getDoc(doc(db, 'shopCatalogs', workingCatalogId));
      if (!snap.exists()) { showToast('Boutique introuvable.', 'error'); return; }
      const catalog = normalizeCatalog({ ...snap.data() });
      shopWs = {
        org, catalogId: workingCatalogId, catalog, savedJson: JSON.stringify(catalog),
        products: [], orders: [], unsubProducts: null, unsubOrders: null,
        activeTab: 'apercu', previewDevice: 'desktop', previewCategory: '', previewSearch: '', previewSort: 'relevance',
        productDrawerOverlay: null, productDraft: null
      };
      window.addEventListener('beforeunload', shopWsBeforeUnload);
      document.addEventListener('keydown', shopWsKeydownHandler);
      renderShopWorkspaceShell();
      subscribeShopWsData();
    }

    function subscribeShopWsData() {
      const productsQuery = query(collection(db, 'shopProducts'), where('catalogId', '==', shopWs.catalogId));
      shopWs.unsubProducts = onSnapshot(productsQuery, (snap) => {
        if (!shopWs) return;
        shopWs.products = snap.docs.filter((d) => d.data().status !== 'archived').map((d) => ({ id: d.id, ...d.data() }));
        renderShopWsTabs();
        if (['apercu', 'produits'].includes(shopWs.activeTab)) renderShopWsTabContent();
      });
      const ordersQuery = query(collection(db, 'shopOrders'), where('catalogId', '==', shopWs.catalogId));
      shopWs.unsubOrders = onSnapshot(ordersQuery, (snap) => {
        if (!shopWs) return;
        shopWs.orders = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        renderShopWsTabs();
        if (['apercu', 'commandes'].includes(shopWs.activeTab)) renderShopWsTabContent();
      });
    }

    function closeShopWorkspace(force) {
      if (!shopWs) return;
      if (!force && isShopWsDirty()) {
        if (!confirm('Des modifications ne sont pas enregistrées. Fermer sans enregistrer ?')) return;
      }
      shopWs.unsubProducts?.();
      shopWs.unsubOrders?.();
      window.removeEventListener('beforeunload', shopWsBeforeUnload);
      document.removeEventListener('keydown', shopWsKeydownHandler);
      shopWs.overlay?.remove();
      shopWs = null;
    }

    function renderShopWorkspaceShell() {
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open builder';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML = `
        <div class="sst-modal-full">
          <div class="sst-shop-ws-shell" id="shopWsShell">
            <aside class="sst-shop-ws-sidebar" aria-label="Navigation de la mini boutique">
              <div class="sst-shop-ws-sidebar-brand" id="shopWsSidebarBrand"></div>
              <nav class="sst-shop-ws-tabs" id="shopWsTabs"></nav>
              <div class="sst-shop-ws-sidebar-footer" id="shopWsSidebarFooter"></div>
            </aside>
            <button class="sst-shop-ws-nav-backdrop" id="shopWsNavBackdrop" aria-label="Fermer la navigation"></button>
            <section class="sst-shop-ws-stage">
              <div class="sst-shop-ws-header" id="shopWsHeader"></div>
              <div class="sst-shop-ws-body" id="shopWsBody"></div>
            </section>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      shopWs.overlay = overlay;
      renderShopWsHeader();
      renderShopWsTabs();
      renderShopWsTabContent();
      overlay.querySelector('#shopWsNavBackdrop').addEventListener('click', () => toggleShopWsMobileNav(false));
    }

    function applyShopWsChromeTheme() {
      if (!shopWs?.overlay) return;
      const colors = shopWs.catalog.design?.colors || {};
      const primary = /^#[0-9a-f]{6}$/i.test(colors.primary) ? colors.primary : '#0F2747';
      const accent = /^#[0-9a-f]{6}$/i.test(colors.buttonColor || colors.accent) ? (colors.buttonColor || colors.accent) : '#F59E0B';
      const onBrand = (contrastRatio(primary, '#FFFFFF') || 0) >= 4.5 ? '#FFFFFF' : '#101828';
      const onAccent = (contrastRatio(accent, '#FFFFFF') || 0) >= (contrastRatio(accent, '#111827') || 0) ? '#FFFFFF' : '#111827';
      shopWs.overlay.style.setProperty('--shop-ws-brand', primary);
      shopWs.overlay.style.setProperty('--shop-ws-accent', accent);
      shopWs.overlay.style.setProperty('--shop-ws-on-brand', onBrand);
      shopWs.overlay.style.setProperty('--shop-ws-on-accent', onAccent);
    }

    function toggleShopWsMobileNav(open) {
      document.getElementById('shopWsShell')?.classList.toggle('nav-open', open);
    }

    function switchShopWsTab(tabId) {
      if (!SHOP_WS_TABS.some((tab) => tab.id === tabId)) return;
      shopWs.activeTab = tabId;
      toggleShopWsMobileNav(false);
      renderShopWsTabs();
      renderShopWsTabContent();
    }

    function renderShopWsHeader() {
      if (!shopWs) return;
      const el = document.getElementById('shopWsHeader');
      if (!el) return;
      const c = shopWs.catalog;
      const statusLabel = c.status === 'published' ? 'Publiée' : c.status === 'suspended' ? 'Suspendue' : c.status === 'archived' ? 'Archivée' : 'Brouillon';
      const dirty = isShopWsDirty();
      const activeTab = SHOP_WS_TABS.find((tab) => tab.id === shopWs.activeTab) || SHOP_WS_TABS[0];
      applyShopWsChromeTheme();
      el.innerHTML = `
        <div class="sst-shop-ws-identity">
          <button class="sst-shop-ws-mobile-nav" id="wsMobileNav" aria-label="Ouvrir la navigation"><i class="fas fa-bars"></i></button>
          <div><span>Mini boutique</span><h3>${escapeHtml(activeTab.label)}</h3><p>${escapeHtml(activeTab.description)}</p></div>
        </div>
        <div class="sst-shop-ws-actions">
          ${c.status === 'published' ? `<a class="sst-btn sst-btn-secondary" href="./page.html?app=shops&catalogId=${shopWs.catalogId}&org=${shopWs.org.id}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> Voir en ligne</a>` : ''}
          <span class="sst-shop-ws-save-state ${dirty ? 'dirty' : 'saved'}"><i class="fas ${dirty ? 'fa-circle' : 'fa-circle-check'}"></i> ${dirty ? 'Modifications à enregistrer' : 'Tout est enregistré'}</span>
          <button class="sst-btn sst-btn-secondary" id="wsSave"><i class="fas fa-floppy-disk"></i> Enregistrer</button>
          ${c.status === 'published'
            ? `<button class="sst-btn sst-btn-secondary sst-btn-quiet" id="wsUnpublish">Dépublier</button>`
            : `<button class="sst-btn sst-btn-primary" id="wsPublish"><i class="fas fa-rocket"></i> Publier</button>`}
        </div>
      `;
      el.querySelector('#wsMobileNav').addEventListener('click', () => toggleShopWsMobileNav(true));
      el.querySelector('#wsSave').addEventListener('click', () => saveShopWorkspace({}));
      el.querySelector('#wsPublish')?.addEventListener('click', () => publishShopWorkspace());
      el.querySelector('#wsUnpublish')?.addEventListener('click', () => unpublishShopWorkspace());
    }

    function renderShopWsTabs() {
      if (!shopWs) return;
      const el = document.getElementById('shopWsTabs');
      if (!el) return;
      applyShopWsChromeTheme();
      const c = shopWs.catalog;
      const statusLabel = c.status === 'published' ? 'En ligne' : c.status === 'suspended' ? 'Suspendue' : 'Brouillon';
      const checklist = computeShopChecklist(c, shopWs.products);
      const completeCount = checklist.filter((item) => item.ok).length;
      const progress = Math.round((completeCount / checklist.length) * 100);
      const openOrders = shopWs.orders.filter((order) => !['delivered', 'cancelled'].includes(order.status)).length;
      const counts = { produits: shopWs.products.length || '', commandes: openOrders || '' };
      const brand = document.getElementById('shopWsSidebarBrand');
      if (brand) brand.innerHTML = `
        <button class="sst-shop-ws-back" id="wsClose"><i class="fas fa-arrow-left"></i><span>Toutes les boutiques</span></button>
        <div class="sst-shop-ws-brand-card">
          <span class="sst-shop-ws-brand-mark">${c.logoUrl ? `<img src="${escapeHtml(c.logoUrl)}" alt="">` : `<i class="fas fa-store"></i>`}</span>
          <div><strong>${escapeHtml(c.name || 'Nouvelle boutique')}</strong><span><i></i>${statusLabel}</span></div>
        </div>`;
      brand?.querySelector('#wsClose')?.addEventListener('click', () => closeShopWorkspace(false));
      el.innerHTML = SHOP_WS_TABS.map((t) => `<button class="sst-shop-ws-tab ${shopWs.activeTab === t.id ? 'active' : ''}" data-ws-tab="${t.id}"><span class="sst-shop-ws-tab-icon"><i class="fas ${t.icon}"></i></span><span class="sst-shop-ws-tab-copy"><strong>${t.label}</strong><small>${t.description}</small></span>${counts[t.id] ? `<b>${counts[t.id]}</b>` : ''}</button>`).join('');
      el.querySelectorAll('[data-ws-tab]').forEach((btn) => btn.addEventListener('click', () => {
        switchShopWsTab(btn.dataset.wsTab);
      }));
      const footer = document.getElementById('shopWsSidebarFooter');
      if (footer) footer.innerHTML = `
        <div class="sst-shop-ws-readiness"><div><span>Prête à vendre</span><strong>${progress}%</strong></div><div class="sst-shop-ws-progress"><i style="width:${progress}%"></i></div><small>${completeCount}/${checklist.length} éléments essentiels complétés</small></div>
        <button class="sst-shop-ws-help" data-ws-tab="apercu"><i class="fas fa-lightbulb"></i><span><strong>Conseils boutique</strong><small>Voir les priorités du jour</small></span></button>`;
      footer?.querySelector('[data-ws-tab]')?.addEventListener('click', () => switchShopWsTab('apercu'));
    }

    function renderShopWsTabContent() {
      if (!shopWs) return;
      const el = document.getElementById('shopWsBody');
      if (!el) return;
      renderShopWsHeader();
      const renderers = { apercu: renderShopWsApercu, design: renderShopWsDesign, produits: renderShopWsProduits, commandes: renderShopWsCommandes, livraison: renderShopWsLivraison, marketing: renderShopWsMarketing, parametres: renderShopWsParametres };
      el.innerHTML = '';
      renderers[shopWs.activeTab](el);
    }

    async function saveShopWorkspace({ silent } = {}) {
      const c = shopWs.catalog;
      if (!String(c.name || '').trim()) { showToast('Le nom de la boutique est requis.', 'error'); return false; }
      const publicUrls = [c.seo?.shareImageUrl, c.socialLinks?.instagram, c.socialLinks?.facebook, c.socialLinks?.tiktok, c.socialLinks?.whatsapp];
      if (publicUrls.some((value) => !isShopWsHttpUrl(value))) {
        showToast('Les liens publics doivent commencer par https:// ou http://.', 'error');
        switchShopWsTab('marketing');
        return false;
      }
      try {
        await callSst('SaveShopCatalog', {
          method: 'POST', auth: currentUser,
          body: {
            organizationId: shopWs.org.id, catalogId: shopWs.catalogId,
            name: c.name, description: c.description, logoUrl: c.logoUrl, bannerUrl: c.bannerUrl,
            contactInfo: c.contactInfo, heroTitle: c.heroTitle, heroSubtitle: c.heroSubtitle,
            heroAlign: c.heroAlign, heroHeight: c.heroHeight, colors: c.design.colors, design: c.design,
            layout: c.layout, sections: c.sections, delivery: c.delivery, seo: c.seo,
            socialLinks: c.socialLinks, legal: c.legal, closedTemporarily: c.closedTemporarily, closedMessage: c.closedMessage
          }
        });
        shopWs.savedJson = JSON.stringify(c);
        if (!silent) showToast('Boutique enregistrée.');
        renderShopWsHeader();
        return true;
      } catch (error) {
        showToast(error.message, 'error');
        return false;
      }
    }

    function computeShopChecklist(catalog, products) {
      return [
        { label: 'Nom de la boutique renseigné', ok: !!String(catalog.name || '').trim(), tab: 'design' },
        { label: 'Au moins un produit publié', ok: products.some((p) => p.status === 'published'), tab: 'produits' },
        { label: 'Coordonnées de contact renseignées', ok: !!(catalog.contactInfo?.phone || catalog.contactInfo?.email), tab: 'parametres' },
        { label: 'Un mode de retrait ou de livraison est activé', ok: !!(catalog.delivery?.pickupEnabled || catalog.delivery?.deliveryEnabled), tab: 'livraison' }
      ];
    }

    async function publishShopWorkspace() {
      const checklist = computeShopChecklist(shopWs.catalog, shopWs.products);
      if (checklist.some((i) => !i.ok)) {
        showToast('Complétez la checklist avant de publier (onglet Aperçu).', 'error');
        shopWs.activeTab = 'apercu';
        renderShopWsTabs();
        renderShopWsTabContent();
        return;
      }
      if (isShopWsDirty()) { const ok = await saveShopWorkspace({ silent: true }); if (!ok) return; }
      try {
        await callSst('SetCatalogStatus', { method: 'POST', auth: currentUser, body: { organizationId: shopWs.org.id, catalogId: shopWs.catalogId, status: 'published' } });
        shopWs.catalog.status = 'published';
        showToast('Boutique publiée.');
        renderShopWsHeader();
      } catch (error) { showToast(error.message, 'error'); }
    }
    async function unpublishShopWorkspace() {
      if (!confirm('Dépublier la boutique ? Elle ne sera plus visible publiquement.')) return;
      try {
        await callSst('SetCatalogStatus', { method: 'POST', auth: currentUser, body: { organizationId: shopWs.org.id, catalogId: shopWs.catalogId, status: 'suspended' } });
        shopWs.catalog.status = 'suspended';
        showToast('Boutique dépubliée.');
        renderShopWsHeader();
      } catch (error) { showToast(error.message, 'error'); }
    }

    // ---------- Aperçu tab (live preview shared with the public page) ----------

    function renderShopWsApercu(el) {
      const c = shopWs.catalog;
      const products = shopWs.products;
      const publishedProducts = products.filter((p) => p.status === 'published');
      const checklist = computeShopChecklist(c, products);
      const orders = shopWs.orders;
      const confirmedOrders = orders.filter((o) => !['pending_payment', 'cancelled'].includes(o.status));
      const revenue = confirmedOrders.reduce((s, o) => s + Number(o.amountDue || 0), 0);
      const avgBasket = confirmedOrders.length ? revenue / confirmedOrders.length : 0;
      const outOfStock = products.filter((p) => p.type !== 'digital' && Number(p.stock || 0) <= 0).length;
      const lowStockProducts = products.filter((p) => p.type !== 'digital' && Number(p.stock || 0) > 0 && Number(p.stock || 0) <= Number(p.lowStockThreshold || 3));
      const activeOrders = orders.filter((o) => !['delivered', 'cancelled'].includes(o.status));
      const completed = checklist.filter((item) => item.ok).length;
      const progress = Math.round((completed / checklist.length) * 100);
      const recentOrders = orders.slice(0, 5);

      el.innerHTML = `
        <div class="sst-shop-ws-panel sst-shop-ws-panel-wide">
          <section class="sst-shop-ws-welcome">
            <div><span>Centre de pilotage</span><h2>Bonjour, votre boutique est ${c.status === 'published' ? 'en ligne' : 'presque prête'}.</h2><p>Suivez les ventes, traitez les urgences et améliorez votre vitrine depuis un seul endroit.</p></div>
            <div class="sst-shop-ws-quick-actions">
              <button data-dashboard-action="product"><i class="fas fa-plus"></i><span><strong>Ajouter un produit</strong><small>Enrichir le catalogue</small></span></button>
              <button data-dashboard-action="orders"><i class="fas fa-bag-shopping"></i><span><strong>Traiter les commandes</strong><small>${activeOrders.length} en cours</small></span></button>
              <button data-dashboard-action="design"><i class="fas fa-wand-magic-sparkles"></i><span><strong>Personnaliser</strong><small>Couleurs et vitrine</small></span></button>
            </div>
          </section>
          <div class="sst-shop-ws-stat-grid">
            <div class="sst-shop-ws-stat-card accent"><span><i class="fas fa-chart-line"></i> Chiffre d’affaires</span><strong>${formatCurrency(revenue)}</strong><small>${confirmedOrders.length} commande${confirmedOrders.length > 1 ? 's' : ''} confirmée${confirmedOrders.length > 1 ? 's' : ''}</small></div>
            <div class="sst-shop-ws-stat-card"><span><i class="fas fa-bag-shopping"></i> À traiter</span><strong>${activeOrders.length}</strong><small>sur ${orders.length} commande${orders.length > 1 ? 's' : ''}</small></div>
            <div class="sst-shop-ws-stat-card"><span><i class="fas fa-basket-shopping"></i> Panier moyen</span><strong>${formatCurrency(avgBasket)}</strong><small>Valeur moyenne confirmée</small></div>
            <div class="sst-shop-ws-stat-card"><span><i class="fas fa-boxes-stacked"></i> Catalogue actif</span><strong>${publishedProducts.length}</strong><small>${products.length} produit${products.length > 1 ? 's' : ''} au total</small></div>
          </div>
          <div class="sst-shop-ws-dashboard-grid">
            <section class="sst-shop-ws-section sst-shop-ws-priorities">
              <div class="sst-shop-ws-section-title"><div><span>À faire maintenant</span><h4>Priorités de la boutique</h4></div><b>${progress}% prête</b></div>
              <div class="sst-shop-ws-progress large"><i style="width:${progress}%"></i></div>
              <ul class="sst-shop-ws-checklist">${checklist.map((item) => `<li class="${item.ok ? 'ok' : 'missing'}"><i class="fas ${item.ok ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${escapeHtml(item.label)}</span>${item.ok ? '' : `<button data-dashboard-fix-tab="${item.tab}">Corriger</button>`}</li>`).join('')}</ul>
              ${(outOfStock || lowStockProducts.length) ? `<div class="sst-shop-ws-alert"><i class="fas fa-box-open"></i><div><strong>${outOfStock} rupture${outOfStock > 1 ? 's' : ''}, ${lowStockProducts.length} stock${lowStockProducts.length > 1 ? 's' : ''} faible${lowStockProducts.length > 1 ? 's' : ''}</strong><span>Vérifiez les quantités pour éviter les ventes impossibles.</span></div><button data-dashboard-action="products">Gérer</button></div>` : `<div class="sst-shop-ws-success"><i class="fas fa-circle-check"></i> Aucun problème de stock détecté.</div>`}
            </section>
            <section class="sst-shop-ws-section">
              <div class="sst-shop-ws-section-title"><div><span>Activité récente</span><h4>Dernières commandes</h4></div><button data-dashboard-action="orders">Tout voir</button></div>
              ${recentOrders.length ? `<div class="sst-shop-ws-recent-orders">${recentOrders.map((order) => `<button data-dashboard-order="${order.id}"><span class="sst-shop-ws-order-icon"><i class="fas fa-bag-shopping"></i></span><span><strong>${escapeHtml(order.customerName || 'Client')}</strong><small>${formatSubmissionDate(order.createdAt)} · ${SHOP_ORDER_STATUS_LABELS[order.status] || order.status}</small></span><b>${formatCurrency(order.amountDue)}</b></button>`).join('')}</div>` : '<div class="sst-shop-ws-mini-empty"><i class="fas fa-receipt"></i><span><strong>Aucune commande reçue</strong><small>Les nouvelles ventes apparaîtront ici.</small></span></div>'}
            </section>
          </div>
          <div class="sst-shop-ws-preview-heading"><div><span>Aperçu en direct</span><h3>Ce que voient vos clients</h3></div>
          <div class="sst-shop-ws-preview-toolbar">
            <button class="sst-shop-ws-device-btn ${shopWs.previewDevice === 'desktop' ? 'active' : ''}" data-preview-device="desktop" aria-label="Aperçu bureau"><i class="fas fa-desktop"></i></button>
            <button class="sst-shop-ws-device-btn ${shopWs.previewDevice === 'mobile' ? 'active' : ''}" data-preview-device="mobile" aria-label="Aperçu mobile"><i class="fas fa-mobile-screen"></i></button>
          </div>
          </div>
          <div class="sst-shop-ws-preview-viewport">
            <div class="sst-shop-preview-frame ${shopWs.previewDevice === 'mobile' ? 'mobile' : ''}" id="shopWsPreviewFrame"></div>
          </div>
        </div>
      `;
      el.querySelectorAll('[data-preview-device]').forEach((btn) => btn.addEventListener('click', () => {
        shopWs.previewDevice = btn.dataset.previewDevice;
        renderShopWsApercu(el);
      }));
      el.querySelectorAll('[data-dashboard-action]').forEach((btn) => btn.addEventListener('click', () => {
        const action = btn.dataset.dashboardAction;
        if (action === 'product') { switchShopWsTab('produits'); openProductDrawer(null); return; }
        if (action === 'orders') { switchShopWsTab('commandes'); return; }
        if (action === 'design') { switchShopWsTab('design'); return; }
        if (action === 'products') { shopWsProductFilter.sort = 'stock'; switchShopWsTab('produits'); return; }
      }));
      el.querySelectorAll('[data-dashboard-fix-tab]').forEach((btn) => btn.addEventListener('click', () => switchShopWsTab(btn.dataset.dashboardFixTab)));
      el.querySelectorAll('[data-dashboard-order]').forEach((btn) => btn.addEventListener('click', () => {
        const order = orders.find((item) => item.id === btn.dataset.dashboardOrder);
        if (order) openOrderDrawer(order);
      }));
      renderShopWsPreviewFrame();
    }

    function renderShopWsPreviewFrame() {
      const frame = document.getElementById('shopWsPreviewFrame');
      if (!frame) return;
      const catalog = shopWs.catalog;
      const products = shopWs.products.filter(isPublicShopProductClient).map(toPublicProductShapeClient);
      frame.className = `sst-shop-preview-frame ${shopWs.previewDevice === 'mobile' ? 'mobile' : ''}`;
      frame.innerHTML = `
        <div class="sst-shop-shell">
          ${renderAnnouncementBar(catalog)}
          ${renderClosedBanner(catalog)}
          ${renderShopNav(catalog, 0)}
          ${renderShopHero(catalog)}
          ${renderSectionsInOrder(catalog, products, { activeCategory: shopWs.previewCategory, searchTerm: shopWs.previewSearch, sort: shopWs.previewSort })}
          ${renderShopFooter(catalog)}
        </div>
      `;
      applyShopTheme(frame, catalog);
      frame.querySelectorAll('[data-shop-cat]').forEach((btn) => btn.addEventListener('click', () => { shopWs.previewCategory = btn.dataset.shopCat; renderShopWsPreviewFrame(); }));
      frame.querySelector('#shopSearchInput')?.addEventListener('input', (e) => { shopWs.previewSearch = e.target.value; renderShopWsPreviewFrame(); });
      frame.querySelector('#shopSortSelect')?.addEventListener('change', (e) => { shopWs.previewSort = e.target.value; renderShopWsPreviewFrame(); });
      frame.querySelectorAll('[data-open-product]').forEach((btn) => btn.addEventListener('click', () => {
        const product = products.find((p) => p.id === btn.dataset.openProduct);
        if (product) showToast(`Aperçu : « ${product.name} ». La fiche complète est visible sur la boutique publique.`);
      }));
    }

    // ---------- Design tab ----------

    function renderShopWsSectionsList() {
      const c = shopWs.catalog;
      const order = c.sections.order.filter((id) => REORDERABLE_SECTIONS.includes(id));
      return `<div class="sst-shop-ws-product-list">${order.map((id, i) => `
        <div class="sst-shop-ws-product-row" style="grid-template-columns:minmax(0,1fr) auto auto;">
          <span class="sst-shop-ws-product-name">${SECTION_LABELS[id] || id}</span>
          <label style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;">
            <input type="checkbox" data-section-visible="${id}" ${c.sections.visibility[id] !== false ? 'checked' : ''}> Visible
          </label>
          <div class="sst-shop-ws-product-actions">
            <button class="sst-builder-icon-btn" data-section-move="${id}:-1" ${i === 0 ? 'disabled' : ''} aria-label="Monter"><i class="fas fa-chevron-up"></i></button>
            <button class="sst-builder-icon-btn" data-section-move="${id}:1" ${i === order.length - 1 ? 'disabled' : ''} aria-label="Descendre"><i class="fas fa-chevron-down"></i></button>
          </div>
        </div>
      `).join('')}</div>`;
    }
    function bindSectionsListEvents(container) {
      container.querySelectorAll('[data-section-visible]').forEach((input) => input.addEventListener('change', (e) => {
        shopWs.catalog.sections.visibility[e.target.dataset.sectionVisible] = e.target.checked;
        markShopWsDirty();
      }));
      container.querySelectorAll('[data-section-move]').forEach((btn) => btn.addEventListener('click', () => {
        const [id, dir] = btn.dataset.sectionMove.split(':');
        moveShopWsSection(id, Number(dir));
      }));
    }
    function moveShopWsSection(id, dir) {
      const order = shopWs.catalog.sections.order.filter((x) => REORDERABLE_SECTIONS.includes(x));
      const i = order.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      shopWs.catalog.sections.order = ['hero', ...order];
      markShopWsDirty();
      const listEl = document.getElementById('wSectionsList');
      if (listEl) { listEl.innerHTML = renderShopWsSectionsList(); bindSectionsListEvents(listEl); }
    }

            <div class="sst-field"><label class="sst-label" for="wDesc">Description</label><textarea class="sst-textarea" id="wDesc" rows="3">${escapeHtml(c.description || '')}</textarea></div>

                <div class="sst-upload-status" id="wLogoStatus" role="status"></div>
              </div>
              <div class="sst-personalize-upload-card" data-shop-upload-card="banner">
                <div class="sst-personalize-upload-preview">${preview(c.bannerUrl, 'image')}</div>
                <div class="sst-personalize-upload-copy"><strong>Image du hero</strong><span>Paysage recommandé · 8 Mo max.</span></div>
                <input class="sst-visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" id="wBannerFile">
                <label class="sst-upload-trigger" for="wBannerFile"><i class="fas fa-arrow-up-from-bracket"></i> ${c.bannerUrl ? 'Remplacer' : 'Choisir'}</label>
                <button class="sst-upload-remove" data-remove-shop-image="banner" style="${c.bannerUrl ? '' : 'display:none;'}" aria-label="Retirer l’image"><i class="fas fa-trash"></i></button>
                <div class="sst-upload-status" id="wBannerStatus" role="status"></div>
              </div>
            </div>
          </section>

          <section class="sst-shop-ws-section">
            <h4>Hero</h4><p class="sst-hint">La première chose que voit un visiteur.</p>
            <div class="sst-grid cols-2" id="wHeroContentFields" style="${c.layout === 'image' ? 'display:none;' : ''}">
              <div class="sst-field"><label class="sst-label" for="wHeroTitle">Titre</label><input class="sst-input" id="wHeroTitle" value="${escapeHtml(c.heroTitle || '')}" placeholder="Par défaut : nom de la boutique"></div>
              <div class="sst-field"><label class="sst-label" for="wHeroSubtitle">Sous-titre</label><input class="sst-input" id="wHeroSubtitle" value="${escapeHtml(c.heroSubtitle || '')}"></div>
            </div>
            <div class="sst-grid cols-3">
              <div class="sst-field"><label class="sst-label" for="wLayout">Présentation</label><select class="sst-select" id="wLayout">
                <option value="minimal" ${c.layout === 'minimal' ? 'selected' : ''}>Sans image</option>
                <option value="hero" ${c.layout === 'hero' ? 'selected' : ''}>Image à droite</option>
                <option value="cover" ${c.layout === 'cover' ? 'selected' : ''}>Texte sur l'image</option>
                <option value="image" ${c.layout === 'image' ? 'selected' : ''}>Image uniquement (sans texte)</option>
              </select></div>
              <div class="sst-field" id="wHeroAlignField" style="${c.layout === 'image' ? 'display:none;' : ''}"><label class="sst-label" for="wHeroAlign">Alignement</label><select class="sst-select" id="wHeroAlign">
                <option value="left" ${c.heroAlign === 'left' ? 'selected' : ''}>Gauche</option>
                <option value="center" ${c.heroAlign === 'center' ? 'selected' : ''}>Centré</option>
              </select></div>
              <div class="sst-field"><label class="sst-label" for="wHeroHeight">Hauteur</label><select class="sst-select" id="wHeroHeight">
                <option value="compact" ${c.heroHeight === 'compact' ? 'selected' : ''}>Compacte</option>
                <option value="normal" ${c.heroHeight === 'normal' ? 'selected' : ''}>Normale</option>
                <option value="immersive" ${c.heroHeight === 'immersive' ? 'selected' : ''}>Immersive</option>
              </select></div>
            </div>
            <div class="sst-shop-ws-image-only-note" id="wHeroImageOnlyNote" style="${c.layout === 'image' ? '' : 'display:none;'}"><i class="fas fa-image"></i><span><strong>Hero 100 % visuel</strong><small>${c.bannerUrl ? 'Seule l’image de couverture sera affichée. Le logo, le titre, le sous-titre et le bouton seront masqués.' : 'Ajoutez une image de couverture ci-dessus. Tant qu’aucune image n’est disponible, aucun hero ne sera affiché.'}</small></span></div>

          <section class="sst-shop-ws-section">
            <h4>Presets</h4><p class="sst-hint">Un point de départ professionnel, à ajuster librement.</p>

          </section>

          <section class="sst-shop-ws-section">
            <h4>Palette de marque</h4><p class="sst-hint">Chaque couleur a un rôle précis. Le header et l’aside de ce dashboard reflètent instantanément votre couleur principale.</p>
            <div class="sst-shop-ws-palette-preview" style="--preview-primary:${primary};--preview-primary-text:${primaryText};--preview-accent:${accent};--preview-bg:${background};--preview-text:${text};--preview-accent-text:${accentText}">
              <div class="sst-shop-ws-palette-nav"><i class="fas fa-store"></i><span>${escapeHtml(c.name || 'Votre boutique')}</span><button>Voir la boutique</button></div>
              <div class="sst-shop-ws-palette-page"><span>Nouveau produit</span><strong>Une palette cohérente sur toute l’expérience</strong><button>Ajouter au panier</button></div>
            </div>
            <div class="sst-shop-ws-color-grid">
              <div><strong>Navigation &amp; identité</strong><small>Header, aside, pied de page</small>${renderColorControl('primary', 'Couleur principale', primary, ['#111827', '#0F2747', '#064E3B', '#581C87', '#7C2D12'])}</div>
              <div><strong>Actions commerciales</strong><small>Boutons, liens et promotions</small>${renderColorControl('button', 'Couleur d’accent', accent, ['#C2410C', '#0071E3', '#059669', '#EA580C', '#DC2626'])}</div>
              <div><strong>Surface de la boutique</strong><small>Fond général de vos pages</small>${renderColorControl('bg', 'Arrière-plan', background, ['#F5F5F7', '#FFFFFF', '#FBF6F1', '#F4F4F5', '#F0FDF4'])}</div>
              <div><strong>Contenu principal</strong><small>Titres et textes importants</small>${renderColorControl('text', 'Couleur du texte', text, ['#111827', '#1F2937', '#334155', '#3F3F46', '#292524'])}</div>
            </div>
            ${primaryContrast !== null && primaryContrast < 4.5 ? `<div class="sst-shop-ws-contrast-warning"><i class="fas fa-triangle-exclamation"></i> La couleur de navigation manque de contraste avec un texte clair (${primaryContrast}:1). Le dashboard adapte automatiquement le texte, mais choisissez une teinte plus sombre pour une identité plus forte.</div>` : ''}
          </section>

          <section class="sst-shop-ws-section">
            <h4>Typographie &amp; style</h4>
            <div class="sst-grid cols-2">
              <div class="sst-field"><label class="sst-label" for="wFont">Police</label><select class="sst-select" id="wFont">
                <option value="system" ${c.design.font === 'system' ? 'selected' : ''}>Sans-serif (moderne)</option>
                <option value="serif" ${c.design.font === 'serif' ? 'selected' : ''}>Serif (élégant)</option>
                <option value="mono" ${c.design.font === 'mono' ? 'selected' : ''}>Mono (technique)</option>
              </select></div>
              <div class="sst-field"><label class="sst-label" for="wDensity">Densité</label><select class="sst-select" id="wDensity">
                <option value="compact" ${c.design.density === 'compact' ? 'selected' : ''}>Compacte</option>
                <option value="normal" ${c.design.density === 'normal' ? 'selected' : ''}>Normale</option>
                <option value="spacious" ${c.design.density === 'spacious' ? 'selected' : ''}>Spacieuse</option>
              </select></div>
              <div class="sst-field"><label class="sst-label" for="wButtonStyle">Boutons</label><select class="sst-select" id="wButtonStyle">
                <option value="pill" ${c.design.buttonStyle === 'pill' ? 'selected' : ''}>Arrondis</option>
                <option value="rounded" ${c.design.buttonStyle === 'rounded' ? 'selected' : ''}>Légèrement arrondis</option>

              <div class="sst-field"><label class="sst-label" for="wCardStyle">Cartes produits</label><select class="sst-select" id="wCardStyle">
                <option value="flat" ${c.design.cardStyle === 'flat' ? 'selected' : ''}>Épurées</option>
                <option value="bordered" ${c.design.cardStyle === 'bordered' ? 'selected' : ''}>Bordées</option>

              </select></div>
              <div class="sst-field sst-shop-ws-radius-field"><label class="sst-label" for="wRadius">Arrondi des cartes <span id="wRadiusValue">${Number(c.design.radius ?? 14)} px</span></label><input type="range" id="wRadius" min="0" max="24" step="2" value="${Number(c.design.radius ?? 14)}"></div>

          <section class="sst-shop-ws-section">
            <h4>Sections de la page</h4><p class="sst-hint">Activez et réordonnez les sections de votre boutique (le hero reste toujours en premier).</p>
            <div id="wSectionsList">${renderShopWsSectionsList()}</div>
          </section>

        </div>
      `;
      bindShopWsDesignEvents(el);
    }

    function bindShopWsDesignEvents(el) {
      el.querySelector('#wName').addEventListener('input', (e) => setShopWsField('name', e.target.value));
      el.querySelector('#wDesc').addEventListener('input', (e) => setShopWsField('description', e.target.value));
      el.querySelector('#wHeroTitle').addEventListener('input', (e) => setShopWsField('heroTitle', e.target.value));
      el.querySelector('#wHeroSubtitle').addEventListener('input', (e) => setShopWsField('heroSubtitle', e.target.value));
      el.querySelector('#wLayout').addEventListener('change', (e) => {
        const imageOnly = e.target.value === 'image';
        setShopWsField('layout', e.target.value);
        el.querySelector('#wHeroContentFields').style.display = imageOnly ? 'none' : '';
        el.querySelector('#wHeroAlignField').style.display = imageOnly ? 'none' : '';
        el.querySelector('#wHeroImageOnlyNote').style.display = imageOnly ? '' : 'none';
      });
      el.querySelector('#wHeroAlign').addEventListener('change', (e) => setShopWsField('heroAlign', e.target.value));
      el.querySelector('#wHeroHeight').addEventListener('change', (e) => setShopWsField('heroHeight', e.target.value));
      el.querySelector('#wFont').addEventListener('change', (e) => setShopWsField('design.font', e.target.value));
      el.querySelector('#wDensity').addEventListener('change', (e) => setShopWsField('design.density', e.target.value));
      el.querySelector('#wButtonStyle').addEventListener('change', (e) => setShopWsField('design.buttonStyle', e.target.value));
      el.querySelector('#wCardStyle').addEventListener('change', (e) => setShopWsField('design.cardStyle', e.target.value));
      el.querySelector('#wRadius').addEventListener('input', (e) => {
        const radius = Number(e.target.value);
        el.querySelector('#wRadiusValue').textContent = `${radius} px`;
        setShopWsField('design.radius', radius);
      });

      el.querySelectorAll('[data-design-preset]').forEach((btn) => btn.addEventListener('click', () => {
        const preset = DESIGN_PRESETS.find((p) => p.id === btn.dataset.designPreset);
        if (!preset) return;
        shopWs.catalog.design = { ...shopWs.catalog.design, ...preset.design, colors: { ...preset.design.colors } };
        markShopWsDirty();
        renderShopWsDesign(el);
      }));

      el.querySelector('#wLogoFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.disabled = true;
        el.querySelector('#wLogoStatus').textContent = 'Téléversement en cours…';
        try {
          const uploaded = await uploadImageFile(file, `sst-shops/${shopWs.catalogId}`, { maxSizeMb: 8 });
          setShopWsField('logoUrl', uploaded.url);
          renderShopWsDesign(el);
        } catch (error) { el.querySelector('#wLogoStatus').textContent = error.message || 'Échec du téléversement.'; }
        finally { e.target.disabled = false; }
      });
      el.querySelector('#wBannerFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.disabled = true;
        el.querySelector('#wBannerStatus').textContent = 'Téléversement en cours…';
        try {
          const uploaded = await uploadImageFile(file, `sst-shops/${shopWs.catalogId}`, { maxSizeMb: 8 });
          setShopWsField('bannerUrl', uploaded.url);
          if (shopWs.catalog.layout === 'minimal') setShopWsField('layout', 'hero');
          renderShopWsDesign(el);
        } catch (error) { el.querySelector('#wBannerStatus').textContent = error.message || 'Échec du téléversement.'; }
        finally { e.target.disabled = false; }
      });
      el.querySelectorAll('[data-remove-shop-image]').forEach((btn) => btn.addEventListener('click', () => {
        if (btn.dataset.removeShopImage === 'logo') setShopWsField('logoUrl', null);
        if (btn.dataset.removeShopImage === 'banner') setShopWsField('bannerUrl', null);
        renderShopWsDesign(el);
      }));

      const applyColor = (key, rawValue) => {
        const value = String(rawValue || '').trim();
        if (!/^#[0-9a-f]{6}$/i.test(value)) return false;
        if (key === 'primary') setShopWsField('design.colors.primary', value);
        if (key === 'button') { setShopWsField('design.colors.buttonColor', value); setShopWsField('design.colors.accent', value); }
        if (key === 'bg') setShopWsField('design.colors.backgroundColor', value);
        if (key === 'text') setShopWsField('design.textColor', value);
        const picker = el.querySelector(`[data-color-picker="${key}"]`);
        const hex = el.querySelector(`[data-color-hex="${key}"]`);
        const label = picker?.closest('.sst-color-control')?.querySelector('.sst-color-control-label span');
        const palettePreview = el.querySelector('.sst-shop-ws-palette-preview');
        if (picker) picker.value = value;
        if (hex) hex.value = value.toUpperCase();
        if (label) label.textContent = value.toUpperCase();
        if (palettePreview) {
          if (key === 'primary') {
            palettePreview.style.setProperty('--preview-primary', value);
            const whiteRatio = contrastRatio(value, '#FFFFFF') || 0;
            const darkRatio = contrastRatio(value, '#111827') || 0;
            palettePreview.style.setProperty('--preview-primary-text', whiteRatio >= darkRatio ? '#FFFFFF' : '#111827');
          }
          if (key === 'button') {
            palettePreview.style.setProperty('--preview-accent', value);
            const whiteRatio = contrastRatio(value, '#FFFFFF') || 0;
            const darkRatio = contrastRatio(value, '#111827') || 0;
            palettePreview.style.setProperty('--preview-accent-text', whiteRatio >= darkRatio ? '#FFFFFF' : '#111827');
          }
          if (key === 'bg') palettePreview.style.setProperty('--preview-bg', value);
          if (key === 'text') palettePreview.style.setProperty('--preview-text', value);
        }
        return true;
      };
      el.querySelectorAll('[data-color-picker]').forEach((input) => input.addEventListener('input', (e) => applyColor(e.target.dataset.colorPicker, e.target.value)));
      el.querySelectorAll('[data-color-hex]').forEach((input) => input.addEventListener('change', (e) => {
        if (!applyColor(e.target.dataset.colorHex, e.target.value)) showToast('Utilisez un code couleur comme #0071E3.', 'error');
      }));
      el.querySelectorAll('[data-color-preset]').forEach((btn) => btn.addEventListener('click', () => applyColor(btn.dataset.colorPreset, btn.dataset.colorValue)));

      bindSectionsListEvents(el.querySelector('#wSectionsList'));
    }

    // ---------- Produits tab ----------

    function filterShopWsProducts() {
      let list = shopWs.products.slice();
      const term = shopWsProductFilter.search.trim().toLowerCase();
      if (term) list = list.filter((p) => (p.name || '').toLowerCase().includes(term) || (p.sku || '').toLowerCase().includes(term) || (p.category || '').toLowerCase().includes(term));
      if (shopWsProductFilter.status) list = list.filter((p) => (p.status || 'draft') === shopWsProductFilter.status);
      if (shopWsProductFilter.sort === 'price') list.sort((a, b) => a.price - b.price);
      else if (shopWsProductFilter.sort === 'stock') list.sort((a, b) => (a.stock ?? Infinity) - (b.stock ?? Infinity));
      else list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      return list;
    }

    function renderShopWsProduits(el) {
      el.innerHTML = `
        <div class="sst-shop-ws-panel sst-shop-ws-panel-wide">
          <div class="sst-shop-ws-toolbar">
            <input type="search" class="sst-input" id="wProductSearch" placeholder="Rechercher un produit" value="${escapeHtml(shopWsProductFilter.search)}">
            <select class="sst-select" id="wProductStatusFilter">
              <option value="">Tous les statuts</option>
              <option value="published" ${shopWsProductFilter.status === 'published' ? 'selected' : ''}>Publié</option>
              <option value="draft" ${shopWsProductFilter.status === 'draft' ? 'selected' : ''}>Brouillon</option>
              <option value="suspended" ${shopWsProductFilter.status === 'suspended' ? 'selected' : ''}>Suspendu</option>
            </select>
            <select class="sst-select" id="wProductSort">
              <option value="name" ${shopWsProductFilter.sort === 'name' ? 'selected' : ''}>Nom (A-Z)</option>
              <option value="price" ${shopWsProductFilter.sort === 'price' ? 'selected' : ''}>Prix</option>
              <option value="stock" ${shopWsProductFilter.sort === 'stock' ? 'selected' : ''}>Stock</option>
            </select>
            <button class="sst-btn sst-btn-primary" id="wNewProduct"><i class="fas fa-plus"></i> Produit</button>
          </div>
          <div id="wProductList">${renderShopWsProductList(filterShopWsProducts())}</div>
        </div>
      `;
      el.querySelector('#wProductSearch').addEventListener('input', (e) => { shopWsProductFilter.search = e.target.value; refreshProductList(el); });
      el.querySelector('#wProductStatusFilter').addEventListener('change', (e) => { shopWsProductFilter.status = e.target.value; refreshProductList(el); });
      el.querySelector('#wProductSort').addEventListener('change', (e) => { shopWsProductFilter.sort = e.target.value; refreshProductList(el); });
      el.querySelector('#wNewProduct').addEventListener('click', () => openProductDrawer(null));
      bindProductListRowEvents(el);
    }

    function renderShopWsProductList(products) {
      if (!shopWs.products.length) return `<div class="sst-empty sst-app-empty"><i class="fas fa-box-open" aria-hidden="true"></i><strong>Aucun produit.</strong><span>Ajoutez votre premier produit pour commencer à vendre.</span></div>`;
      if (!products.length) return '<div class="sst-empty">Aucun résultat pour ces filtres.</div>';
      return `<div class="sst-shop-ws-product-list">${products.map((p) => {
        const statusLabel = p.status === 'published' ? 'Publié' : p.status === 'suspended' ? 'Suspendu' : 'Brouillon';
        const stockLabel = p.type === 'digital' ? 'Numérique' : (Number(p.stock || 0) <= 0 ? 'Rupture' : `${p.stock} en stock`);
        return `
        <div class="sst-shop-ws-product-row">
          <div class="sst-shop-ws-product-thumb">${p.images?.[0] ? `<img src="${escapeHtml(p.images[0])}" alt="">` : '<i class="fas fa-image"></i>'}</div>
          <div>
            <div class="sst-shop-ws-product-name">${escapeHtml(p.name)} ${p.featured ? '<i class="fas fa-star" style="color:#d97706;font-size:.7rem;" title="Mis en avant"></i>' : ''}</div>
            <div class="sst-shop-ws-product-meta">${escapeHtml(p.category || 'Sans catégorie')} · ${stockLabel} · <span class="sst-badge ${p.status || 'draft'}">${statusLabel}</span></div>
          </div>
          <div class="sst-shop-ws-product-price">${formatCurrency(p.price)}</div>
          <div class="sst-shop-ws-product-actions">
            <button class="sst-builder-icon-btn" data-edit-product="${p.id}" aria-label="Modifier ${escapeHtml(p.name)}"><i class="fas fa-pen"></i></button>
            <button class="sst-builder-icon-btn" data-duplicate-product="${p.id}" aria-label="Dupliquer ${escapeHtml(p.name)}"><i class="fas fa-copy"></i></button>
            ${p.status === 'published'
              ? `<button class="sst-builder-icon-btn" data-toggle-product="${p.id}:suspended" aria-label="Dépublier ${escapeHtml(p.name)}"><i class="fas fa-eye-slash"></i></button>`
              : `<button class="sst-builder-icon-btn" data-toggle-product="${p.id}:published" aria-label="Publier ${escapeHtml(p.name)}"><i class="fas fa-eye"></i></button>`}
            <button class="sst-builder-icon-btn danger" data-delete-product="${p.id}" aria-label="Supprimer ${escapeHtml(p.name)}"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    function refreshProductList(el) {
      el.querySelector('#wProductList').innerHTML = renderShopWsProductList(filterShopWsProducts());
      bindProductListRowEvents(el);
    }
    function bindProductListRowEvents(el) {
      el.querySelectorAll('[data-edit-product]').forEach((btn) => btn.addEventListener('click', () => {
        const product = shopWs.products.find((p) => p.id === btn.dataset.editProduct);
        if (product) openProductDrawer(product);
      }));
      el.querySelectorAll('[data-duplicate-product]').forEach((btn) => btn.addEventListener('click', () => duplicateShopProduct(btn.dataset.duplicateProduct)));
      el.querySelectorAll('[data-toggle-product]').forEach((btn) => btn.addEventListener('click', () => {
        const [productId, status] = btn.dataset.toggleProduct.split(':');
        setShopWsProductStatus(productId, status);
      }));
      el.querySelectorAll('[data-delete-product]').forEach((btn) => btn.addEventListener('click', () => deleteShopWsProduct(btn.dataset.deleteProduct)));
    }

    async function setShopWsProductStatus(productId, status) {
      try {
        await callSst('SetShopProductStatus', { method: 'POST', auth: currentUser, body: { organizationId: shopWs.org.id, catalogId: shopWs.catalogId, productId, status } });
        showToast(status === 'published' ? 'Produit publié.' : 'Produit dépublié.');
      } catch (error) { showToast(error.message, 'error'); }
    }
    async function deleteShopWsProduct(productId) {
      const product = shopWs.products.find((p) => p.id === productId);
      if (!confirm(`Supprimer « ${product?.name || 'ce produit'} » ?`)) return;
      try {
        const result = await callSst('DeleteShopProduct', { method: 'POST', auth: currentUser, body: { organizationId: shopWs.org.id, catalogId: shopWs.catalogId, productId } });
        showToast(result.archived ? 'Produit retiré (référencé par une commande).' : 'Produit supprimé.');
      } catch (error) { showToast(error.message, 'error'); }
    }
    async function duplicateShopProduct(productId) {
      const product = shopWs.products.find((p) => p.id === productId);
      if (!product) return;
      try {
        await callSst('SaveShopProduct', {
          method: 'POST', auth: currentUser,
          body: {
            organizationId: shopWs.org.id, catalogId: shopWs.catalogId,
            name: `${product.name} (copie)`, shortDescription: product.shortDescription, description: product.description,
            images: product.images, imagesAlt: product.imagesAlt, category: product.category, tags: product.tags,
            type: product.type, price: product.price, comparePrice: product.comparePrice,
            sku: product.sku ? `${product.sku}-copie` : undefined,
            stock: product.stock, lowStockThreshold: product.lowStockThreshold, weightGrams: product.weightGrams, dimensions: product.dimensions,
            digitalFileUrl: product.digitalFileUrl, featured: false, variants: product.variants, status: 'draft'
          }
        });
        showToast('Produit dupliqué en brouillon.');
      } catch (error) { showToast(error.message, 'error'); }
    }

    // ---------- Product drawer ----------

    function normalizeProductDraft(product) {
      if (!product) {
        return {
          id: null, name: '', shortDescription: '', description: '', category: '', tags: [], type: 'physical',
          price: '', comparePrice: '', sku: '', stock: 0, lowStockThreshold: '', weightGrams: '', dimensions: null,
          digitalFileUrl: null, featured: false, images: [], imagesAlt: [], variants: [], status: 'draft'
        };
      }
      return {
        id: product.id, name: product.name || '', shortDescription: product.shortDescription || '', description: product.description || '',
        category: product.category || '', tags: product.tags ? [...product.tags] : [], type: product.type || 'physical',
        price: product.price ?? '', comparePrice: product.comparePrice ?? '', sku: product.sku || '',
        stock: product.stock ?? 0, lowStockThreshold: product.lowStockThreshold ?? '', weightGrams: product.weightGrams ?? '',
        dimensions: product.dimensions ? { ...product.dimensions } : null, digitalFileUrl: product.digitalFileUrl || null,
        featured: product.featured === true, images: product.images ? [...product.images] : [],
        imagesAlt: product.imagesAlt ? [...product.imagesAlt] : [], variants: product.variants ? product.variants.map((v) => ({ ...v })) : [],
        status: product.status || 'draft'
      };
    }

    function productDrawerEscHandler(e) {
      if (e.key === 'Escape') closeProductDrawer();
    }
    function closeProductDrawer() {
      shopWs?.productDrawerOverlay?.remove();
      if (shopWs) { shopWs.productDrawerOverlay = null; shopWs.productDraft = null; }
      document.removeEventListener('keydown', productDrawerEscHandler);
    }

    function openProductDrawer(product) {
      shopWs.productDraft = normalizeProductDraft(product);
      const overlay = document.createElement('div');
      overlay.className = 'sst-shop-ws-drawer-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML = `
        <div class="sst-shop-ws-drawer">
          <div class="sst-shop-ws-drawer-header">
            <h3>${product ? 'Modifier le produit' : 'Nouveau produit'}</h3>
            <button class="sst-personalize-close" id="pdClose" aria-label="Fermer"><i class="fas fa-xmark"></i></button>
          </div>
          <div class="sst-shop-ws-drawer-body" id="pdBody"></div>
          <div class="sst-shop-ws-drawer-footer">
            <button class="sst-btn sst-btn-secondary" id="pdCancel">Annuler</button>
            <button class="sst-btn sst-btn-secondary" id="pdSaveDraft">Enregistrer comme brouillon</button>
            <button class="sst-btn sst-btn-primary" id="pdSavePublish">${product?.status === 'published' ? 'Enregistrer' : 'Enregistrer et publier'}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      shopWs.productDrawerOverlay = overlay;
      renderProductDrawerBody();
      overlay.querySelector('#pdClose').addEventListener('click', closeProductDrawer);
      overlay.querySelector('#pdCancel').addEventListener('click', closeProductDrawer);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeProductDrawer(); });
      overlay.querySelector('#pdSaveDraft').addEventListener('click', () => saveProductDrawer('draft'));
      overlay.querySelector('#pdSavePublish').addEventListener('click', () => saveProductDrawer('published'));
      document.addEventListener('keydown', productDrawerEscHandler);
      setTimeout(() => overlay.querySelector('#pName')?.focus(), 0);
    }

    function renderProductDrawerBody() {
      const body = shopWs.productDrawerOverlay.querySelector('#pdBody');
      const p = shopWs.productDraft;
      const isDigital = p.type === 'digital';
      body.innerHTML = `
        <div class="sst-field"><label class="sst-label" for="pName">Nom *</label><input class="sst-input" id="pName" value="${escapeHtml(p.name)}"></div>
        <div class="sst-field"><label class="sst-label" for="pShort">Description courte</label><input class="sst-input" id="pShort" maxlength="160" value="${escapeHtml(p.shortDescription)}"></div>
        <div class="sst-field"><label class="sst-label" for="pDesc">Description détaillée</label><textarea class="sst-textarea" id="pDesc" rows="4">${escapeHtml(p.description)}</textarea></div>
        <div class="sst-grid cols-2">
          <div class="sst-field"><label class="sst-label" for="pCategory">Catégorie</label><input class="sst-input" id="pCategory" value="${escapeHtml(p.category)}"></div>
          <div class="sst-field"><label class="sst-label" for="pTags">Tags (séparés par une virgule)</label><input class="sst-input" id="pTags" value="${escapeHtml(p.tags.join(', '))}"></div>
        </div>
        <div class="sst-field"><label class="sst-label" for="pType">Type de produit</label><select class="sst-select" id="pType">
          <option value="physical" ${!isDigital ? 'selected' : ''}>Physique</option>
          <option value="digital" ${isDigital ? 'selected' : ''}>Numérique</option>
        </select></div>
        <div class="sst-grid cols-2">
          <div class="sst-field"><label class="sst-label" for="pPrice">Prix (HTG) *</label><input class="sst-input" type="number" min="0" id="pPrice" value="${p.price}"></div>
          <div class="sst-field"><label class="sst-label" for="pComparePrice">Prix barré (optionnel)</label><input class="sst-input" type="number" min="0" id="pComparePrice" value="${p.comparePrice}"></div>
          <div class="sst-field"><label class="sst-label" for="pSku">SKU / référence</label><input class="sst-input" id="pSku" value="${escapeHtml(p.sku)}"></div>
          ${!isDigital ? `
            <div class="sst-field"><label class="sst-label" for="pStock">Stock</label><input class="sst-input" type="number" min="0" id="pStock" value="${p.stock}"></div>
            <div class="sst-field"><label class="sst-label" for="pLowStock">Seuil de stock faible</label><input class="sst-input" type="number" min="0" id="pLowStock" value="${p.lowStockThreshold}"></div>
            <div class="sst-field"><label class="sst-label" for="pWeight">Poids (grammes)</label><input class="sst-input" type="number" min="0" id="pWeight" value="${p.weightGrams}"></div>
          ` : `
            <div class="sst-field" style="grid-column:1/-1;"><label class="sst-label" for="pDigitalFile">Fichier téléchargeable (URL)</label><input class="sst-input" id="pDigitalFile" value="${escapeHtml(p.digitalFileUrl || '')}" placeholder="Lien vers le fichier hébergé"></div>
          `}
        </div>
        ${!isDigital ? `
          <div class="sst-grid cols-3">
            <div class="sst-field"><label class="sst-label" for="pDimL">Longueur (cm)</label><input class="sst-input" type="number" min="0" id="pDimL" value="${p.dimensions?.length ?? ''}"></div>
            <div class="sst-field"><label class="sst-label" for="pDimW">Largeur (cm)</label><input class="sst-input" type="number" min="0" id="pDimW" value="${p.dimensions?.width ?? ''}"></div>
            <div class="sst-field"><label class="sst-label" for="pDimH">Hauteur (cm)</label><input class="sst-input" type="number" min="0" id="pDimH" value="${p.dimensions?.height ?? ''}"></div>
          </div>
        ` : ''}
        <label style="display:flex;align-items:center;gap:.5rem;margin:1rem 0;"><input type="checkbox" id="pFeatured" ${p.featured ? 'checked' : ''}> Mettre ce produit en avant</label>

        <div class="sst-shop-ws-section">
          <h4>Images</h4><p class="sst-hint">La première image est utilisée comme miniature.</p>
          <div class="sst-shop-ws-image-grid" id="pImageGrid">${renderProductImageGrid()}</div>
          <input class="sst-visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" id="pImageFile" multiple>
          <label class="sst-upload-trigger" for="pImageFile"><i class="fas fa-arrow-up-from-bracket"></i> Ajouter des images</label>
          <div class="sst-upload-status" id="pImageStatus" role="status"></div>
        </div>

        <div class="sst-shop-ws-section">
          <h4>Variantes</h4><p class="sst-hint">Taille, couleur, format… Chaque variante peut avoir son propre prix et stock.</p>
          <div id="pVariantList">${renderProductVariantList()}</div>
          <button class="sst-personalize-add" id="pAddVariant" type="button"><i class="fas fa-plus"></i> Ajouter une variante</button>
        </div>
        <div class="sst-error" id="pFormError" style="display:none;"></div>
      `;
      bindProductDrawerFieldEvents();
    }

    function renderProductImageGrid() {
      const p = shopWs.productDraft;
      if (!p.images.length) return '<p class="sst-hint">Aucune image ajoutée.</p>';
      return p.images.map((url, i) => `
        <div class="sst-shop-ws-image-item" data-image-index="${i}">
          <img src="${escapeHtml(url)}" alt="">
          <input class="sst-input" data-image-alt="${i}" value="${escapeHtml(p.imagesAlt[i] || '')}" placeholder="Texte alt">
          <div style="display:flex;gap:.2rem;margin-top:.2rem;">
            <button class="sst-builder-icon-btn" data-move-image="${i}:-1" ${i === 0 ? 'disabled' : ''} style="width:24px;height:24px;font-size:.6rem;" aria-label="Déplacer avant"><i class="fas fa-chevron-left"></i></button>
            <button class="sst-builder-icon-btn" data-move-image="${i}:1" ${i === p.images.length - 1 ? 'disabled' : ''} style="width:24px;height:24px;font-size:.6rem;" aria-label="Déplacer après"><i class="fas fa-chevron-right"></i></button>
          </div>
          <button class="sst-shop-ws-image-remove" data-remove-image="${i}" aria-label="Supprimer l'image"><i class="fas fa-xmark"></i></button>
        </div>
      `).join('');
    }
    function renderProductVariantList() {
      const variants = shopWs.productDraft.variants;
      if (!variants.length) return '<p class="sst-hint">Aucune variante. Ce produit se vend tel quel.</p>';
      return variants.map((v, i) => `
        <div class="sst-shop-ws-variant-row" data-variant-index="${i}">
          <input class="sst-input" data-variant-field="name" value="${escapeHtml(v.name)}" placeholder="Nom (ex. Rouge - M)">
          <input class="sst-input" type="number" data-variant-field="priceDelta" value="${v.priceDelta || 0}" placeholder="+/- prix">
          <input class="sst-input" type="number" min="0" data-variant-field="stock" value="${v.stock ?? ''}" placeholder="Stock">
          <input class="sst-input" data-variant-field="sku" value="${escapeHtml(v.sku || '')}" placeholder="SKU">
          <button class="sst-builder-icon-btn danger" data-remove-variant="${i}" aria-label="Supprimer la variante"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    function bindProductDrawerFieldEvents() {
      const body = shopWs.productDrawerOverlay.querySelector('#pdBody');
      const p = shopWs.productDraft;
      const bind = (id, cb) => body.querySelector(`#${id}`)?.addEventListener('input', cb);
      bind('pName', (e) => { p.name = e.target.value; });
      bind('pShort', (e) => { p.shortDescription = e.target.value; });
      bind('pDesc', (e) => { p.description = e.target.value; });
      bind('pCategory', (e) => { p.category = e.target.value; });
      bind('pTags', (e) => { p.tags = e.target.value.split(',').map((t) => t.trim()).filter(Boolean); });
      body.querySelector('#pType').addEventListener('change', (e) => { p.type = e.target.value; renderProductDrawerBody(); });
      bind('pPrice', (e) => { p.price = e.target.value; });
      bind('pComparePrice', (e) => { p.comparePrice = e.target.value; });
      bind('pSku', (e) => { p.sku = e.target.value; });
      bind('pStock', (e) => { p.stock = e.target.value; });
      bind('pLowStock', (e) => { p.lowStockThreshold = e.target.value; });
      bind('pWeight', (e) => { p.weightGrams = e.target.value; });
      bind('pDigitalFile', (e) => { p.digitalFileUrl = e.target.value; });
      ['pDimL', 'pDimW', 'pDimH'].forEach((id, idx) => body.querySelector(`#${id}`)?.addEventListener('input', (e) => {
        const dims = p.dimensions || { length: 0, width: 0, height: 0 };
        dims[['length', 'width', 'height'][idx]] = Number(e.target.value) || 0;
        p.dimensions = dims;
      }));
      body.querySelector('#pFeatured').addEventListener('change', (e) => { p.featured = e.target.checked; });

      body.querySelector('#pImageFile').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        e.target.disabled = true;
        const statusEl = body.querySelector('#pImageStatus');
        for (const file of files) {
          statusEl.textContent = `Téléversement de ${file.name}…`;
          try {
            const uploaded = await uploadImageFile(file, `sst-shops/${shopWs.catalogId}/products`, { maxSizeMb: 8 });
            p.images.push(uploaded.url);
            p.imagesAlt.push('');
          } catch (error) { statusEl.textContent = error.message || `Échec pour ${file.name}.`; }
        }
        statusEl.textContent = '';
        e.target.disabled = false;
        e.target.value = '';
        refreshProductImageGrid();
      });
      bindProductImageGridEvents();
      bindProductVariantEvents();

      body.querySelector('#pAddVariant').addEventListener('click', () => {
        p.variants.push({ id: `variant_${Date.now()}`, name: '', priceDelta: 0, stock: null, sku: '' });
        refreshProductVariantList();
      });
    }

    function refreshProductImageGrid() {
      const grid = shopWs.productDrawerOverlay.querySelector('#pImageGrid');
      grid.innerHTML = renderProductImageGrid();
      bindProductImageGridEvents();
    }
    function bindProductImageGridEvents() {
      const body = shopWs.productDrawerOverlay.querySelector('#pdBody');
      const p = shopWs.productDraft;
      body.querySelectorAll('[data-image-alt]').forEach((input) => input.addEventListener('input', (e) => {
        p.imagesAlt[Number(e.target.dataset.imageAlt)] = e.target.value;
      }));
      body.querySelectorAll('[data-move-image]').forEach((btn) => btn.addEventListener('click', () => {
        const [i, dir] = btn.dataset.moveImage.split(':').map(Number);
        const j = i + dir;
        if (j < 0 || j >= p.images.length) return;
        [p.images[i], p.images[j]] = [p.images[j], p.images[i]];
        [p.imagesAlt[i], p.imagesAlt[j]] = [p.imagesAlt[j], p.imagesAlt[i]];
        refreshProductImageGrid();
      }));
      body.querySelectorAll('[data-remove-image]').forEach((btn) => btn.addEventListener('click', () => {
        const i = Number(btn.dataset.removeImage);
        p.images.splice(i, 1);
        p.imagesAlt.splice(i, 1);
        refreshProductImageGrid();
      }));
    }
    function refreshProductVariantList() {
      const wrap = shopWs.productDrawerOverlay.querySelector('#pVariantList');
      wrap.innerHTML = renderProductVariantList();
      bindProductVariantEvents();
    }
    function bindProductVariantEvents() {
      const body = shopWs.productDrawerOverlay.querySelector('#pdBody');
      const p = shopWs.productDraft;
      body.querySelectorAll('[data-variant-index]').forEach((row) => {
        const i = Number(row.dataset.variantIndex);
        row.querySelectorAll('[data-variant-field]').forEach((input) => input.addEventListener('input', (e) => {
          const field = e.target.dataset.variantField;
          p.variants[i][field] = field === 'priceDelta' ? (Number(e.target.value) || 0)
            : field === 'stock' ? (e.target.value === '' ? null : Math.max(0, Number(e.target.value)))
              : e.target.value;
        }));
      });
      body.querySelectorAll('[data-remove-variant]').forEach((btn) => btn.addEventListener('click', () => {
        p.variants.splice(Number(btn.dataset.removeVariant), 1);
        refreshProductVariantList();
      }));
    }

    async function saveProductDrawer(targetStatus) {
      const p = shopWs.productDraft;
      const errorEl = shopWs.productDrawerOverlay.querySelector('#pFormError');
      errorEl.style.display = 'none';
      if (!String(p.name || '').trim()) { errorEl.textContent = 'Le nom du produit est requis.'; errorEl.style.display = ''; return; }
      const price = Number(p.price);
      if (!Number.isFinite(price) || price <= 0) { errorEl.textContent = 'Le prix doit être un nombre supérieur à 0.'; errorEl.style.display = ''; return; }
      for (const v of p.variants) {
        if (!String(v.name || '').trim()) { errorEl.textContent = 'Chaque variante doit avoir un nom.'; errorEl.style.display = ''; return; }
      }
      const saveBtn = shopWs.productDrawerOverlay.querySelector('#pdSavePublish');
      const draftBtn = shopWs.productDrawerOverlay.querySelector('#pdSaveDraft');
      saveBtn.disabled = true;
      draftBtn.disabled = true;
      try {
        await callSst('SaveShopProduct', {
          method: 'POST', auth: currentUser,
          body: {
            organizationId: shopWs.org.id, catalogId: shopWs.catalogId, productId: p.id || undefined,
            name: p.name, shortDescription: p.shortDescription, description: p.description,
            category: p.category, tags: p.tags, type: p.type, price,
            comparePrice: p.comparePrice === '' ? undefined : Number(p.comparePrice),
            sku: p.sku, stock: p.stock === '' ? 0 : Number(p.stock),
            lowStockThreshold: p.lowStockThreshold === '' ? undefined : Number(p.lowStockThreshold),
            weightGrams: p.weightGrams === '' ? undefined : Number(p.weightGrams),
            dimensions: p.dimensions, digitalFileUrl: p.digitalFileUrl, featured: p.featured,
            images: p.images, imagesAlt: p.imagesAlt, variants: p.variants, status: targetStatus
          }
        });
        showToast(targetStatus === 'published' ? 'Produit enregistré et publié.' : 'Produit enregistré.');
        closeProductDrawer();
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = '';
        saveBtn.disabled = false;
        draftBtn.disabled = false;
      }
    }

    // ---------- Livraison tab ----------

    function renderShopWsZonesList() {
      const zones = shopWs.catalog.delivery.zones || [];
      if (!zones.length) return '<p class="sst-hint">Aucune zone de livraison. Ajoutez-en une.</p>';
      return zones.map((z, i) => `
        <div class="sst-shop-ws-zone-row" data-zone-index="${i}">
          <input class="sst-input" data-zone-field="name" value="${escapeHtml(z.name)}" placeholder="Nom de la zone">
          <input class="sst-input" type="number" min="0" data-zone-field="fee" value="${z.fee}" placeholder="Frais (HTG)">
          <input class="sst-input" data-zone-field="etaLabel" value="${escapeHtml(z.etaLabel || '')}" placeholder="Délai (ex. 24-48h)">
          <button class="sst-builder-icon-btn danger" data-remove-zone="${i}" aria-label="Supprimer la zone"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    function renderShopWsLivraison(el) {
      const d = shopWs.catalog.delivery;
      el.innerHTML = `
        <div class="sst-shop-ws-panel">
          <section class="sst-shop-ws-section">
            <h4>Retrait sur place</h4>
            <label style="display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;"><input type="checkbox" id="wPickupEnabled" ${d.pickupEnabled ? 'checked' : ''}> Activer le retrait sur place</label>
            <div class="sst-field"><label class="sst-label" for="wPickupAddress">Adresse de retrait</label><input class="sst-input" id="wPickupAddress" value="${escapeHtml(d.pickupAddress || '')}" placeholder="Ex. 12 Rue Panamericaine, Port-au-Prince"></div>
            <div class="sst-field"><label class="sst-label" for="wPickupHours">Horaires</label><input class="sst-input" id="wPickupHours" value="${escapeHtml(d.pickupHours || '')}" placeholder="Ex. Lun-Sam, 9h-17h"></div>

          <section class="sst-shop-ws-section">
            <h4>Livraison</h4>

              <div class="sst-grid cols-2" style="margin-top:1rem;">
                <div class="sst-field"><label class="sst-label" for="wFreeThreshold">Livraison gratuite dès (HTG)</label><input class="sst-input" type="number" min="0" id="wFreeThreshold" value="${d.freeDeliveryThreshold || ''}" placeholder="Aucun seuil"></div>
              </div>

          <section class="sst-shop-ws-section">

            </div>
            <div class="sst-field"><label class="sst-label" for="wInstructions">Instructions pour le client</label><textarea class="sst-textarea" id="wInstructions" rows="3">${escapeHtml(d.instructions || '')}</textarea></div>
            <label style="display:flex;align-items:center;gap:.5rem;"><input type="checkbox" id="wPhoneRequired" ${d.phoneRequired ? 'checked' : ''}> Exiger un numéro de téléphone à la commande</label>
          </section>
        </div>

      bindShopWsLivraisonEvents(el);
