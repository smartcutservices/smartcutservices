<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard createur - SmartSolutionTek</title>
<link rel="stylesheet" href="./styles.css?v=20260829-13">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="app">
    <div class="sst-loading" id="bootLoading">Chargement...</div>
  </div>

  <script type="module">
    import { auth, db, googleProvider } from '../firebase-init.js';
    import {
      onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, signOut
    } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import {
      collection, doc, query, where, onSnapshot, orderBy, getDocs, getDoc
    } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import { callSst, showToast, formatCurrency, escapeHtml } from './api.js';
    import { applyFormTheme } from './field-renderer.js';
    import { uploadImageFile, uploadStorageFile } from '../firebase-storage.js';
    import {
      applyShopTheme, renderAnnouncementBar, renderClosedBanner, renderShopNav, renderShopHero,
      renderSectionsInOrder, renderShopFooter, contrastRatio, DESIGN_PRESETS
    } from './shop-renderer.js?v=20260829-13';
    import { buildCourseSaveBody, courseStatusLabel } from './dashboard/courses/course-model.js';
    import { createCourseApi } from './dashboard/courses/course-api.js';
    import { mountCourseStudio } from './dashboard/courses/app.js';

    const app = document.getElementById('app');
    const VALID_TABS = ['overview', 'forms', 'shops', 'courses', 'services', 'food', 'payouts', 'settings'];
    const APP_SCOPES = {
      forms: {
        label: 'Inscriptions en ligne',
        title: 'Gérez vos inscriptions',
        description: 'Créez vos formulaires, suivez les participants et partagez vos pages d’inscription.',
        icon: 'fa-clipboard-list'
      },
      shops: {
        label: 'Mini-boutique',
        title: 'Gérez votre boutique',
        description: 'Organisez vos produits, suivez les commandes et publiez votre catalogue.',
        icon: 'fa-store'
      },
      courses: {
        label: 'Formation en ligne',
        title: 'Gérez vos formations',
        description: 'Structurez vos cours, ajoutez vos contenus et suivez vos apprenants.',
        icon: 'fa-graduation-cap'
      },
      services: {
        label: 'Réservations',
        title: 'Gérez vos services',
        description: 'Définissez vos disponibilités et suivez les réservations de vos clients.',
        icon: 'fa-calendar-check'
      },
      food: {
        label: 'Cuisine & artisanat',
        title: 'Gérez votre menu',
        description: 'Présentez vos créations et centralisez les commandes de vos clients.',
        icon: 'fa-utensils'
      }
    };
    const urlParams = new URLSearchParams(location.search);
    const requestedTab = urlParams.get('tab');
    const requestedOrgId = urlParams.get('org');
    const requestedApp = urlParams.get('app') || (APP_SCOPES[requestedTab] ? requestedTab : null);
    const scopedApp = APP_SCOPES[requestedApp] || null;
    let currentUser = null;
    let organizations = [];
    let activeOrgId = null;
    let activeTab = scopedApp ? requestedApp : (VALID_TABS.includes(requestedTab) ? requestedTab : 'overview');
    let unsubscribers = [];
    const courseApi = createCourseApi(callSst, () => currentUser);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      clearSubscriptions();
      if (!user) {
        renderLoginGate();
        return;
      }
      await loadOrganizations();
    });

    function clearSubscriptions() {
      unsubscribers.forEach((fn) => { try { fn(); } catch (_) {} });
      unsubscribers = [];
    }

    // ---------- Login gate ----------
    function renderLoginGate(errorMessage) {
      app.innerHTML = `
        <main style="min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--background);">
          <section class="sst-card" style="max-width:400px;width:100%;">
            <div style="display:inline-flex;align-items:center;gap:.5rem;color:#0F1111;font-weight:700;font-size:.95rem;margin-bottom:1.1rem;">
              <i class="fas fa-layer-group" style="color:var(--secondary);"></i>
              Dashboard createur <span class="sst-badge info">SmartSolutionTek</span>
            </div>
            <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:.4rem;">Connexion</h1>
            <p style="color:var(--text-secondary);font-size:.88rem;margin-bottom:1.2rem;">Connectez-vous avec votre compte SmartCut pour gerer vos pages.</p>
            ${errorMessage ? `<div class="sst-error">${escapeHtml(errorMessage)}</div>` : ''}
            <form id="loginForm">
              <div class="sst-field">
                <label class="sst-label">Email</label>
                <input class="sst-input" type="email" id="loginEmail" required>
              </div>
              <div class="sst-field">
                <label class="sst-label">Mot de passe</label>
                <input class="sst-input" type="password" id="loginPassword" required>
              </div>
              <button type="submit" class="sst-btn sst-btn-primary" style="width:100%;">Se connecter</button>
            </form>
            <div style="display:flex;align-items:center;gap:.75rem;margin:1.1rem 0;color:var(--text-tertiary);font-size:.8rem;">
              <div style="flex:1;height:1px;background:var(--border);"></div>ou<div style="flex:1;height:1px;background:var(--border);"></div>
            </div>
            <button type="button" id="googleLoginBtn" class="sst-btn sst-btn-secondary" style="width:100%;">
              <i class="fab fa-google"></i> Continuer avec Google
            </button>
          </section>
        </main>
      `;
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
          renderLoginGate("Email ou mot de passe incorrect.");
        }
      });
      document.getElementById('googleLoginBtn').addEventListener('click', async () => {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (error) {
          if (error?.code === 'auth/popup-closed-by-user') return;
          renderLoginGate("Connexion Google impossible. Reessayez.");
        }
      });
    }

    // ---------- Organizations ----------
    async function loadOrganizations() {
      app.innerHTML = '<div class="sst-loading">Chargement de vos organisations...</div>';
      try {
        const result = await callSst('GetMyOrganizations', { auth: currentUser });
        organizations = result.organizations || [];
      } catch (error) {
        app.innerHTML = `<div class="sst-error" style="margin:2rem;">${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!activeOrgId && organizations.length) {
        activeOrgId = organizations.some((org) => org.id === requestedOrgId)
          ? requestedOrgId
          : organizations[0].id;
      }
      renderShell();
    }

    async function handleCreateOrganization() {
      const name = prompt('Nom de votre organisation :');
      if (!name || !name.trim()) return;
      try {
        const result = await callSst('CreateOrganization', { method: 'POST', auth: currentUser, body: { name: name.trim() } });
        showToast('Organisation creee.');
        activeOrgId = result.organizationId;
        await loadOrganizations();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    // ---------- Shell / tabs ----------
    function renderShell() {
      const activeOrg = organizations.find((o) => o.id === activeOrgId);

      app.innerHTML = `
        <header class="sst-header ${scopedApp ? 'sst-header-scoped' : ''}">
          <div class="sst-header-brand">
            <i class="fas ${scopedApp?.icon || 'fa-layer-group'}"></i>
            SmartSolutionTek <span class="badge">${scopedApp ? scopedApp.label : 'Dashboard createur'}</span>
          </div>
          <div class="sst-header-actions">
            <a class="sst-btn sst-btn-secondary sst-home-link" href="../index.html" aria-label="Retourner à la page d’accueil">
              <i class="fas fa-house" aria-hidden="true"></i><span>Accueil</span>
            </a>
            ${organizations.length ? `
              <select class="sst-select sst-org-switcher" id="orgSwitcher">
                ${organizations.map((org) => `<option value="${org.id}" ${org.id === activeOrgId ? 'selected' : ''}>${escapeHtml(org.name)}</option>`).join('')}
              </select>
            ` : ''}
            ${scopedApp ? '' : '<button class="sst-btn sst-btn-secondary" id="newOrgBtn"><i class="fas fa-plus"></i> Organisation</button>'}
            <button class="sst-btn sst-btn-secondary" id="signOutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Deconnexion</button>
          </div>
        </header>
        <main class="sst-main ${scopedApp ? 'sst-main-app' : ''}">
          ${!organizations.length ? `
            <div class="sst-empty">
              <p style="margin-bottom:1rem;">Vous n'avez encore aucune organisation.</p>
              <button class="sst-btn sst-btn-primary" id="firstOrgBtn"><i class="fas fa-plus"></i> Creer ma premiere organisation</button>
            </div>
          ` : `
            ${scopedApp ? `
              <div class="sst-app-context">
                <a class="sst-app-back" href="./dashboard.html?org=${encodeURIComponent(activeOrg.id)}"><i class="fas fa-arrow-left" aria-hidden="true"></i> Dashboard général</a>
                <div class="sst-app-heading">
                  <span class="sst-app-icon" aria-hidden="true"><i class="fas ${scopedApp.icon}"></i></span>
                  <div>
                    <span class="sst-app-kicker">${scopedApp.label}</span>
                    <h1>${scopedApp.title}</h1>
                    <p>${scopedApp.description}</p>
                  </div>
                </div>
              </div>
            ` : `
              <div class="sst-tabs">
                <div class="sst-tab ${activeTab === 'overview' ? 'active' : ''}" data-tab="overview">Vue d'ensemble</div>
                <div class="sst-tab ${activeTab === 'payouts' ? 'active' : ''}" data-tab="payouts">Decaissements</div>
                <div class="sst-tab ${activeTab === 'settings' ? 'active' : ''}" data-tab="settings">Parametres</div>
              </div>
            `}
            <div id="tabContent" class="${scopedApp ? 'sst-app-content' : ''}"></div>
          `}
        </main>
      `;

      document.getElementById('signOutBtn')?.addEventListener('click', () => signOut(auth));
      document.getElementById('newOrgBtn')?.addEventListener('click', handleCreateOrganization);
      document.getElementById('firstOrgBtn')?.addEventListener('click', handleCreateOrganization);
      document.getElementById('orgSwitcher')?.addEventListener('change', (event) => {
        activeOrgId = event.target.value;
        activeTab = scopedApp ? requestedApp : 'overview';
        clearSubscriptions();
        renderShell();
      });
      document.querySelectorAll('.sst-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          activeTab = tab.dataset.tab;
          clearSubscriptions();
          renderShell();
        });
      });

      if (organizations.length) renderActiveTab(activeOrg);
    }

    function renderActiveTab(activeOrg) {
      const content = document.getElementById('tabContent');
      if (!content) return;
      if (activeTab === 'overview') return renderOverviewTab(content, activeOrg);
      if (activeTab === 'forms') return renderFormsTab(content, activeOrg);
      if (activeTab === 'shops') return renderShopsTab(content, activeOrg);
      if (activeTab === 'courses') return renderCoursesTab(content, activeOrg);
      if (activeTab === 'services') return renderServicesTab(content, activeOrg);
      if (activeTab === 'food') return renderFoodTab(content, activeOrg);
      if (activeTab === 'payouts') return renderPayoutsTab(content, activeOrg);
      if (activeTab === 'settings') return renderSettingsTab(content, activeOrg);
    }

    // ---------- Overview ----------
    function renderOverviewTab(content, org) {
      const appCards = Object.entries(APP_SCOPES).map(([appId, appScope]) => `
        <a class="sst-app-launch-card" href="./dashboard.html?app=${appId}&org=${encodeURIComponent(org.id)}">
          <span class="sst-app-launch-icon" aria-hidden="true"><i class="fas ${appScope.icon}"></i></span>
          <span class="sst-app-launch-copy">
            <strong>${appScope.label}</strong>
            <small>${appScope.description}</small>
          </span>
          <i class="fas fa-arrow-right sst-app-launch-arrow" aria-hidden="true"></i>
        </a>
      `).join('');

      content.innerHTML = `
        <section class="sst-app-launch-section" aria-labelledby="appsHeading">
          <div class="sst-overview-heading">
            <div>
              <span class="sst-overview-kicker">Espace de travail</span>
              <h2 id="appsHeading">Vos applications</h2>
            </div>
            <p>Choisissez l’outil que vous souhaitez gérer.</p>
          </div>
          <div class="sst-app-launch-grid">${appCards}</div>
        </section>

        <div class="sst-overview-heading sst-finance-heading">
          <div>
            <span class="sst-overview-kicker">Finances</span>
            <h2>Aperçu financier</h2>
          </div>
        </div>
        <div class="sst-grid cols-4" id="balanceStats">
          <div class="sst-stat"><div class="label">En attente</div><div class="value">-</div></div>
          <div class="sst-stat"><div class="label">Disponible</div><div class="value">-</div></div>
          <div class="sst-stat"><div class="label">Bloque</div><div class="value">-</div></div>
          <div class="sst-stat"><div class="label">Deja reverse</div><div class="value">-</div></div>
        </div>
        <div class="sst-card">
          <div class="sst-card-header"><h3>Activite recente (ledger)</h3></div>
          <div id="ledgerList"><div class="sst-loading">Chargement...</div></div>
        </div>
      `;

      const balanceRef = doc(db, 'balances', org.id);
      unsubscribers.push(onSnapshot(balanceRef, (snap) => {
        const balance = snap.exists() ? snap.data() : { pendingAmount: 0, availableAmount: 0, onHoldAmount: 0, paidOutAmount: 0 };
        const stats = document.getElementById('balanceStats');
        if (!stats) return;
        const cards = [
          ['En attente', balance.pendingAmount], ['Disponible', balance.availableAmount],
          ['Bloque', balance.onHoldAmount], ['Deja reverse', balance.paidOutAmount]
        ];
        stats.innerHTML = cards.map(([label, value]) => `
          <div class="sst-stat"><div class="label">${label}</div><div class="value">${formatCurrency(value)}</div></div>
        `).join('');
      }, () => {}));

      const ledgerQuery = query(collection(db, 'ledgerEntries'), where('organizationId', '==', org.id), orderBy('createdAt', 'desc'));
      unsubscribers.push(onSnapshot(ledgerQuery, (snap) => {
        const list = document.getElementById('ledgerList');
        if (!list) return;
        if (snap.empty) { list.innerHTML = '<div class="sst-empty">Aucune activite pour le moment.</div>'; return; }
        list.innerHTML = `
          <table class="sst-table">
            <thead><tr><th>Type</th><th>Brut</th><th>Commission</th><th>Net</th></tr></thead>
            <tbody>
              ${snap.docs.slice(0, 20).map((d) => {
                const e = d.data();
                return `<tr>
                  <td><span class="sst-badge ${e.type === 'payment' ? 'active' : e.type === 'refund' ? 'rejected' : 'info'}">${escapeHtml(e.type)}</span></td>
                  <td>${formatCurrency(e.grossAmount)}</td>
                  <td>${formatCurrency((e.smartcutFee || 0) + (e.partnerFee || 0))}</td>
                  <td>${formatCurrency(e.creatorNet)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        `;
      }, () => { const list = document.getElementById('ledgerList'); if (list) list.innerHTML = '<div class="sst-empty">Index Firestore requis pour cette vue (voir DATA_MODEL.md).</div>'; }));
    }

    // ---------- Public link helper (shared by all 5 resource tabs) ----------
    function publicLinkHtml(applicationId, idParam, id, org) {
      const url = `./page.html?app=${applicationId}&${idParam}=${id}&org=${org.id}`;
      return `
        <a class="sst-btn sst-btn-secondary" href="${escapeHtml(url)}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> Voir la page</a>
        <button class="sst-btn sst-btn-secondary" data-copy-link="${escapeHtml(url)}"><i class="fas fa-link"></i> Copier le lien</button>
      `;
    }

    function bindCopyLinkButtons(container) {
      container.querySelectorAll('[data-copy-link]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const url = new URL(btn.dataset.copyLink, location.href).href;
          try {
            await navigator.clipboard.writeText(url);
            showToast('Lien copie ! Partagez-le avec vos clients.');
          } catch {
            showToast(url);
          }
        });
      });
    }

    // ---------- Forms ----------
    function renderFormsTab(content, org) {
      content.innerHTML = `
        <div class="sst-resource-header">
          <h2>Formulaires</h2>
          <button class="sst-btn sst-btn-primary sst-create-btn" id="newFormBtn"><i class="fas fa-plus"></i> Créer un formulaire</button>
        </div>
        <div id="formsList"><div class="sst-loading">Chargement...</div></div>
      `;
      document.getElementById('newFormBtn').addEventListener('click', () => openFormEditor(org));

      const formsQuery = query(collection(db, 'formSchemas'), where('organizationId', '==', org.id));
      unsubscribers.push(onSnapshot(formsQuery, (snap) => {
        const list = document.getElementById('formsList');
        if (!list) return;
        const visibleForms = snap.docs.filter((doc) => doc.data().status !== 'archived');
        if (!visibleForms.length) { list.innerHTML = '<div class="sst-empty sst-app-empty"><i class="fas fa-file-circle-plus" aria-hidden="true"></i><strong>Votre premier formulaire commence ici.</strong><span>Créez une page d’inscription prête à partager en quelques minutes.</span></div>'; return; }
        list.innerHTML = `
          <div class="sst-form-list">
            ${visibleForms.map((d) => {
              const f = d.data();
              const statusLabel = f.status === 'published' ? 'Publié' : f.status === 'suspended' ? 'Suspendu' : 'Brouillon';
              const priceLabel = f.pricingType === 'fixed' ? formatCurrency(f.price) : 'Gratuit';
              return `<article class="sst-form-item">
                <div class="sst-form-item-main">
                  <span class="sst-form-item-icon" aria-hidden="true"><i class="fas fa-file-lines"></i></span>
                  <div class="sst-form-item-copy">
                    <div class="sst-form-item-title">
                      <h3>${escapeHtml(f.title || 'Sans titre')}</h3>
                      <span class="sst-badge ${f.status}">${statusLabel}</span>
                    </div>
                    <p>${priceLabel} <span aria-hidden="true">·</span> Page d’inscription</p>
                  </div>
                </div>
                <div class="sst-form-item-actions">
                  <button class="sst-btn sst-btn-secondary" data-edit-form="${d.id}"><i class="fas fa-pen"></i> Modifier</button>
                  <button class="sst-btn sst-btn-secondary" data-view-submissions="${d.id}"><i class="fas fa-user-group"></i> Inscriptions</button>
                  ${f.status === 'published'
                    ? `<button class="sst-btn sst-btn-secondary sst-btn-quiet" data-unpublish="${d.id}">Dépublier</button> ${publicLinkHtml('forms', 'formId', d.id, org)}`
                    : `<button class="sst-btn sst-btn-primary" data-publish="${d.id}">Publier</button>`}
                  <button class="sst-btn sst-btn-delete-icon" data-delete-form="${d.id}" aria-label="Supprimer ${escapeHtml(f.title || 'ce formulaire')}" title="Supprimer le formulaire"><i class="fas fa-trash" aria-hidden="true"></i></button>
                </div>
              </article>`;
            }).join('')}
          </div>
        `;
        list.querySelectorAll('[data-publish]').forEach((btn) => btn.addEventListener('click', () => setFormStatus(org, btn.dataset.publish, 'published')));
        list.querySelectorAll('[data-unpublish]').forEach((btn) => btn.addEventListener('click', () => setFormStatus(org, btn.dataset.unpublish, 'suspended')));
        list.querySelectorAll('[data-edit-form]').forEach((btn) => btn.addEventListener('click', () => openFormEditor(org, btn.dataset.editForm)));
        list.querySelectorAll('[data-view-submissions]').forEach((btn) => btn.addEventListener('click', () => viewSubmissions(org, btn.dataset.viewSubmissions)));
        list.querySelectorAll('[data-delete-form]').forEach((btn) => btn.addEventListener('click', async () => {
          const formItem = btn.closest('.sst-form-item');
          const formTitle = formItem?.querySelector('h3')?.textContent?.trim() || 'ce formulaire';
          if (!confirm(`Supprimer « ${formTitle} » ?\n\nCette action retirera le formulaire de votre espace.`)) return;
          btn.disabled = true;
          try {
            const result = await callSst('DeleteFormSchema', {
              method: 'POST',
              auth: currentUser,
              body: { organizationId: org.id, formSchemaId: btn.dataset.deleteForm }
            });
            showToast(result.archived
              ? 'Formulaire retiré. Ses inscriptions ont été conservées.'
              : 'Formulaire supprimé.');
          } catch (error) {
            btn.disabled = false;
            showToast(error.message, 'error');
          }
        }));
        bindCopyLinkButtons(list);
      }, () => { const list = document.getElementById('formsList'); if (list) list.innerHTML = '<div class="sst-error">Erreur de chargement.</div>'; }));
    }

    async function setFormStatus(org, formSchemaId, status) {
      try {
        await callSst('SetFormStatus', { method: 'POST', auth: currentUser, body: { organizationId: org.id, formSchemaId, status } });
        showToast(status === 'published' ? 'Formulaire publie.' : 'Formulaire depublie.');
      } catch (error) { showToast(error.message, 'error'); }
    }

    // ---------- Form builder ----------
    // The editor IS the live page (click-to-edit, Google-Forms-style) — no separate
    // palette/field-list/preview columns. "+ Ajouter une question" opens a small
    // popover with only the essentials; everything else lives behind "Plus d'options"
    // so a first-time creator isn't shown 18 field types before typing a single word.
    const FIELD_PALETTE_ESSENTIAL = [
      { type: 'text', label: 'Texte court', icon: 'minus' },
      { type: 'email', label: 'Email', icon: 'envelope' },
      { type: 'phone', label: 'Telephone', icon: 'phone' },
      { type: 'select', label: 'Choix', icon: 'caret-down' },
      { type: 'date', label: 'Date', icon: 'calendar' },
      { type: 'file', fileKind: 'document', label: 'Fichier', icon: 'file' }
    ];
    const FIELD_PALETTE_MORE = [
      { group: 'Personnel', items: [
        { type: 'text', semantic: 'firstName', label: 'Prenom', icon: 'user' },
        { type: 'text', semantic: 'lastName', label: 'Nom', icon: 'user' },
        { type: 'text', semantic: 'fullName', label: 'Nom complet', icon: 'id-badge' }
      ] },
      { group: 'Texte', items: [
        { type: 'textarea', label: 'Reponse longue', icon: 'align-left' }
      ] },
      { group: 'Choix', items: [
        { type: 'radio', label: 'Choix unique', icon: 'circle-dot' },
        { type: 'multiselect', label: 'Choix multiples', icon: 'list-check' }
      ] },
      { group: 'Donnees', items: [
        { type: 'number', label: 'Nombre', icon: 'hashtag' },
        { type: 'address', label: 'Adresse', icon: 'location-dot' },
        { type: 'country', label: 'Pays', icon: 'globe' },
        { type: 'city', label: 'Ville', icon: 'city' }
      ] },
      { group: 'Fichiers', items: [
        { type: 'file', fileKind: 'image', label: 'Image', icon: 'image' }
      ] },
      { group: 'Structure', items: [
        { type: 'sectionTitle', label: 'Titre de section', icon: 'heading' },
        { type: 'sectionText', label: 'Texte', icon: 'paragraph' },
        { type: 'divider', label: 'Separateur', icon: 'minus' }
      ] },
      { group: 'Consentement', items: [
        { type: 'checkbox', label: 'Case a cocher', icon: 'square-check' },
        { type: 'consent', label: 'Conditions generales', icon: 'file-contract' }
      ] }
    ];
    const FIELD_TYPE_LABELS = {
      text: 'Texte court', textarea: 'Texte long', email: 'Email', phone: 'Telephone',
      number: 'Nombre', date: 'Date', select: 'Liste deroulante', radio: 'Choix unique',
      multiselect: 'Choix multiples', checkbox: 'Case a cocher', file: 'Fichier',
      address: 'Adresse', country: 'Pays', city: 'Ville', consent: 'Consentement',
      sectionTitle: 'Titre de section', sectionText: 'Texte', divider: 'Separateur'
    };
    const STRUCTURAL_BUILDER_TYPES = new Set(['sectionTitle', 'sectionText', 'divider']);

    function newFieldId() { return `f_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`; }

    let builderOrg = null;
    let builderState = null;
    let builderOverlay = null;

    async function openFormEditor(org, formSchemaId) {
      if (formSchemaId) {
        const snap = await getDoc(doc(db, 'formSchemas', formSchemaId));
        if (!snap.exists()) { showToast('Formulaire introuvable.', 'error'); return; }
        builderState = { formSchemaId, ...snap.data() };
        builderState.fields = Array.isArray(builderState.fields) ? builderState.fields.map((f) => ({ ...f })) : [];
      } else {
        builderState = {
          formSchemaId: null, title: '', description: '', pricingType: 'free', price: 0,
          maxParticipants: null, opensAt: null, closesAt: null,
          fields: [
            { id: newFieldId(), type: 'text', label: 'Nom complet', required: true, order: 0, semantic: 'fullName' },
            { id: newFieldId(), type: 'email', label: 'Email', required: true, order: 1 }
          ],
          logoUrl: null, coverImageUrl: null, infoChips: [],
          // A brand-new form shouldn't default to Smart Cut's own navy/orange —
          // this is the creator's own page, not ours. A refined indigo reads as
          // "premium SaaS" out of the box; still fully overridable in Personnaliser.
          colors: { primary: '#18181B', accent: '#4F46E5', buttonColor: null, backgroundColor: null },
          layout: 'minimal', confirmation: { title: '', message: '' }, status: 'draft'
        };
      }
      builderOrg = org;
      renderFormBuilder();
    }

    function renderFormBuilder() {
      builderOverlay = document.createElement('div');
      builderOverlay.className = 'sst-modal-overlay open builder';
      builderOverlay.innerHTML = `
        <div class="sst-modal-full">
          <div class="sst-builder-header">
            <h3>${builderState.formSchemaId ? 'Modifier le formulaire' : 'Nouveau formulaire'}</h3>
            <div style="display:flex;gap:.6rem;">
              <button class="sst-btn sst-btn-secondary" id="builderPersonalize"><i class="fas fa-palette"></i> Personnaliser</button>
              <button class="sst-btn sst-btn-secondary" id="builderCancel">Fermer</button>
              <button class="sst-btn sst-btn-primary" id="builderSave">Enregistrer</button>
            </div>
          </div>
          <div class="sst-builder-editor-wrap"><div class="sst-builder-editor" id="builderEditor"></div></div>
        </div>
      `;
      document.body.appendChild(builderOverlay);
      builderOverlay.querySelector('#builderCancel').addEventListener('click', () => builderOverlay.remove());
      builderOverlay.querySelector('#builderSave').addEventListener('click', saveFormBuilder);
      builderOverlay.querySelector('#builderPersonalize').addEventListener('click', openPersonalizeModal);
      renderBuilderEditor();
    }

    /** Inserts a new field at a specific position (not just at the end) and re-renders. */
    function insertBuilderField(item, atIndex) {
      const field = { id: newFieldId(), order: 0, required: item.type === 'consent', type: item.type };
      if (!STRUCTURAL_BUILDER_TYPES.has(item.type)) field.label = item.label;
      if (item.type === 'sectionTitle') field.title = item.label;
      if (item.type === 'sectionText') field.text = 'Texte descriptif...';
      if (item.type === 'consent') field.text = "J'accepte les conditions generales.";
      if (item.semantic) field.semantic = item.semantic;
      if (item.fileKind) field.fileKind = item.fileKind;
      builderState.fields.splice(atIndex, 0, field);
      renderBuilderEditor();
    }

    function moveBuilderField(fieldId, direction) {
      const i = builderState.fields.findIndex((f) => f.id === fieldId);
      const j = i + direction;
      if (i < 0 || j < 0 || j >= builderState.fields.length) return;
      [builderState.fields[i], builderState.fields[j]] = [builderState.fields[j], builderState.fields[i]];
      renderBuilderEditor();
    }

    function duplicateBuilderField(fieldId) {
      const field = builderState.fields.find((f) => f.id === fieldId);
      if (!field) return;
      const copy = { ...field, id: newFieldId() };
      if (copy.label) copy.label = `${copy.label} (copie)`;
      const i = builderState.fields.findIndex((f) => f.id === fieldId);
      builderState.fields.splice(i + 1, 0, copy);
      renderBuilderEditor();
    }

    function removeBuilderField(fieldId) {
      if (!confirm('Supprimer cette question ?')) return;
      builderState.fields = builderState.fields.filter((f) => f.id !== fieldId);
      renderBuilderEditor();
    }

    /** The whole live, click-to-edit page — title/description/questions/pricing, all inline. */
    function renderBuilderEditor() {
      const container = builderOverlay.querySelector('#builderEditor');
      const fields = builderState.fields;
      container.innerHTML = `
        <div class="sst-builder-live-hero" id="builderHero">
          <div class="sst-hero-band-accent"></div>
          ${builderHeroBadgeHtml()}
          <input class="sst-builder-hero-title-input" id="bTitle" value="${escapeHtml(builderState.title || '')}" placeholder="Titre du formulaire">
          <textarea class="sst-builder-hero-desc-input" id="bDesc" placeholder="Description (optionnel)" rows="1">${escapeHtml(builderState.description || '')}</textarea>
        </div>
        <div class="sst-builder-add-row"><button class="sst-builder-add-btn" data-add-at="0"><i class="fas fa-plus"></i> Ajouter une question</button></div>
        ${fields.map((field, i) => `
          ${renderInlineField(field, i, fields.length)}
          <div class="sst-builder-add-row"><button class="sst-builder-add-btn" data-add-at="${i + 1}"><i class="fas fa-plus"></i> Ajouter une question</button></div>
        `).join('')}
        <div class="sst-builder-price-block">
          <label class="sst-label">Tarification</label>
          <select class="sst-select" id="bPricing" style="max-width:220px;">
            <option value="free" ${builderState.pricingType !== 'fixed' ? 'selected' : ''}>Gratuit</option>
            <option value="fixed" ${builderState.pricingType === 'fixed' ? 'selected' : ''}>Payant</option>
          </select>
          <div id="bPriceField" style="${builderState.pricingType === 'fixed' ? '' : 'display:none;'}margin-top:.6rem;max-width:220px;">
            <input class="sst-input" type="number" id="bPrice" min="1" placeholder="Prix (HTG)" value="${builderState.price || ''}">
          </div>
          <div class="sst-builder-capacity-field">
            <label class="sst-label" for="bMaxParticipants">Nombre de places <span class="sst-optional-label">Optionnel</span></label>
            <input class="sst-input" type="number" id="bMaxParticipants" min="1" step="1" inputmode="numeric" placeholder="Illimité" value="${Number.isInteger(builderState.maxParticipants) && builderState.maxParticipants > 0 ? builderState.maxParticipants : ''}">
            <div class="sst-hint">Laissez ce champ vide si le nombre d’inscriptions est illimité.</div>
          </div>
        </div>
      `;
      applyFormTheme(container, builderState);
      bindBuilderEditorEvents(container);
    }

    /** Real logo if uploaded, otherwise an initial-letter badge — same fallback the
     * public page itself uses, so the builder never shows a design the visitor won't see. */
    function builderHeroBadgeHtml() {
      return builderState.logoUrl
        ? `<img class="sst-hero-badge sst-hero-badge-logo" src="${escapeHtml(builderState.logoUrl)}" alt="Logo">`
        : `<div class="sst-hero-badge sst-hero-badge-fallback">${escapeHtml((builderState.title || '?').trim().charAt(0).toUpperCase() || '?')}</div>`;
    }

    /** Re-applies live theme colors + badge onto the already-rendered hero, without a
     * full re-render — called whenever Personnaliser changes colors/logo so the editor
     * never lags behind what will actually be published. */
    function syncBuilderTheme() {
      const container = builderOverlay?.querySelector('#builderEditor');
      if (!container) return;
      applyFormTheme(container, builderState);
      const badge = container.querySelector('.sst-hero-badge');
      if (badge) badge.outerHTML = builderHeroBadgeHtml();
    }

    function renderInlineField(field, index, total) {
      const isStructural = STRUCTURAL_BUILDER_TYPES.has(field.type);
      const typeLabel = FIELD_TYPE_LABELS[field.type] || field.type;
      let bodyHtml = '';

      if (field.type === 'sectionTitle') {
        bodyHtml = `
          <input class="sst-builder-live-label sst-builder-live-heading" data-edit-title value="${escapeHtml(field.title || '')}" placeholder="Titre de section">
          <input class="sst-builder-live-sub" data-edit-description value="${escapeHtml(field.description || '')}" placeholder="Description (optionnel)">
        `;
      } else if (field.type === 'sectionText') {
        bodyHtml = `<textarea class="sst-builder-live-textarea" data-edit-text rows="2" placeholder="Texte a afficher...">${escapeHtml(field.text || '')}</textarea>`;
      } else if (field.type === 'divider') {
        bodyHtml = `<div class="sst-builder-live-divider-preview"></div>`;
      } else if (field.type === 'consent') {
        bodyHtml = `
          <input class="sst-builder-live-label" data-edit-label value="${escapeHtml(field.label || '')}" placeholder="Nom interne (ex: CGU)">
          <textarea class="sst-builder-live-textarea" data-edit-text rows="2" placeholder="Texte affiche au participant">${escapeHtml(field.text || '')}</textarea>
        `;
      } else {
        bodyHtml = `<input class="sst-builder-live-label" data-edit-label value="${escapeHtml(field.label || '')}" placeholder="Question">`;
        if (['select', 'radio', 'multiselect'].includes(field.type)) {
          bodyHtml += `
            <div class="sst-builder-live-options">
              ${(field.options || []).map((o, oi) => `
                <div class="sst-builder-chip-row"><input class="sst-input" data-option-index="${oi}" value="${escapeHtml(o)}" placeholder="Option ${oi + 1}"><button class="sst-builder-icon-btn danger" data-remove-option="${oi}"><i class="fas fa-xmark"></i></button></div>
              `).join('')}
            </div>
            <button class="sst-btn sst-btn-secondary" data-add-option style="width:100%;"><i class="fas fa-plus"></i> Ajouter une option</button>
          `;
        } else if (field.type === 'file') {
          bodyHtml += `<div class="sst-hint"><i class="fas fa-paperclip"></i> Le participant pourra televerser ${field.fileKind === 'image' ? 'une image' : 'un document'}.</div>`;
        }
      }

      return `
        <div class="sst-builder-live-field" data-field-id="${field.id}">
          <div class="sst-builder-live-type-badge">${escapeHtml(typeLabel)}</div>
          ${bodyHtml}
          <div class="sst-builder-live-toolbar">
            ${!isStructural && field.type !== 'consent'
              ? `<label class="sst-builder-required-toggle"><input type="checkbox" data-edit-required ${field.required ? 'checked' : ''}> Obligatoire</label>`
              : '<span></span>'}
            <div class="sst-builder-live-actions">
              <button class="sst-builder-icon-btn" data-move-up title="Monter" ${index === 0 ? 'disabled' : ''}><i class="fas fa-arrow-up"></i></button>
              <button class="sst-builder-icon-btn" data-move-down title="Descendre" ${index === total - 1 ? 'disabled' : ''}><i class="fas fa-arrow-down"></i></button>
              <button class="sst-builder-icon-btn" data-duplicate title="Dupliquer"><i class="fas fa-copy"></i></button>
              <button class="sst-builder-icon-btn danger" data-remove title="Supprimer"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      `;
    }

    function bindBuilderEditorEvents(container) {
      container.querySelector('#bTitle').addEventListener('input', (e) => {
        builderState.title = e.target.value;
        const fallbackBadge = container.querySelector('.sst-hero-badge-fallback');
        if (fallbackBadge) fallbackBadge.textContent = (e.target.value || '?').trim().charAt(0).toUpperCase() || '?';
      });
      container.querySelector('#bDesc').addEventListener('input', (e) => { builderState.description = e.target.value; });
      container.querySelector('#bPricing').addEventListener('change', (e) => {
        builderState.pricingType = e.target.value;
        container.querySelector('#bPriceField').style.display = e.target.value === 'fixed' ? 'block' : 'none';
      });
      container.querySelector('#bPrice')?.addEventListener('input', (e) => { builderState.price = Number(e.target.value); });
      container.querySelector('#bMaxParticipants')?.addEventListener('input', (e) => {
        builderState.maxParticipants = e.target.value === '' ? null : Number(e.target.value);
      });

      container.querySelectorAll('[data-add-at]').forEach((btn) => {
        btn.addEventListener('click', () => openAddFieldPopover(btn, Number(btn.dataset.addAt)));
      });

      container.querySelectorAll('.sst-builder-live-field').forEach((el) => {
        const fieldId = el.dataset.fieldId;
        const field = builderState.fields.find((f) => f.id === fieldId);
        if (!field) return;

        el.querySelector('[data-edit-label]')?.addEventListener('input', (e) => { field.label = e.target.value; });
        el.querySelector('[data-edit-title]')?.addEventListener('input', (e) => { field.title = e.target.value; });
        el.querySelector('[data-edit-description]')?.addEventListener('input', (e) => { field.description = e.target.value; });
        el.querySelector('[data-edit-text]')?.addEventListener('input', (e) => { field.text = e.target.value; });
        el.querySelector('[data-edit-required]')?.addEventListener('change', (e) => { field.required = e.target.checked; });

        el.querySelectorAll('[data-option-index]').forEach((input) => {
          input.addEventListener('input', (e) => { field.options[Number(e.target.dataset.optionIndex)] = e.target.value; });
        });
        el.querySelector('[data-add-option]')?.addEventListener('click', () => {
          if (!field.options) field.options = [];
          field.options.push('');
          renderBuilderEditor();
        });
        el.querySelectorAll('[data-remove-option]').forEach((btn) => {
          btn.addEventListener('click', () => { field.options.splice(Number(btn.dataset.removeOption), 1); renderBuilderEditor(); });
        });

        el.querySelector('[data-move-up]')?.addEventListener('click', () => moveBuilderField(fieldId, -1));
        el.querySelector('[data-move-down]')?.addEventListener('click', () => moveBuilderField(fieldId, 1));
        el.querySelector('[data-duplicate]')?.addEventListener('click', () => duplicateBuilderField(fieldId));
        el.querySelector('[data-remove]')?.addEventListener('click', () => removeBuilderField(fieldId));
      });
    }

    /** Small popover anchored to the "+" button — 6 essentials, "Plus d'options" unfolds the rest. */
    function openAddFieldPopover(anchorBtn, atIndex) {
      document.querySelectorAll('.sst-builder-add-popover').forEach((el) => el.remove());
      const popover = document.createElement('div');
      popover.className = 'sst-builder-add-popover';
      popover.innerHTML = `
        <div class="sst-builder-add-essential">
          ${FIELD_PALETTE_ESSENTIAL.map((item, i) => `<button data-essential="${i}"><i class="fas fa-${item.icon}"></i> ${escapeHtml(item.label)}</button>`).join('')}
        </div>
        <button class="sst-builder-add-more-toggle" id="addMoreToggle">Plus d'options <i class="fas fa-chevron-down"></i></button>
        <div class="sst-builder-add-more" id="addMoreList">
          ${FIELD_PALETTE_MORE.map((group) => `
            <div class="sst-builder-palette-group"><h4>${escapeHtml(group.group)}</h4>
              ${group.items.map((item, i) => `<button data-more="${group.group}:${i}"><i class="fas fa-${item.icon}"></i> ${escapeHtml(item.label)}</button>`).join('')}
            </div>
          `).join('')}
        </div>
      `;
      anchorBtn.parentElement.style.position = 'relative';
      anchorBtn.parentElement.appendChild(popover);

      popover.querySelectorAll('[data-essential]').forEach((btn) => {
        btn.addEventListener('click', () => { insertBuilderField(FIELD_PALETTE_ESSENTIAL[Number(btn.dataset.essential)], atIndex); popover.remove(); });
      });
      popover.querySelector('#addMoreToggle').addEventListener('click', () => popover.querySelector('#addMoreList').classList.toggle('open'));
      popover.querySelectorAll('[data-more]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const [g, i] = btn.dataset.more.split(':');
          const group = FIELD_PALETTE_MORE.find((x) => x.group === g);
          insertBuilderField(group.items[Number(i)], atIndex);
          popover.remove();
        });
      });
      setTimeout(() => {
        document.addEventListener('click', function closeOnce(e) {
          if (!popover.contains(e.target) && e.target !== anchorBtn && !anchorBtn.contains(e.target)) {
            popover.remove();
            document.removeEventListener('click', closeOnce);
          }
        });
      }, 0);
    }

    /** Logo/cover/colors/layout/info chips/confirmation — a separate step from question-editing. */
    function openPersonalizeModal() {
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open sst-personalize-overlay';
      overlay.innerHTML = `<div class="sst-modal sst-personalize-modal">${renderPersonalizeForm()}</div>`;
      document.body.appendChild(overlay);
      bindPersonalizeEvents(overlay);
    }

    function renderPersonalizeForm() {
      const colors = builderState.colors || {};
      const primaryColor = colors.primary || '#18181B';
      const buttonColor = colors.buttonColor || colors.accent || '#4F46E5';
      const uploadPreview = (url, icon) => url
        ? `<img src="${escapeHtml(url)}" alt="Aperçu">`
        : `<i class="fas fa-${icon}" aria-hidden="true"></i>`;
      return `
        <header class="sst-personalize-header">
          <div><span>Apparence</span><h3>Personnaliser le formulaire</h3></div>
          <button class="sst-personalize-close" id="bPersonalizeClose" aria-label="Fermer"><i class="fas fa-xmark"></i></button>
        </header>

        <div class="sst-personalize-body">
          <section class="sst-personalize-section">
            <div class="sst-personalize-section-heading"><h4>Identité visuelle</h4><p>Logo et image affichés sur votre page publique.</p></div>
            <div class="sst-personalize-upload-grid">
              <div class="sst-personalize-upload-card">
                <div class="sst-personalize-upload-preview sst-logo-preview">${uploadPreview(builderState.logoUrl, 'building')}</div>
                <div class="sst-personalize-upload-copy"><strong>Logo</strong><span>PNG, JPG ou WEBP · 8 Mo max.</span></div>
                <input class="sst-visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" id="bLogoFile">
                <label class="sst-upload-trigger" for="bLogoFile"><i class="fas fa-arrow-up-from-bracket"></i> ${builderState.logoUrl ? 'Remplacer' : 'Choisir'}</label>
                ${builderState.logoUrl ? '<button class="sst-upload-remove" data-remove-branding="logo" aria-label="Retirer le logo"><i class="fas fa-trash"></i></button>' : ''}
                <div class="sst-upload-status" id="bLogoStatus" role="status"></div>
              </div>
              <div class="sst-personalize-upload-card">
                <div class="sst-personalize-upload-preview">${uploadPreview(builderState.coverImageUrl, 'image')}</div>
                <div class="sst-personalize-upload-copy"><strong>Image de couverture</strong><span>Format paysage recommandé · 8 Mo max.</span></div>
                <input class="sst-visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" id="bCoverFile">
                <label class="sst-upload-trigger" for="bCoverFile"><i class="fas fa-arrow-up-from-bracket"></i> ${builderState.coverImageUrl ? 'Remplacer' : 'Choisir'}</label>
                ${builderState.coverImageUrl ? '<button class="sst-upload-remove" data-remove-branding="cover" aria-label="Retirer l’image"><i class="fas fa-trash"></i></button>' : ''}
                <div class="sst-upload-status" id="bCoverStatus" role="status"></div>
              </div>
            </div>
          </section>

          <section class="sst-personalize-section">
            <div class="sst-personalize-section-heading"><h4>Mise en page</h4><p>Choisissez la présentation de l’en-tête sur la page publique.</p></div>
            <select class="sst-select" id="bLayout">
              <option value="minimal" ${builderState.layout === 'minimal' || !builderState.layout ? 'selected' : ''}>Identité minimaliste</option>
              <option value="cover" ${builderState.layout === 'cover' ? 'selected' : ''}>Texte sur l’image de couverture</option>
              <option value="hero" ${builderState.layout === 'hero' ? 'selected' : ''}>Image et identité</option>
              <option value="image" ${builderState.layout === 'image' ? 'selected' : ''}>Image seule dans la colonne droite</option>
            </select>
            <div class="sst-layout-note" id="bLayoutNote">${builderState.layout === 'image' && !builderState.coverImageUrl ? '<i class="fas fa-circle-info"></i> Ajoutez une image de couverture pour utiliser cette disposition.' : ''}</div>
          </section>

          <section class="sst-personalize-section">
            <div class="sst-personalize-section-heading"><h4>Couleurs</h4><p>Cliquez sur une couleur, utilisez les suggestions ou saisissez un code hexadécimal.</p></div>
            ${renderColorControl('primary', 'Couleur principale', primaryColor, ['#18181B', '#0F2747', '#064E3B', '#581C87', '#7C2D12'])}
            ${renderColorControl('button', 'Couleur du bouton', buttonColor, ['#4F46E5', '#0071E3', '#059669', '#EA580C', '#DC2626'])}
          </section>

          <section class="sst-personalize-section">
            <div class="sst-personalize-section-heading"><h4>Informations <span>Optionnel</span></h4><p>Ajoutez une date, un lieu ou une information courte.</p></div>
            <div id="bChipsList">${(builderState.infoChips || []).map((chip, i) => `
              <div class="sst-builder-chip-row"><input class="sst-input" data-chip-index="${i}" value="${escapeHtml(chip.text || '')}" placeholder="Ex. 15 septembre 2026"><button class="sst-builder-icon-btn danger" data-remove-chip="${i}" aria-label="Supprimer"><i class="fas fa-xmark"></i></button></div>
            `).join('')}</div>
            <button class="sst-personalize-add" id="bAddChip"><i class="fas fa-plus"></i> Ajouter une information</button>
          </section>

          <section class="sst-personalize-section">
            <div class="sst-personalize-section-heading"><h4>Confirmation</h4><p>Message affiché après une inscription réussie.</p></div>
            <div class="sst-personalize-field-grid">
              <div class="sst-field"><label class="sst-label">Titre</label><input class="sst-input" id="bConfirmTitle" value="${escapeHtml(builderState.confirmation?.title || '')}" placeholder="Inscription confirmée !"></div>
              <div class="sst-field"><label class="sst-label">Message</label><textarea class="sst-textarea" id="bConfirmMessage" rows="3" placeholder="Merci, nous avons bien reçu votre inscription.">${escapeHtml(builderState.confirmation?.message || '')}</textarea></div>
            </div>
          </section>
        </div>

        <footer class="sst-personalize-footer"><button class="sst-btn sst-btn-primary" id="bPersonalizeDone">Terminé</button></footer>
      `;
    }

    function renderColorControl(key, label, value, presets) {
      const safeValue = /^#[0-9a-f]{6}$/i.test(value) ? value : '#18181B';
      return `
        <div class="sst-color-control">
          <div class="sst-color-control-label"><label for="bColor_${key}">${label}</label><span>${safeValue.toUpperCase()}</span></div>
          <div class="sst-color-control-row">
            <input class="sst-color-picker" type="color" id="bColor_${key}" data-color-picker="${key}" value="${safeValue}" aria-label="${label}">
            <input class="sst-color-hex" type="text" data-color-hex="${key}" value="${safeValue.toUpperCase()}" maxlength="7" spellcheck="false" aria-label="Code hexadécimal ${label}">
            <div class="sst-color-presets" aria-label="Suggestions de couleurs">
              ${presets.map((color) => `<button type="button" data-color-preset="${key}" data-color-value="${color}" style="--preset:${color}" aria-label="Choisir ${color}"></button>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function bindPersonalizeEvents(overlay) {
      const rerender = () => { overlay.querySelector('.sst-modal').innerHTML = renderPersonalizeForm(); bindPersonalizeEvents(overlay); };
      overlay.querySelector('#bPersonalizeClose').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#bPersonalizeDone').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#bLayout').addEventListener('change', (e) => { builderState.layout = e.target.value; rerender(); });

      const applyColor = (key, rawValue) => {
        const value = String(rawValue || '').trim();
        if (!/^#[0-9a-f]{6}$/i.test(value)) return false;
        const property = key === 'primary' ? 'primary' : 'buttonColor';
        builderState.colors = { ...builderState.colors, [property]: value };
        const picker = overlay.querySelector(`[data-color-picker="${key}"]`);
        const hex = overlay.querySelector(`[data-color-hex="${key}"]`);
        const label = picker?.closest('.sst-color-control')?.querySelector('.sst-color-control-label span');
        if (picker) picker.value = value;
        if (hex) hex.value = value.toUpperCase();
        if (label) label.textContent = value.toUpperCase();
        syncBuilderTheme();
        return true;
      };
      overlay.querySelectorAll('[data-color-picker]').forEach((input) => {
        input.addEventListener('input', (e) => applyColor(e.target.dataset.colorPicker, e.target.value));
        input.addEventListener('change', (e) => applyColor(e.target.dataset.colorPicker, e.target.value));
      });
      overlay.querySelectorAll('[data-color-hex]').forEach((input) => {
        input.addEventListener('change', (e) => {
          if (!applyColor(e.target.dataset.colorHex, e.target.value)) {
            showToast('Utilisez un code couleur comme #0071E3.', 'error');
          }
        });
      });
      overlay.querySelectorAll('[data-color-preset]').forEach((btn) => {
        btn.addEventListener('click', () => applyColor(btn.dataset.colorPreset, btn.dataset.colorValue));
      });
      overlay.querySelector('#bConfirmTitle').addEventListener('input', (e) => { builderState.confirmation = { ...builderState.confirmation, title: e.target.value }; });
      overlay.querySelector('#bConfirmMessage').addEventListener('input', (e) => { builderState.confirmation = { ...builderState.confirmation, message: e.target.value }; });

      overlay.querySelector('#bLogoFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.disabled = true;
        overlay.querySelector('#bLogoStatus').textContent = 'Téléversement en cours…';
        try {
          builderState.logoUrl = (await uploadImageFile(file, `sst-forms/${builderState.formSchemaId || 'new'}/branding`, { maxSizeMb: 8 })).url;
          syncBuilderTheme();
          rerender();
        } catch (error) {
          e.target.disabled = false;
          overlay.querySelector('#bLogoStatus').textContent = error.message || 'Le logo n’a pas pu être téléversé.';
        }
      });
      overlay.querySelector('#bCoverFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.disabled = true;
        overlay.querySelector('#bCoverStatus').textContent = 'Téléversement en cours…';
        try {
          builderState.coverImageUrl = (await uploadImageFile(file, `sst-forms/${builderState.formSchemaId || 'new'}/branding`, { maxSizeMb: 8 })).url;
          rerender();
        } catch (error) {
          e.target.disabled = false;
          overlay.querySelector('#bCoverStatus').textContent = error.message || 'L’image n’a pas pu être téléversée.';
        }
      });

      overlay.querySelectorAll('[data-remove-branding]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.removeBranding === 'logo') builderState.logoUrl = null;
          if (btn.dataset.removeBranding === 'cover') {
            builderState.coverImageUrl = null;
            if (builderState.layout === 'image') builderState.layout = 'minimal';
          }
          syncBuilderTheme();
          rerender();
        });
      });

      overlay.querySelector('#bAddChip').addEventListener('click', () => { builderState.infoChips = [...(builderState.infoChips || []), { text: '' }]; rerender(); });
      overlay.querySelectorAll('[data-chip-index]').forEach((input) => {
        input.addEventListener('input', (e) => { builderState.infoChips[Number(e.target.dataset.chipIndex)] = { text: e.target.value }; });
      });
      overlay.querySelectorAll('[data-remove-chip]').forEach((btn) => {
        btn.addEventListener('click', () => { builderState.infoChips.splice(Number(btn.dataset.removeChip), 1); rerender(); });
      });

    function formatSubmissionDate(value) {
      if (!value) return '-';
      if (typeof value?.toDate === 'function') return value.toDate().toLocaleDateString('fr-FR');
      if (typeof value === 'object' && Number.isFinite(value.seconds)) return new Date(value.seconds * 1000).toLocaleDateString('fr-FR');
      if (typeof value === 'object' && Number.isFinite(value._seconds)) return new Date(value._seconds * 1000).toLocaleDateString('fr-FR');
      const d = new Date(value);
      return Number.isFinite(d.getTime()) ? d.toLocaleDateString('fr-FR') : '-';
    }

    function formatAnswerValue(value) {
      if (value === undefined || value === null || value === '') return '-';
      if (typeof value === 'boolean') return value ? 'Oui' : 'Non';
      if (Array.isArray(value)) return value.length ? value.join(', ') : '-';
      return String(value);
    }

    function submissionStatusBadge(status) {
      if (status === 'confirmed') return 'confirmed';
      if (['refunded', 'cancelled'].includes(status)) return 'rejected';
      return 'pending';
    }

    function renderSubmissionDetail(submission, fields) {
