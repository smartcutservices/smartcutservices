    function bindShopWsLivraisonEvents(el) {
      el.querySelector('#wPickupEnabled').addEventListener('change', (e) => setShopWsField('delivery.pickupEnabled', e.target.checked));
      el.querySelector('#wPickupAddress').addEventListener('input', (e) => setShopWsField('delivery.pickupAddress', e.target.value));
      el.querySelector('#wPickupHours').addEventListener('input', (e) => setShopWsField('delivery.pickupHours', e.target.value));
      el.querySelector('#wDeliveryEnabled').addEventListener('change', (e) => {
        setShopWsField('delivery.deliveryEnabled', e.target.checked);
        el.querySelector('#wZonesWrap').style.display = e.target.checked ? '' : 'none';
      });
      el.querySelector('#wFreeThreshold').addEventListener('input', (e) => setShopWsField('delivery.freeDeliveryThreshold', e.target.value ? Number(e.target.value) : null));
      el.querySelector('#wMinOrder').addEventListener('input', (e) => setShopWsField('delivery.minOrderAmount', e.target.value ? Number(e.target.value) : 0));
      el.querySelector('#wInstructions').addEventListener('input', (e) => setShopWsField('delivery.instructions', e.target.value));
      el.querySelector('#wPhoneRequired').addEventListener('change', (e) => setShopWsField('delivery.phoneRequired', e.target.checked));
      el.querySelector('#wAddZone').addEventListener('click', () => {
        shopWs.catalog.delivery.zones = [...(shopWs.catalog.delivery.zones || []), { id: `zone_${Date.now()}`, name: '', fee: 0, etaLabel: '' }];
        markShopWsDirty();
        refreshZonesList(el);
      });
      bindZoneRowEvents(el);
    }
    function refreshZonesList(el) {
      const wrap = el.querySelector('#wZonesList');
      wrap.innerHTML = renderShopWsZonesList();
      bindZoneRowEvents(el);
    }
    function bindZoneRowEvents(el) {
      el.querySelectorAll('[data-zone-index]').forEach((row) => {
        const i = Number(row.dataset.zoneIndex);
        row.querySelectorAll('[data-zone-field]').forEach((input) => input.addEventListener('input', (e) => {
          const zones = shopWs.catalog.delivery.zones;
          const field = e.target.dataset.zoneField;
          zones[i][field] = field === 'fee' ? (Number(e.target.value) || 0) : e.target.value;
          if (!zones[i].id) zones[i].id = `zone_${Date.now()}_${i}`;
          markShopWsDirty();
        }));
      });
      el.querySelectorAll('[data-remove-zone]').forEach((btn) => btn.addEventListener('click', () => {
        shopWs.catalog.delivery.zones.splice(Number(btn.dataset.removeZone), 1);
        markShopWsDirty();
        refreshZonesList(el);
      }));
    }

    // ---------- Commandes tab ----------

    function filterShopWsOrders() {
      let list = shopWs.orders.slice();
      const term = shopWsOrderFilter.search.trim().toLowerCase();
      if (term) list = list.filter((o) => (o.customerName || '').toLowerCase().includes(term) || (o.customerEmail || '').toLowerCase().includes(term));
      if (shopWsOrderFilter.status) list = list.filter((o) => o.status === shopWsOrderFilter.status);
      return list;
    }

    function renderShopWsCommandes(el) {
      el.innerHTML = `
        <div class="sst-shop-ws-panel sst-shop-ws-panel-wide">
          <div class="sst-shop-ws-toolbar">
            <input type="search" class="sst-input" id="wOrderSearch" placeholder="Rechercher (client, email)" value="${escapeHtml(shopWsOrderFilter.search)}">
            <select class="sst-select" id="wOrderStatusFilter">
              <option value="">Tous les statuts</option>
              ${Object.entries(SHOP_ORDER_STATUS_LABELS).map(([value, label]) => `<option value="${value}" ${shopWsOrderFilter.status === value ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
          </div>
          <div id="wOrderList">${renderShopWsOrderList(filterShopWsOrders())}</div>
        </div>
      `;
      el.querySelector('#wOrderSearch').addEventListener('input', (e) => { shopWsOrderFilter.search = e.target.value; refreshOrderList(el); });
      el.querySelector('#wOrderStatusFilter').addEventListener('change', (e) => { shopWsOrderFilter.status = e.target.value; refreshOrderList(el); });
      bindOrderRowEvents(el);
    }

    function renderShopWsOrderList(orders) {
      if (!shopWs.orders.length) return '<div class="sst-shop-orders-empty"><i class="fas fa-receipt"></i><span>Aucune commande pour le moment.</span></div>';
      if (!orders.length) return '<div class="sst-empty">Aucun résultat pour ces filtres.</div>';
      return `<div class="sst-table-scroll"><table class="sst-table">
        <thead><tr><th>Client</th><th>Montant</th><th>Mode</th><th>Statut</th><th>Reçue le</th><th></th></tr></thead>
        <tbody>${orders.map((o) => `
          <tr class="sst-shop-ws-order-row" data-view-order="${o.id}">
            <td><strong>${escapeHtml(o.customerName || 'Client')}</strong><br><small>${escapeHtml(o.customerEmail || '')}</small></td>
            <td>${formatCurrency(o.amountDue)}</td>
            <td>${o.deliveryMethod === 'delivery' ? 'Livraison' : 'Retrait'}</td>
            <td><span class="sst-badge ${['confirmed', 'preparing', 'ready_for_pickup', 'shipped', 'delivered'].includes(o.status) ? 'confirmed' : o.status === 'cancelled' ? 'cancelled' : o.status === 'confirmed_stock_conflict' ? 'rejected' : 'pending'}">${SHOP_ORDER_STATUS_LABELS[o.status] || o.status}</span></td>
            <td>${formatSubmissionDate(o.createdAt)}</td>
            <td><button class="sst-btn sst-btn-secondary" data-view-order-btn="${o.id}" aria-label="Voir la commande"><i class="fas fa-arrow-right"></i></button></td>
          </tr>
        `).join('')}</tbody>
      </table></div>`;
    }
    function refreshOrderList(el) {
      el.querySelector('#wOrderList').innerHTML = renderShopWsOrderList(filterShopWsOrders());
      bindOrderRowEvents(el);
    }
    function bindOrderRowEvents(el) {
      el.querySelectorAll('[data-view-order], [data-view-order-btn]').forEach((node) => {
        node.addEventListener('click', () => {
          const orderId = node.dataset.viewOrder || node.dataset.viewOrderBtn;
          const order = shopWs.orders.find((o) => o.id === orderId);
          if (order) openOrderDrawer(order);
        });
      });
    }

    function shopOrderNextStatuses(order) {
      if (order.status === 'pending_payment' || ['delivered', 'cancelled'].includes(order.status)) return [];
      const base = ['preparing', order.deliveryMethod === 'pickup' ? 'ready_for_pickup' : 'shipped', 'delivered', 'cancelled'];
      return base.filter((s) => s !== order.status);
    }

    function openOrderDrawer(order) {
      const overlay = document.createElement('div');
      overlay.className = 'sst-shop-ws-drawer-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      const nextStatuses = shopOrderNextStatuses(order);
      overlay.innerHTML = `
        <div class="sst-shop-ws-drawer">
          <div class="sst-shop-ws-drawer-header">
            <h3>Commande de ${escapeHtml(order.customerName || order.customerEmail || 'client')}</h3>
            <button class="sst-personalize-close" id="odClose" aria-label="Fermer"><i class="fas fa-xmark"></i></button>
          </div>
          <div class="sst-shop-ws-drawer-body">
            <div class="sst-shop-ws-section">
              <h4>Client</h4>
              <p>${escapeHtml(order.customerName || '—')}<br>${escapeHtml(order.customerEmail || '')}${order.customerPhone ? `<br>${escapeHtml(order.customerPhone)}` : ''}</p>
            </div>
            <div class="sst-shop-ws-section">
              <h4>Produits</h4>
              <table class="sst-table"><tbody>
                ${(order.items || []).map((item) => `<tr><td>${escapeHtml(item.name)}${item.variantName ? ` — ${escapeHtml(item.variantName)}` : ''}<br><small>x${item.quantity}</small></td><td>${formatCurrency(item.unitPrice * item.quantity)}</td></tr>`).join('')}
              </tbody></table>
              <p style="margin-top:.6rem;">Sous-total : ${formatCurrency(order.subtotal)}<br>${order.deliveryMethod === 'delivery' ? `Livraison (${escapeHtml(order.deliveryZoneName || '')}) : ${formatCurrency(order.deliveryFee)}<br>` : ''}<strong>Total : ${formatCurrency(order.amountDue)}</strong></p>
            </div>
            <div class="sst-shop-ws-section">
              <h4>${order.deliveryMethod === 'delivery' ? 'Livraison' : 'Retrait'}</h4>
              <p>${order.deliveryMethod === 'delivery' ? escapeHtml(order.deliveryAddress || '—') : 'Le client viendra récupérer sa commande.'}</p>
            </div>
            <div class="sst-shop-ws-section">
              <h4>Statut</h4>
              <p class="sst-hint">Statut actuel : ${SHOP_ORDER_STATUS_LABELS[order.status] || order.status}</p>
              ${nextStatuses.length ? `
                <div class="sst-field"><label class="sst-label" for="odStatus">Nouveau statut</label>
                  <select class="sst-select" id="odStatus">${nextStatuses.map((s) => `<option value="${s}">${SHOP_ORDER_STATUS_LABELS[s]}</option>`).join('')}</select>
                </div>
                <div class="sst-field"><label class="sst-label" for="odTracking">Numéro de suivi (optionnel)</label><input class="sst-input" id="odTracking" value="${escapeHtml(order.trackingNumber || '')}"></div>
              ` : '<p class="sst-hint">Aucune action possible sur cette commande.</p>'}
              <div class="sst-field"><label class="sst-label" for="odNotes">Notes internes</label><textarea class="sst-textarea" id="odNotes" rows="2">${escapeHtml(order.internalNotes || '')}</textarea></div>
              ${(order.statusHistory || []).length ? `<ul class="sst-shop-ws-history">${order.statusHistory.map((h) => `<li>${SHOP_ORDER_STATUS_LABELS[h.status] || h.status} — ${formatSubmissionDate(h.at)}</li>`).join('')}</ul>` : ''}
            </div>
          </div>
          <div class="sst-shop-ws-drawer-footer">
            <button class="sst-btn sst-btn-secondary" id="odCancel">Fermer</button>
            ${nextStatuses.length ? '<button class="sst-btn sst-btn-primary" id="odSave">Mettre à jour</button>' : ''}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const close = () => { overlay.remove(); document.removeEventListener('keydown', escHandler); };
      function escHandler(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', escHandler);
      overlay.querySelector('#odClose').addEventListener('click', close);
      overlay.querySelector('#odCancel').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      overlay.querySelector('#odSave')?.addEventListener('click', async () => {
        const btn = overlay.querySelector('#odSave');
        btn.disabled = true;
        try {
          await callSst('UpdateShopOrderStatus', {
            method: 'POST', auth: currentUser,
            body: {
              organizationId: shopWs.org.id, orderId: order.id,
              status: overlay.querySelector('#odStatus').value,
              trackingNumber: overlay.querySelector('#odTracking')?.value.trim() || null,
              internalNotes: overlay.querySelector('#odNotes').value.trim()
            }
          });
          showToast('Commande mise à jour.');
          close();
        } catch (error) { btn.disabled = false; showToast(error.message, 'error'); }
      });
    }

    async function deleteAppResource(org, apiName, idKey, id, button) {
      if (!confirm('Supprimer ce projet ? Cette action est définitive s’il ne contient encore aucune activité.')) return;
      button.disabled = true;
      try {
        const result = await callSst(`Delete${apiName}`, {
          method: 'POST', auth: currentUser,
          body: { organizationId: org.id, [idKey]: id }
        });
        showToast(result.archived ? 'Projet retiré. Son historique est conservé.' : 'Projet supprimé.');
      } catch (error) {
        button.disabled = false;
        showToast(error.message, 'error');
      }
    }

    // ---------- Courses ----------
    function renderCoursesTab(content, org) {
      const cleanup = mountCourseStudio(content, {
        organization: org, db, callSst, getCurrentUser: () => currentUser,
        toast: showToast, formatCurrency, escapeHtml, uploadImageFile, uploadStorageFile
      });
      if (cleanup) unsubscribers.push(cleanup);
      return;
      content.innerHTML = `
        <div class="sst-card-header" style="margin-bottom:1rem;"><h2 style="font-size:1.1rem;">Mes cours</h2>
          <button class="sst-btn sst-btn-primary" id="newCourseBtn"><i class="fas fa-plus"></i> Nouveau cours</button>
        </div>
        <div id="coursesList"><div class="sst-loading">Chargement...</div></div>
      `;
      document.getElementById('newCourseBtn').addEventListener('click', () => openCourseEditor(org));

      const coursesQuery = query(collection(db, 'courses'), where('organizationId', '==', org.id));
      unsubscribers.push(onSnapshot(coursesQuery, (snap) => {
        const list = document.getElementById('coursesList');
        if (!list) return;
        const courses = snap.docs.filter((d) => d.data().status !== 'archived');
        if (!courses.length) { list.innerHTML = '<div class="sst-empty">Aucun cours. Créez-en un pour commencer.</div>'; return; }
        list.innerHTML = courses.map((d) => {
          const c = d.data();
          return `<div class="sst-app-resource-card">
            <div class="sst-app-resource-icon course"><i class="fas fa-graduation-cap"></i></div>
            <div class="sst-app-resource-info"><strong>${escapeHtml(c.title)}</strong><span>${formatCurrency(c.pricing?.amount ?? c.price)} <span class="sst-badge ${c.status}">${escapeHtml(courseStatusLabel(c.status))}</span></span></div>
            <div class="sst-app-resource-actions">
              <button class="sst-btn sst-btn-secondary" data-edit-course="${d.id}"><i class="fas fa-pen"></i> Modifier</button>
              <button class="sst-btn sst-btn-secondary" data-manage-content="${d.id}"><i class="fas fa-list-check"></i> Contenu</button>
              <button class="sst-btn sst-btn-secondary" data-view-enrollments="${d.id}"><i class="fas fa-users"></i> Inscrits</button>
              ${c.status === 'published'
                ? `<button class="sst-btn sst-btn-secondary" data-course-unpublish="${d.id}">Depublier</button> ${publicLinkHtml('courses', 'courseId', d.id, org)}`
                : `<button class="sst-btn sst-btn-primary" data-course-publish="${d.id}">Publier</button>`}
              <button class="sst-builder-icon-btn danger" data-delete-course="${d.id}" title="Supprimer" aria-label="Supprimer ${escapeHtml(c.title)}"><i class="fas fa-trash"></i></button>
            </div>
          </div>`;
        }).join('');
        list.querySelectorAll('[data-course-publish]').forEach((btn) => btn.addEventListener('click', () => setCourseStatus(org, btn.dataset.coursePublish, 'published')));
        list.querySelectorAll('[data-course-unpublish]').forEach((btn) => btn.addEventListener('click', () => setCourseStatus(org, btn.dataset.courseUnpublish, 'suspended')));
        list.querySelectorAll('[data-edit-course]').forEach((btn) => btn.addEventListener('click', () => openCourseEditor(org, btn.dataset.editCourse)));
        list.querySelectorAll('[data-manage-content]').forEach((btn) => btn.addEventListener('click', () => openCourseContentEditor(org, btn.dataset.manageContent)));
        list.querySelectorAll('[data-view-enrollments]').forEach((btn) => btn.addEventListener('click', () => viewEnrollments(org, btn.dataset.viewEnrollments)));
        list.querySelectorAll('[data-delete-course]').forEach((btn) => btn.addEventListener('click', () => deleteAppResource(org, 'Course', 'courseId', btn.dataset.deleteCourse, btn)));
        bindCopyLinkButtons(list);
      }, (error) => renderAppLoadError('coursesList', 'cours', error)));
    }

    async function setCourseStatus(org, courseId, status) {
      try {
        await courseApi.setStatus({ organizationId: org.id, courseId, status });
        showToast(status === 'published' ? 'Cours publie.' : 'Cours depublie.');
      } catch (error) { showToast(error.message, 'error'); }
    }

    async function openCourseEditor(org, courseId) {
      let course = { title: '', description: '', price: '', coverImage: null, heroTitle: '', heroSubtitle: '', colors: {}, layout: 'minimal' };
      if (courseId) {
        const snap = await getDoc(doc(db, 'courses', courseId));
        if (snap.exists()) course = { ...course, ...snap.data() };
      }
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open sst-app-editor-overlay';
      overlay.innerHTML = `
        <div class="sst-modal sst-app-editor-modal">
          <div class="sst-app-editor-header"><div><span>Formation en ligne</span><h3>${courseId ? 'Modifier le cours' : 'Nouveau cours'}</h3></div></div>
          <div class="sst-field"><label class="sst-label">Titre *</label><input class="sst-input" id="cTitle" value="${escapeHtml(course.title)}" required></div>
          <div class="sst-field"><label class="sst-label">Description</label><textarea class="sst-textarea" id="cDesc" rows="3">${escapeHtml(course.description || '')}</textarea></div>
          <div class="sst-field"><label class="sst-label">Prix (HTG) — 0 pour gratuit</label><input class="sst-input" type="number" id="cPrice" min="0" value="${course.pricing?.amount ?? course.price ?? ''}" required></div>

          <div class="sst-builder-section-label">Identité visuelle</div>
          <div class="sst-personalize-upload-card sst-app-editor-upload">
            <div class="sst-personalize-upload-preview">${course.coverImage ? `<img src="${escapeHtml(course.coverImage)}" alt="Aperçu">` : '<i class="fas fa-image"></i>'}</div>
            <div class="sst-personalize-upload-copy"><strong>Image du hero</strong><span>Paysage · JPG, PNG ou WEBP</span></div>
            <input class="sst-visually-hidden" type="file" accept="image/*" id="cCoverFile" ${courseId ? '' : 'disabled'}>
            <label class="sst-upload-trigger ${courseId ? '' : 'disabled'}" for="cCoverFile"><i class="fas fa-arrow-up-from-bracket"></i> ${courseId ? (course.coverImage ? 'Remplacer' : 'Choisir') : 'Disponible après le premier enregistrement'}</label>
            <div class="sst-upload-status" id="cCoverStatus">${courseId ? '' : 'Enregistrez le cours puis rouvrez-le pour ajouter sa couverture en toute sécurité.'}</div>
          </div>
          <div class="sst-field">
            <label class="sst-label">Mise en page</label>
            <select class="sst-select" id="cLayout">
              <option value="minimal" ${course.layout !== 'cover' && course.layout !== 'hero' ? 'selected' : ''}>Hero sans image</option>
              <option value="hero" ${course.layout === 'hero' ? 'selected' : ''}>Image à droite</option>
              <option value="cover" ${course.layout === 'cover' ? 'selected' : ''}>Texte sur l’image</option>
            </select>
          </div>
          <div class="sst-field"><label class="sst-label">Titre hero</label><input class="sst-input" id="cHeroTitle" value="${escapeHtml(course.heroTitle || '')}"></div>
          <div class="sst-field"><label class="sst-label">Sous-titre hero</label><input class="sst-input" id="cHeroSubtitle" value="${escapeHtml(course.heroSubtitle || '')}"></div>
          <div class="sst-builder-color-row"><label>Couleur principale</label><input type="color" id="cColorPrimary" value="${course.colors?.primary || '#131921'}"></div>
          <div class="sst-builder-color-row"><label>Couleur d'accent</label><input type="color" id="cColorAccent" value="${course.colors?.buttonColor || course.colors?.accent || '#FFA41C'}"></div>

          <div style="display:flex;gap:.6rem;margin-top:1rem;">
            <button class="sst-btn sst-btn-primary" id="cSave">Enregistrer</button>
            <button class="sst-btn sst-btn-secondary" id="cCancel">Annuler</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector('#cCancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#cCoverFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        overlay.querySelector('#cCoverStatus').textContent = 'Televersement...';
        try { course.coverImage = (await uploadImageFile(file, `sst-courses/${courseId || 'new'}/branding`, { maxSizeMb: 8 })).url; if (overlay.querySelector('#cLayout').value === 'minimal') overlay.querySelector('#cLayout').value = 'hero'; overlay.querySelector('#cCoverStatus').textContent = 'Image prête.'; }
        catch (error) { overlay.querySelector('#cCoverStatus').textContent = error.message; }
      });
      overlay.querySelector('#cSave').addEventListener('click', async () => {
        const title = overlay.querySelector('#cTitle').value.trim();
        const price = Number(overlay.querySelector('#cPrice').value);
        if (!title || !Number.isFinite(price) || price < 0) { showToast('Titre et prix valides requis.', 'error'); return; }
        try {
          await courseApi.save(buildCourseSaveBody({
              organizationId: org.id, courseId: courseId || undefined, title,
              description: overlay.querySelector('#cDesc').value.trim(), price, coverImage: course.coverImage,
              heroTitle: overlay.querySelector('#cHeroTitle').value.trim(),
              heroSubtitle: overlay.querySelector('#cHeroSubtitle').value.trim(),
              layout: overlay.querySelector('#cLayout').value,
              colors: { primary: overlay.querySelector('#cColorPrimary').value, buttonColor: overlay.querySelector('#cColorAccent').value, accent: overlay.querySelector('#cColorAccent').value }
          }));
          showToast('Cours enregistre.');
          overlay.remove();
        } catch (error) { showToast(error.message, 'error'); }
      });
    }

    async function openCourseContentEditor(org, courseId) {
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open';
      overlay.innerHTML = `
        <div class="sst-modal" style="max-width:680px;">
          <h3 style="margin-bottom:1rem;">Contenu du cours</h3>
          <button class="sst-btn sst-btn-secondary" id="addModuleBtn" style="margin-bottom:1rem;"><i class="fas fa-plus"></i> Ajouter un module</button>
          <div id="moduleTree"><div class="sst-loading">Chargement...</div></div>
          <button class="sst-btn sst-btn-secondary" id="contentClose" style="margin-top:1rem;">Fermer</button>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector('#contentClose').addEventListener('click', () => overlay.remove());

      async function refreshTree() {
        const [modulesSnap, lessonsSnap] = await Promise.all([
          getDocs(query(collection(db, 'courseModules'), where('organizationId', '==', org.id), where('courseId', '==', courseId))),
          getDocs(query(collection(db, 'lessons'), where('organizationId', '==', org.id), where('courseId', '==', courseId)))
        ]);
        const modules = modulesSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.order - b.order);
        const lessons = lessonsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
        const tree = overlay.querySelector('#moduleTree');
        if (!modules.length) { tree.innerHTML = '<div class="sst-empty">Aucun module. Ajoutez-en un pour commencer.</div>'; return; }
        tree.innerHTML = modules.map((mod, mi) => {
          const modLessons = lessons.filter((l) => l.moduleId === mod.id).sort((a, b) => a.order - b.order);
          return `
          <div class="sst-card" style="padding:.85rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;">
              <strong>${escapeHtml(mod.title)}</strong>
              <div class="actions" style="display:flex;gap:.3rem;">
                <button class="sst-builder-icon-btn" data-move-module-up="${mod.id}" ${mi === 0 ? 'disabled' : ''} title="Monter"><i class="fas fa-arrow-up"></i></button>
                <button class="sst-builder-icon-btn" data-move-module-down="${mod.id}" ${mi === modules.length - 1 ? 'disabled' : ''} title="Descendre"><i class="fas fa-arrow-down"></i></button>
                <button class="sst-builder-icon-btn" data-rename-module="${mod.id}" title="Renommer"><i class="fas fa-pen"></i></button>
                <button class="sst-builder-icon-btn danger" data-delete-module="${mod.id}" title="Supprimer"><i class="fas fa-trash"></i></button>
              </div>
            </div>
            <div style="margin-top:.6rem;">
              ${modLessons.map((l, li) => `
                <div class="sst-builder-field-row" style="margin-bottom:.4rem;">
                  <div class="info"><div class="name">${escapeHtml(l.title)}</div><div class="type">${escapeHtml(l.type)}${l.isFreePreview ? ' - apercu gratuit' : ''}</div></div>
                  <div class="actions">
                    <button class="sst-builder-icon-btn" data-move-lesson-up="${l.id}" data-module="${mod.id}" ${li === 0 ? 'disabled' : ''} title="Monter"><i class="fas fa-arrow-up"></i></button>
                    <button class="sst-builder-icon-btn" data-move-lesson-down="${l.id}" data-module="${mod.id}" ${li === modLessons.length - 1 ? 'disabled' : ''} title="Descendre"><i class="fas fa-arrow-down"></i></button>
                    <button class="sst-builder-icon-btn" data-edit-lesson="${l.id}" data-module="${mod.id}" title="Modifier"><i class="fas fa-pen"></i></button>
                    <button class="sst-builder-icon-btn danger" data-delete-lesson="${l.id}" title="Supprimer"><i class="fas fa-trash"></i></button>
                  </div>
                </div>
              `).join('') || '<div class="sst-empty">Aucune lecon.</div>'}
              <button class="sst-btn sst-btn-secondary" data-add-lesson="${mod.id}" style="width:100%;"><i class="fas fa-plus"></i> Lecon</button>
            </div>
          </div>
        `;
        }).join('');

        tree.querySelectorAll('[data-add-lesson]').forEach((btn) => btn.addEventListener('click', () => openLessonForm(btn.dataset.addLesson)));
        tree.querySelectorAll('[data-edit-lesson]').forEach((btn) => btn.addEventListener('click', () => openLessonForm(btn.dataset.module, btn.dataset.editLesson)));
        tree.querySelectorAll('[data-delete-lesson]').forEach((btn) => btn.addEventListener('click', async () => {
          if (!confirm('Supprimer cette lecon ?')) return;
          try { await callSst('DeleteLesson', { method: 'POST', auth: currentUser, body: { organizationId: org.id, lessonId: btn.dataset.deleteLesson } }); refreshTree(); }
          catch (error) { showToast(error.message, 'error'); }
        }));
        tree.querySelectorAll('[data-rename-module]').forEach((btn) => btn.addEventListener('click', async () => {
          const mod = modules.find((m) => m.id === btn.dataset.renameModule);
          const title = prompt('Titre du module :', mod.title);
          if (!title || !title.trim()) return;
          try { await callSst('SaveCourseModule', { method: 'POST', auth: currentUser, body: { organizationId: org.id, courseId, moduleId: mod.id, title: title.trim(), order: mod.order } }); refreshTree(); }
          catch (error) { showToast(error.message, 'error'); }
        }));
        tree.querySelectorAll('[data-delete-module]').forEach((btn) => btn.addEventListener('click', async () => {
          if (!confirm('Supprimer ce module et toutes ses lecons ?')) return;
          try { await callSst('DeleteCourseModule', { method: 'POST', auth: currentUser, body: { organizationId: org.id, moduleId: btn.dataset.deleteModule } }); refreshTree(); }
          catch (error) { showToast(error.message, 'error'); }
        }));
        tree.querySelectorAll('[data-move-module-up]').forEach((btn) => btn.addEventListener('click', () => reorderModule(modules, btn.dataset.moveModuleUp, -1)));
        tree.querySelectorAll('[data-move-module-down]').forEach((btn) => btn.addEventListener('click', () => reorderModule(modules, btn.dataset.moveModuleDown, 1)));
        tree.querySelectorAll('[data-move-lesson-up]').forEach((btn) => btn.addEventListener('click', () => reorderLesson(modLessonsFor(lessons, btn.dataset.module), btn.dataset.moveLessonUp, -1)));
        tree.querySelectorAll('[data-move-lesson-down]').forEach((btn) => btn.addEventListener('click', () => reorderLesson(modLessonsFor(lessons, btn.dataset.module), btn.dataset.moveLessonDown, 1)));
      }

      function modLessonsFor(lessons, moduleId) {
        return lessons.filter((l) => l.moduleId === moduleId).sort((a, b) => a.order - b.order);
      }

      async function reorderModule(modules, moduleId, direction) {
        const i = modules.findIndex((m) => m.id === moduleId);
        const j = i + direction;
        if (i < 0 || j < 0 || j >= modules.length) return;
        const a = modules[i], b = modules[j];
        try {
          await Promise.all([
            callSst('SaveCourseModule', { method: 'POST', auth: currentUser, body: { organizationId: org.id, courseId, moduleId: a.id, title: a.title, order: b.order } }),
            callSst('SaveCourseModule', { method: 'POST', auth: currentUser, body: { organizationId: org.id, courseId, moduleId: b.id, title: b.title, order: a.order } })
          ]);
          refreshTree();
        } catch (error) { showToast(error.message, 'error'); }
      }

      async function reorderLesson(lessons, lessonId, direction) {
        const i = lessons.findIndex((l) => l.id === lessonId);
        const j = i + direction;
        if (i < 0 || j < 0 || j >= lessons.length) return;
        const a = lessons[i], b = lessons[j];
        try {
          await Promise.all([
            callSst('SaveLesson', { method: 'POST', auth: currentUser, body: { organizationId: org.id, moduleId: a.moduleId, lessonId: a.id, title: a.title, type: a.type, content: a.content, isFreePreview: a.isFreePreview, order: b.order } }),
            callSst('SaveLesson', { method: 'POST', auth: currentUser, body: { organizationId: org.id, moduleId: b.moduleId, lessonId: b.id, title: b.title, type: b.type, content: b.content, isFreePreview: b.isFreePreview, order: a.order } })
          ]);
          refreshTree();
        } catch (error) { showToast(error.message, 'error'); }
      }

      overlay.querySelector('#addModuleBtn').addEventListener('click', async () => {
        const title = prompt('Titre du module :');
        if (!title || !title.trim()) return;
        try {
          await callSst('SaveCourseModule', { method: 'POST', auth: currentUser, body: { organizationId: org.id, courseId, title: title.trim(), order: Date.now() } });
          refreshTree();
        } catch (error) { showToast(error.message, 'error'); }
      });

      async function openLessonForm(moduleId, lessonId) {
        let lesson = { title: '', type: 'video', content: '', contentRef: '', isFreePreview: false };
        if (lessonId) {
          const snap = await getDoc(doc(db, 'lessons', lessonId));
          if (snap.exists()) lesson = { ...lesson, ...snap.data() };
        }
        const inner = document.createElement('div');
        inner.className = 'sst-modal-overlay open';
        inner.innerHTML = `
          <div class="sst-modal">
            <h3 style="margin-bottom:1rem;">${lessonId ? 'Modifier la lecon' : 'Nouvelle lecon'}</h3>
            <div class="sst-field"><label class="sst-label">Titre *</label><input class="sst-input" id="lTitle" value="${escapeHtml(lesson.title)}"></div>
            <div class="sst-field"><label class="sst-label">Type</label>
              <select class="sst-select" id="lType">
                <option value="video" ${lesson.type === 'video' ? 'selected' : ''}>Video</option>
                <option value="text" ${lesson.type === 'text' ? 'selected' : ''}>Texte</option>
                <option value="pdf" ${lesson.type === 'pdf' ? 'selected' : ''}>PDF</option>
                <option value="file" ${lesson.type === 'file' ? 'selected' : ''}>Fichier</option>
              </select>
            </div>
            <div class="sst-field" id="lContentTextField" style="${lesson.type === 'text' ? '' : 'display:none;'}"><label class="sst-label">Texte *</label><textarea class="sst-textarea" id="lContentText" rows="3">${lesson.type === 'text' ? escapeHtml(lesson.content || '') : ''}</textarea></div>
            <div class="sst-field" id="lContentFileField" style="${lesson.type === 'text' ? 'display:none;' : ''}">
              <label class="sst-label">Fichier (video/PDF/document) *</label>
              <input type="file" id="lContentFile">
              <div class="sst-hint" id="lContentFileStatus">${lesson.type !== 'text' && lesson.content ? 'Fichier actuel defini.' : ''}</div>
            </div>
            <div class="sst-field"><label style="display:flex;align-items:center;gap:.5rem;"><input type="checkbox" id="lFree" ${lesson.isFreePreview ? 'checked' : ''}> Apercu gratuit (visible sans inscription)</label></div>
            <div style="display:flex;gap:.6rem;">
              <button class="sst-btn sst-btn-primary" id="lSave">Enregistrer</button>
              <button class="sst-btn sst-btn-secondary" id="lCancel">Annuler</button>
            </div>
          </div>
        `;
        document.body.appendChild(inner);
        let uploadedContentRef = lesson.type !== 'text' ? lesson.contentRef : null;

        inner.querySelector('#lType').addEventListener('change', (e) => {
          const isText = e.target.value === 'text';
          inner.querySelector('#lContentTextField').style.display = isText ? 'block' : 'none';
          inner.querySelector('#lContentFileField').style.display = isText ? 'none' : 'block';
        });
        inner.querySelector('#lContentFile').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          inner.querySelector('#lContentFileStatus').textContent = 'Televersement...';
          try {
            uploadedContentRef = (await uploadStorageFile(file, `sst-courses/${courseId}/lessons`, { maxSizeMb: 50, exposeDownloadUrl: false })).path;
            inner.querySelector('#lContentFileStatus').textContent = 'Fichier televerse.';
          } catch (error) { inner.querySelector('#lContentFileStatus').textContent = error.message; }
        });

        inner.querySelector('#lCancel').addEventListener('click', () => inner.remove());
        inner.querySelector('#lSave').addEventListener('click', async () => {
          const title = inner.querySelector('#lTitle').value.trim();
          const type = inner.querySelector('#lType').value;
          const content = type === 'text' ? inner.querySelector('#lContentText').value.trim() : '';
          if (!title || (type === 'text' ? !content : !uploadedContentRef)) { showToast('Titre et contenu requis.', 'error'); return; }
          try {
            await callSst('SaveLesson', {
              method: 'POST', auth: currentUser,
              body: { organizationId: org.id, moduleId, lessonId: lessonId || undefined, title, type, content, contentRef: uploadedContentRef, isFreePreview: inner.querySelector('#lFree').checked, order: lesson.order ?? Date.now() }
            });
            inner.remove();
            refreshTree();
          } catch (error) { showToast(error.message, 'error'); }
        });
      }

      refreshTree();
    }

    function viewEnrollments(org, courseId) {
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open';
      overlay.innerHTML = `<div class="sst-modal" style="max-width:640px;"><h3 style="margin-bottom:1rem;">Inscrits</h3><div id="enrollList" class="sst-loading">Chargement...</div><button class="sst-btn sst-btn-secondary" id="enrollClose" style="margin-top:1rem;">Fermer</button></div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#enrollClose').addEventListener('click', () => overlay.remove());
      callSst('ListEnrollments', { auth: currentUser, query: { organizationId: org.id, courseId } })
        .then((result) => {
          const list = overlay.querySelector('#enrollList');
          if (!result.enrollments.length) { list.innerHTML = '<div class="sst-empty">Aucun inscrit pour le moment.</div>'; return; }
          list.innerHTML = `<table class="sst-table"><thead><tr><th>Nom</th><th>Email</th><th>Statut</th></tr></thead><tbody>
            ${result.enrollments.map((e) => `<tr><td>${escapeHtml(e.studentName || '-')}</td><td>${escapeHtml(e.studentEmail)}</td><td><span class="sst-badge ${e.status === 'confirmed' ? 'confirmed' : 'pending'}">${escapeHtml(e.status)}</span></td></tr>`).join('')}
          </tbody></table>`;
        })
        .catch((error) => { overlay.querySelector('#enrollList').innerHTML = `<div class="sst-error">${escapeHtml(error.message)}</div>`; });
    }

    // ---------- Services ----------
    function renderServicesTab(content, org) {
      content.innerHTML = `
        <div class="sst-card-header" style="margin-bottom:1rem;"><h2 style="font-size:1.1rem;">Mes services</h2>
          <button class="sst-btn sst-btn-primary" id="newServiceBtn"><i class="fas fa-plus"></i> Nouveau service</button>
        </div>
        <div id="servicesList"><div class="sst-loading">Chargement...</div></div>
        <div class="sst-card"><div class="sst-card-header"><h3>Reservations recues</h3></div><div id="bookingsList"><div class="sst-loading">Chargement...</div></div></div>
      `;
      document.getElementById('newServiceBtn').addEventListener('click', () => openServiceEditor(org));

      const servicesQuery = query(collection(db, 'services'), where('organizationId', '==', org.id));
      unsubscribers.push(onSnapshot(servicesQuery, (snap) => {
        const list = document.getElementById('servicesList');
        if (!list) return;
        const services = snap.docs.filter((d) => d.data().status !== 'archived');
        if (!services.length) { list.innerHTML = '<div class="sst-empty">Aucun service. Créez-en un pour commencer.</div>'; return; }
        list.innerHTML = services.map((d) => {
          const s = d.data();
          return `<div class="sst-app-resource-card">
            <div class="sst-app-resource-icon service"><i class="fas fa-calendar-check"></i></div>
            <div class="sst-app-resource-info"><strong>${escapeHtml(s.title)}</strong><span>${formatCurrency(s.price)} · ${s.durationMinutes} min <span class="sst-badge ${s.status}">${escapeHtml(s.status)}</span></span></div>
            <div class="sst-app-resource-actions">
              <button class="sst-btn sst-btn-secondary" data-edit-service="${d.id}"><i class="fas fa-pen"></i> Modifier</button>
              <button class="sst-btn sst-btn-secondary" data-add-availability="${d.id}"><i class="fas fa-calendar-plus"></i> Disponibilite</button>
              ${s.status === 'published'
                ? `<button class="sst-btn sst-btn-secondary" data-svc-unpublish="${d.id}">Depublier</button> ${publicLinkHtml('services', 'serviceId', d.id, org)}`
                : `<button class="sst-btn sst-btn-primary" data-svc-publish="${d.id}">Publier</button>`}
              <button class="sst-builder-icon-btn danger" data-delete-service="${d.id}" title="Supprimer" aria-label="Supprimer ${escapeHtml(s.title)}"><i class="fas fa-trash"></i></button>
            </div>
          </div>`;
        }).join('');
        list.querySelectorAll('[data-svc-publish]').forEach((btn) => btn.addEventListener('click', () => setServiceStatus(org, btn.dataset.svcPublish, 'published')));
        list.querySelectorAll('[data-svc-unpublish]').forEach((btn) => btn.addEventListener('click', () => setServiceStatus(org, btn.dataset.svcUnpublish, 'suspended')));
        list.querySelectorAll('[data-edit-service]').forEach((btn) => btn.addEventListener('click', () => openServiceEditor(org, btn.dataset.editService)));
        list.querySelectorAll('[data-add-availability]').forEach((btn) => btn.addEventListener('click', () => openAvailabilityEditor(org, btn.dataset.addAvailability)));
        list.querySelectorAll('[data-delete-service]').forEach((btn) => btn.addEventListener('click', () => deleteAppResource(org, 'Service', 'serviceId', btn.dataset.deleteService, btn)));
        bindCopyLinkButtons(list);
      }, (error) => renderAppLoadError('servicesList', 'services', error)));

      const bookingsQuery = query(collection(db, 'bookings'), where('organizationId', '==', org.id));
      unsubscribers.push(onSnapshot(bookingsQuery, (snap) => {
        const list = document.getElementById('bookingsList');
        if (!list) return;
        if (snap.empty) { list.innerHTML = '<div class="sst-empty">Aucune reservation pour le moment.</div>'; return; }
        const bookings = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.slotStart) - new Date(b.slotStart));
        const byDay = new Map();
        bookings.forEach((b) => {
          const dayKey = b.slotStart ? new Date(b.slotStart).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Sans date';
          if (!byDay.has(dayKey)) byDay.set(dayKey, []);
          byDay.get(dayKey).push(b);
        });
        list.innerHTML = Array.from(byDay.entries()).map(([day, items]) => `
          <div class="sst-builder-section-label">${escapeHtml(day)}</div>
          ${items.map((b) => `
            <div class="sst-builder-field-row">
              <div class="info">
                <div class="name">${b.slotStart ? new Date(b.slotStart).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '-'} - ${escapeHtml(b.customerName || b.customerEmail)}</div>
                <div class="type">${escapeHtml(b.customerEmail)} - <span class="sst-badge ${b.status === 'confirmed' ? 'confirmed' : b.status === 'cancelled' ? 'cancelled' : 'pending'}">${escapeHtml(b.status)}</span></div>
              </div>
              ${b.status === 'confirmed' ? `<div class="actions"><button class="sst-builder-icon-btn danger" data-cancel-booking="${b.id}" title="Annuler"><i class="fas fa-xmark"></i></button></div>` : ''}
            </div>
          `).join('')}
        `).join('');
        list.querySelectorAll('[data-cancel-booking]').forEach((btn) => btn.addEventListener('click', async () => {
          try { await callSst('CancelBooking', { method: 'POST', auth: currentUser, body: { organizationId: org.id, bookingId: btn.dataset.cancelBooking } }); showToast('Reservation annulee.'); }
          catch (error) { showToast(error.message, 'error'); }
        }));
      }, () => {}));
    }

    async function openServiceEditor(org, serviceId) {

        title: '', description: '', durationMinutes: 60, priceType: 'fixed', price: '', depositAmount: '',
        photoUrl: null, heroTitle: '', heroSubtitle: '', colors: {}, layout: 'minimal'
      };
      if (serviceId) {
        const snap = await getDoc(doc(db, 'services', serviceId));
        if (snap.exists()) service = { ...service, ...snap.data() };
      }
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open sst-app-editor-overlay';
      overlay.innerHTML = `
        <div class="sst-modal sst-app-editor-modal">
          <div class="sst-app-editor-header"><div><span>Réservation</span><h3>${serviceId ? 'Modifier le service' : 'Nouveau service'}</h3></div></div>
          <div class="sst-field"><label class="sst-label">Titre *</label><input class="sst-input" id="svTitle" value="${escapeHtml(service.title)}"></div>
          <div class="sst-field"><label class="sst-label">Description</label><textarea class="sst-textarea" id="svDesc" rows="2">${escapeHtml(service.description || '')}</textarea></div>
          <div class="sst-field"><label class="sst-label">Duree (minutes) *</label><input class="sst-input" type="number" id="svDuration" min="5" value="${service.durationMinutes || 60}"></div>
          <div class="sst-field"><label class="sst-label">Tarification</label>
            <select class="sst-select" id="svPriceType">
              <option value="fixed" ${service.priceType !== 'deposit' ? 'selected' : ''}>Prix fixe</option>
              <option value="deposit" ${service.priceType === 'deposit' ? 'selected' : ''}>Acompte</option>
            </select>
          </div>
          <div class="sst-field"><label class="sst-label">Prix total (HTG) *</label><input class="sst-input" type="number" id="svPrice" min="1" value="${service.price || ''}"></div>
          <div class="sst-field" id="svDepositField" style="${service.priceType === 'deposit' ? '' : 'display:none;'}"><label class="sst-label">Acompte (HTG)</label><input class="sst-input" type="number" id="svDeposit" min="1" value="${service.depositAmount || ''}"></div>

          <div class="sst-builder-section-label">Identité visuelle</div>
          <div class="sst-personalize-upload-card sst-app-editor-upload">
            <div class="sst-personalize-upload-preview">${service.photoUrl ? `<img src="${escapeHtml(service.photoUrl)}" alt="Aperçu">` : '<i class="fas fa-image"></i>'}</div>
            <div class="sst-personalize-upload-copy"><strong>Image du hero</strong><span>JPG, PNG ou WEBP · 8 Mo max.</span></div>
            <input class="sst-visually-hidden" type="file" accept="image/*" id="svPhotoFile">
            <label class="sst-upload-trigger" for="svPhotoFile"><i class="fas fa-arrow-up-from-bracket"></i> ${service.photoUrl ? 'Remplacer' : 'Choisir'}</label>
            <div class="sst-upload-status" id="svPhotoStatus"></div>
          </div>
          <div class="sst-field"><label class="sst-label">Mise en page</label><select class="sst-select" id="svLayout"><option value="minimal" ${service.layout !== 'hero' ? 'selected' : ''}>Hero sans image</option><option value="hero" ${service.layout === 'hero' ? 'selected' : ''}>Image à droite</option></select></div>
          <div class="sst-field"><label class="sst-label">Titre hero</label><input class="sst-input" id="svHeroTitle" value="${escapeHtml(service.heroTitle || '')}"></div>
          <div class="sst-field"><label class="sst-label">Sous-titre hero</label><input class="sst-input" id="svHeroSubtitle" value="${escapeHtml(service.heroSubtitle || '')}"></div>
          <div class="sst-builder-color-row"><label>Couleur principale</label><input type="color" id="svColorPrimary" value="${service.colors?.primary || '#0F172A'}"></div>
          <div class="sst-builder-color-row"><label>Couleur d'accent</label><input type="color" id="svColorAccent" value="${service.colors?.buttonColor || service.colors?.accent || '#0D9488'}"></div>

          <div style="display:flex;gap:.6rem;margin-top:1rem;">
            <button class="sst-btn sst-btn-primary" id="svSave">Enregistrer</button>
            <button class="sst-btn sst-btn-secondary" id="svCancel">Annuler</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector('#svPriceType').addEventListener('change', (e) => { overlay.querySelector('#svDepositField').style.display = e.target.value === 'deposit' ? 'block' : 'none'; });
      overlay.querySelector('#svCancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#svPhotoFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        overlay.querySelector('#svPhotoStatus').textContent = 'Televersement...';
        try { service.photoUrl = (await uploadImageFile(file, `sst-services/${serviceId || 'new'}`, { maxSizeMb: 8 })).url; overlay.querySelector('#svLayout').value = 'hero'; overlay.querySelector('#svPhotoStatus').textContent = 'Image prête.'; }
        catch (error) { overlay.querySelector('#svPhotoStatus').textContent = error.message; }
      });
      overlay.querySelector('#svSave').addEventListener('click', async () => {
        const title = overlay.querySelector('#svTitle').value.trim();
        const price = Number(overlay.querySelector('#svPrice').value);
        const durationMinutes = Number(overlay.querySelector('#svDuration').value);
        if (!title || !Number.isFinite(price) || price <= 0) { showToast('Titre et prix valides requis.', 'error'); return; }
        try {
          await callSst('SaveService', {
            method: 'POST', auth: currentUser,
            body: {
              organizationId: org.id, serviceId: serviceId || undefined, title,
              description: overlay.querySelector('#svDesc').value.trim(),
              durationMinutes, priceType: overlay.querySelector('#svPriceType').value, price,
              depositAmount: Number(overlay.querySelector('#svDeposit').value) || undefined,
              photoUrl: service.photoUrl,
              heroTitle: overlay.querySelector('#svHeroTitle').value.trim(),
              heroSubtitle: overlay.querySelector('#svHeroSubtitle').value.trim(),
              layout: overlay.querySelector('#svLayout').value,
              colors: { primary: overlay.querySelector('#svColorPrimary').value, buttonColor: overlay.querySelector('#svColorAccent').value, accent: overlay.querySelector('#svColorAccent').value }
            }
          });
          showToast('Service enregistre.');
          overlay.remove();
        } catch (error) { showToast(error.message, 'error'); }
      });
    }

    async function openAvailabilityEditor(org, serviceId) {
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open';
      overlay.innerHTML = `
        <div class="sst-modal">
          <h3 style="margin-bottom:1rem;">Disponibilites</h3>
          <div id="avList" class="sst-loading">Chargement...</div>
          <div class="sst-builder-section-label">Ajouter une regle</div>
          <div class="sst-field"><label class="sst-label">Jour</label>
            <select class="sst-select" id="avDay">
              <option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option>
              <option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option><option value="0">Dimanche</option>
            </select>
          </div>
          <div class="sst-grid cols-2">
            <div class="sst-field"><label class="sst-label">Heure debut</label><input class="sst-input" type="time" id="avStart" value="09:00"></div>
            <div class="sst-field"><label class="sst-label">Heure fin</label><input class="sst-input" type="time" id="avEnd" value="17:00"></div>
          </div>
          <div style="display:flex;gap:.6rem;margin-top:1rem;">
            <button class="sst-btn sst-btn-primary" id="avSave">Ajouter</button>
            <button class="sst-btn sst-btn-secondary" id="avCancel">Fermer</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const DAY_LABELS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

      const rulesQuery = query(collection(db, 'availabilityRules'), where('organizationId', '==', org.id), where('serviceId', '==', serviceId));
      const unsub = onSnapshot(rulesQuery, (snap) => {
        const list = overlay.querySelector('#avList');
        if (!list) { unsub(); return; }
        if (snap.empty) { list.innerHTML = '<div class="sst-empty">Aucune regle de disponibilite.</div>'; return; }
        list.innerHTML = snap.docs.map((d) => {
          const r = d.data();
          return `<div class="sst-builder-field-row">
            <div class="info"><div class="name">${DAY_LABELS[r.dayOfWeek]}</div><div class="type">${escapeHtml(r.startTime)} - ${escapeHtml(r.endTime)}</div></div>
            <div class="actions"><button class="sst-builder-icon-btn danger" data-delete-rule="${d.id}" title="Supprimer"><i class="fas fa-trash"></i></button></div>
          </div>`;
        }).join('');
        list.querySelectorAll('[data-delete-rule]').forEach((btn) => btn.addEventListener('click', async () => {
          if (!confirm('Supprimer cette regle de disponibilite ?')) return;
          try { await callSst('DeleteAvailabilityRule', { method: 'POST', auth: currentUser, body: { organizationId: org.id, ruleId: btn.dataset.deleteRule } }); }
          catch (error) { showToast(error.message, 'error'); }
        }));
      }, () => {});

      overlay.querySelector('#avCancel').addEventListener('click', () => { unsub(); overlay.remove(); });
      overlay.querySelector('#avSave').addEventListener('click', async () => {
        try {
          await callSst('SaveAvailabilityRule', {
            method: 'POST', auth: currentUser,
            body: { organizationId: org.id, serviceId, dayOfWeek: Number(overlay.querySelector('#avDay').value), startTime: overlay.querySelector('#avStart').value, endTime: overlay.querySelector('#avEnd').value }
          });
          showToast('Disponibilite ajoutee.');
        } catch (error) { showToast(error.message, 'error'); }
      });
    }

        list.querySelectorAll('[data-delete-menu]').forEach((btn) => btn.addEventListener('click', () => deleteAppResource(org, 'Menu', 'menuId', btn.dataset.deleteMenu, btn)));

      }, (error) => renderAppLoadError('menusList', 'menus', error)));

      const ordersQuery = query(collection(db, 'foodOrders'), where('organizationId', '==', org.id));

        list.innerHTML = `<table class="sst-table"><thead><tr><th>Client</th><th>Montant</th><th>Statut</th><th>Actions</th></tr></thead><tbody>
          ${snap.docs.map((d) => {
            const o = d.data();
            const canAdvance = ['confirmed', 'preparing', 'ready'].includes(o.status);
            const nextStatus = { confirmed: 'preparing', preparing: 'ready', ready: 'delivered' }[o.status];
            return `<tr><td>${escapeHtml(o.customerEmail)}</td><td>${formatCurrency(o.amountDue)}</td><td><span class="sst-badge ${o.status === 'delivered' ? 'confirmed' : o.status === 'cancelled' ? 'cancelled' : 'pending'}">${escapeHtml(o.status)}</span></td>
              <td>${canAdvance ? `<button class="sst-btn sst-btn-primary" data-advance-order="${d.id}" data-next="${nextStatus}" style="padding:.3rem .6rem;font-size:.78rem;">${nextStatus}</button>` : '-'}</td></tr>`;

        }));
      }, () => {}));
    }

        }).join('')}</div>

        <div class="sst-builder-section-label">Zones de livraison</div>
        <div id="mZonesList">${(menu.deliveryZones || []).map((z, i) => `
          <div class="sst-builder-chip-row">
            <input class="sst-input" data-zone-name="${i}" value="${escapeHtml(z.name || '')}" placeholder="Nom de la zone">
            <input class="sst-input" type="number" data-zone-fee="${i}" value="${z.fee || 0}" placeholder="Frais" style="max-width:100px;">
            <button class="sst-builder-icon-btn danger" data-remove-zone="${i}"><i class="fas fa-xmark"></i></button>
          </div>
        `).join('')}</div>
        <button class="sst-btn sst-btn-secondary" id="mAddZone" style="width:100%;margin-bottom:1rem;"><i class="fas fa-plus"></i> Ajouter une zone</button>

        <div style="display:flex;gap:.6rem;margin-top:1rem;">
          <button class="sst-btn sst-btn-primary" id="mSave">Enregistrer</button>
          <button class="sst-btn sst-btn-secondary" id="mCancel">Annuler</button>
        </div>
      `;
    }

    function bindMenuEditorEvents(overlay, menu, org, menuId) {
      const rerender = () => {
        overlay.querySelector('.sst-modal').innerHTML = renderMenuEditorForm(menu);
        bindMenuEditorEvents(overlay, menu, org, menuId);
      };

      overlay.querySelector('#mCancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#mLogoFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        overlay.querySelector('#mLogoStatus').textContent = 'Televersement...';
        try { menu.logoUrl = (await uploadImageFile(file, `sst-food/${menuId || 'new'}`, { maxSizeMb: 8 })).url; overlay.querySelector('#mLogoStatus').textContent = 'Logo prêt.'; }
        catch (error) { overlay.querySelector('#mLogoStatus').textContent = error.message; }
      });
      overlay.querySelector('#mCoverFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        overlay.querySelector('#mCoverStatus').textContent = 'Televersement...';
        try { menu.coverImageUrl = (await uploadImageFile(file, `sst-food/${menuId || 'new'}`, { maxSizeMb: 8 })).url; if (overlay.querySelector('#mLayout').value === 'minimal') overlay.querySelector('#mLayout').value = 'hero'; overlay.querySelector('#mCoverStatus').textContent = 'Image prête.'; }
        catch (error) { overlay.querySelector('#mCoverStatus').textContent = error.message; }
      });

      overlay.querySelector('#mAddZone').addEventListener('click', () => {
        if (!menu.deliveryZones) menu.deliveryZones = [];
        menu.deliveryZones.push({ name: '', fee: 0 });
        rerender();
      });
      overlay.querySelectorAll('[data-remove-zone]').forEach((btn) => {
        btn.addEventListener('click', () => { menu.deliveryZones.splice(Number(btn.dataset.removeZone), 1); rerender(); });
      });

      overlay.querySelector('#mSave').addEventListener('click', async () => {
        const name = overlay.querySelector('#mName').value.trim();
        if (!name) { showToast('Nom requis.', 'error'); return; }
        const openingHours = FOOD_DAY_LABELS.map((_, day) => {
          const enabled = overlay.querySelector(`[data-day-enabled="${day}"]`).checked;
          if (!enabled) return null;
          return { dayOfWeek: day, startTime: overlay.querySelector(`[data-day-start="${day}"]`).value, endTime: overlay.querySelector(`[data-day-end="${day}"]`).value };
        }).filter(Boolean);
        const deliveryZones = Array.from(overlay.querySelectorAll('[data-zone-name]')).map((el, i) => ({
          name: el.value.trim(), fee: Number(overlay.querySelector(`[data-zone-fee="${i}"]`)?.value) || 0
        })).filter((z) => z.name);
        try {
          await callSst('SaveMenu', {
            method: 'POST', auth: currentUser,
            body: {
              organizationId: org.id, menuId: menuId || undefined, name,
              description: overlay.querySelector('#mDesc').value.trim(),
              minOrderAmount: Number(overlay.querySelector('#mMinOrder').value) || 0,
              pickupAvailable: overlay.querySelector('#mPickup').checked,
              openingHours, deliveryZones,
              logoUrl: menu.logoUrl, coverImageUrl: menu.coverImageUrl,
              heroTitle: overlay.querySelector('#mHeroTitle').value.trim(),
              heroSubtitle: overlay.querySelector('#mHeroSubtitle').value.trim(),
              layout: overlay.querySelector('#mLayout').value,
              colors: { primary: overlay.querySelector('#mColorPrimary').value, buttonColor: overlay.querySelector('#mColorAccent').value, accent: overlay.querySelector('#mColorAccent').value }
            }
          });
          showToast('Menu enregistre.');
          overlay.remove();
        } catch (error) { showToast(error.message, 'error'); }
      });
    }

    async function openMenuItemManager(org, menuId) {
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open';
      overlay.innerHTML = `
        <div class="sst-modal" style="max-width:640px;">
          <div class="sst-card-header"><h3>Plats</h3><button class="sst-btn sst-btn-primary" id="imAdd"><i class="fas fa-plus"></i> Plat</button></div>
          <div id="imList" class="sst-loading">Chargement...</div>
          <button class="sst-btn sst-btn-secondary" id="imClose" style="margin-top:1rem;">Fermer</button>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector('#imAdd').addEventListener('click', () => openMenuItemEditor(org, menuId));

      const itemsQuery = query(collection(db, 'menuItems'), where('organizationId', '==', org.id), where('menuId', '==', menuId));
      const unsub = onSnapshot(itemsQuery, (snap) => {
        const list = overlay.querySelector('#imList');
        if (!list) { unsub(); return; }
        if (snap.empty) { list.innerHTML = '<div class="sst-empty">Aucun plat. Ajoutez-en un.</div>'; return; }
        list.innerHTML = snap.docs.map((d) => {
          const i = d.data();
          return `<div class="sst-builder-field-row">
            <div class="info"><div class="name">${escapeHtml(i.name)}</div><div class="type">${formatCurrency(i.price)}${i.category ? ` - ${escapeHtml(i.category)}` : ''}</div></div>
            <div class="actions"><button class="sst-builder-icon-btn" data-edit-item="${d.id}" title="Modifier"><i class="fas fa-pen"></i></button></div>
          </div>`;
        }).join('');
        list.querySelectorAll('[data-edit-item]').forEach((btn) => btn.addEventListener('click', () => openMenuItemEditor(org, menuId, btn.dataset.editItem)));
      }, (error) => {
        const list = overlay.querySelector('#imList');
        if (list) list.innerHTML = '<div class="sst-error">Impossible de charger les plats.</div>';
        console.error('Chargement des plats impossible', error);
      });
      overlay.querySelector('#imClose').addEventListener('click', () => { unsub(); overlay.remove(); });
    }

    async function openMenuItemEditor(org, menuId, itemId) {
      let item = { name: '', description: '', category: '', price: '', photoUrl: null, options: [] };
      if (itemId) {
        const snap = await getDoc(doc(db, 'menuItems', itemId));
        if (snap.exists()) item = { ...item, ...snap.data() };
      }
      const overlay = document.createElement('div');
      overlay.className = 'sst-modal-overlay open';
      overlay.innerHTML = `<div class="sst-modal" style="max-width:600px;">${renderMenuItemEditorForm(item)}</div>`;
      document.body.appendChild(overlay);
      bindMenuItemEditorEvents(overlay, item, org, menuId, itemId);
    }

    function renderMenuItemEditorForm(item) {
      return `
        <h3 style="margin-bottom:1rem;">${item.name ? 'Modifier le plat' : 'Nouveau plat'}</h3>
        <div class="sst-field"><label class="sst-label">Nom *</label><input class="sst-input" id="miName" value="${escapeHtml(item.name)}"></div>
        <div class="sst-field"><label class="sst-label">Description</label><textarea class="sst-textarea" id="miDesc" rows="2">${escapeHtml(item.description || '')}</textarea></div>
        <div class="sst-grid cols-2">
          <div class="sst-field"><label class="sst-label">Categorie</label><input class="sst-input" id="miCategory" value="${escapeHtml(item.category || '')}" placeholder="Plats, Boissons..."></div>
          <div class="sst-field"><label class="sst-label">Prix (HTG) *</label><input class="sst-input" type="number" id="miPrice" min="1" value="${item.price || ''}"></div>
        </div>
        <div class="sst-field"><label class="sst-label">Photo</label><input type="file" accept="image/*" id="miPhotoFile"><div class="sst-hint" id="miPhotoStatus">${item.photoUrl ? 'Photo actuelle definie.' : ''}</div></div>

        <div class="sst-builder-section-label">Options (ex: taille, extras)</div>
        <div id="miOptionsList">${(item.options || []).map((opt, oi) => `
          <div class="sst-card" style="padding:.8rem;margin-bottom:.6rem;">
            <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;">
              <input class="sst-input" data-opt-name="${oi}" value="${escapeHtml(opt.name || '')}" placeholder="Nom de l'option (ex: Taille)">
              <label style="display:flex;align-items:center;gap:.3rem;white-space:nowrap;font-size:.82rem;"><input type="checkbox" data-opt-required="${oi}" ${opt.required ? 'checked' : ''}> Obligatoire</label>
              <button class="sst-builder-icon-btn danger" data-remove-option="${oi}"><i class="fas fa-xmark"></i></button>
            </div>
            <div data-choices-list="${oi}">${(opt.choices || []).map((c, ci) => `
              <div class="sst-builder-chip-row">
                <input class="sst-input" data-choice-label="${oi}:${ci}" value="${escapeHtml(c.label || '')}" placeholder="Choix (ex: Grand)">
                <input class="sst-input" type="number" data-choice-delta="${oi}:${ci}" value="${c.priceDelta || 0}" placeholder="+/- prix" style="max-width:100px;">
                <button class="sst-builder-icon-btn danger" data-remove-choice="${oi}:${ci}"><i class="fas fa-xmark"></i></button>
              </div>
            `).join('')}</div>
            <button class="sst-btn sst-btn-secondary" data-add-choice="${oi}" style="width:100%;"><i class="fas fa-plus"></i> Ajouter un choix</button>
          </div>
        `).join('')}</div>
        <button class="sst-btn sst-btn-secondary" id="miAddOption" style="width:100%;margin-bottom:1rem;"><i class="fas fa-plus"></i> Ajouter une option</button>

        <div style="display:flex;gap:.6rem;margin-top:1rem;">
          <button class="sst-btn sst-btn-primary" id="miSave">Enregistrer</button>
          <button class="sst-btn sst-btn-secondary" id="miCancel">Annuler</button>
        </div>
      `;
    }

    function syncMenuItemFormIntoModel(overlay, item) {
      // Sync every in-progress field (not just options) before any structural re-render,
      // same reasoning as the form-builder's field config modal: regenerating from `item`
      // must never silently discard whatever the creator already typed elsewhere.
      if (overlay.querySelector('#miName')) item.name = overlay.querySelector('#miName').value;
      if (overlay.querySelector('#miDesc')) item.description = overlay.querySelector('#miDesc').value;
      if (overlay.querySelector('#miCategory')) item.category = overlay.querySelector('#miCategory').value;
      if (overlay.querySelector('#miPrice')) item.price = overlay.querySelector('#miPrice').value;
      item.options = (item.options || []).map((opt, oi) => ({
        ...opt,
        name: overlay.querySelector(`[data-opt-name="${oi}"]`)?.value ?? opt.name,
        required: overlay.querySelector(`[data-opt-required="${oi}"]`)?.checked ?? opt.required,
        choices: (opt.choices || []).map((c, ci) => ({
          label: overlay.querySelector(`[data-choice-label="${oi}:${ci}"]`)?.value ?? c.label,
          priceDelta: Number(overlay.querySelector(`[data-choice-delta="${oi}:${ci}"]`)?.value ?? c.priceDelta) || 0
        }))
      }));
    }

    function bindMenuItemEditorEvents(overlay, item, org, menuId, itemId) {
      const rerender = () => {
        overlay.querySelector('.sst-modal').innerHTML = renderMenuItemEditorForm(item);
        bindMenuItemEditorEvents(overlay, item, org, menuId, itemId);
      };

      overlay.querySelector('#miCancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#miPhotoFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        overlay.querySelector('#miPhotoStatus').textContent = 'Televersement...';
        try { item.photoUrl = (await uploadImageFile(file, `sst-food/${menuId}/items/${itemId || 'new'}`, { maxSizeMb: 8 })).url; overlay.querySelector('#miPhotoStatus').textContent = 'Photo mise a jour.'; }
        catch (error) { overlay.querySelector('#miPhotoStatus').textContent = error.message; }
      });

      overlay.querySelector('#miAddOption').addEventListener('click', () => {
        syncMenuItemFormIntoModel(overlay, item);
        if (!item.options) item.options = [];
        item.options.push({ name: '', required: false, choices: [] });
        rerender();
      });
      overlay.querySelectorAll('[data-remove-option]').forEach((btn) => {
        btn.addEventListener('click', () => { syncMenuItemFormIntoModel(overlay, item); item.options.splice(Number(btn.dataset.removeOption), 1); rerender(); });
      });
      overlay.querySelectorAll('[data-add-choice]').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncMenuItemFormIntoModel(overlay, item);
          item.options[Number(btn.dataset.addChoice)].choices.push({ label: '', priceDelta: 0 });
          rerender();
        });
      });
      overlay.querySelectorAll('[data-remove-choice]').forEach((btn) => {
        btn.addEventListener('click', () => {
          syncMenuItemFormIntoModel(overlay, item);
          const [oi, ci] = btn.dataset.removeChoice.split(':').map(Number);
          item.options[oi].choices.splice(ci, 1);
          rerender();
        });
      });

      overlay.querySelector('#miSave').addEventListener('click', async () => {
        syncMenuItemFormIntoModel(overlay, item);
        const name = item.name.trim();
        const price = Number(item.price);
        if (!name || !Number.isFinite(price) || price <= 0) { showToast('Nom et prix valides requis.', 'error'); return; }
        const options = item.options.map((opt) => ({ ...opt, name: opt.name.trim(), choices: opt.choices.filter((c) => c.label.trim()) })).filter((opt) => opt.name);
        try {
          await callSst('SaveMenuItem', {
            method: 'POST', auth: currentUser,
            body: {
              organizationId: org.id, menuId, itemId: itemId || undefined, name,
              description: item.description.trim(), category: item.category.trim(), price,
              photoUrl: item.photoUrl, options
            }
          });
          showToast('Plat enregistre.');
          overlay.remove();
        } catch (error) { showToast(error.message, 'error'); }
      });
    }

    // ---------- Payouts ----------
    function renderPayoutsTab(content, org) {
      content.innerHTML = `
        <div class="sst-card">
          <div class="sst-card-header"><h3>Demander un decaissement</h3></div>
          <p class="sst-hint" style="margin-bottom:.8rem;">Necessite une organisation verifiee (KYC approuve) et un solde disponible superieur au minimum.</p>
          <div style="display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap;">
            <div class="sst-field" style="margin-bottom:0;"><label class="sst-label">Montant (HTG)</label><input class="sst-input" type="number" id="payoutAmount" min="500"></div>
            <button class="sst-btn sst-btn-primary" id="requestPayoutBtn">Demander</button>
          </div>
        </div>
        <div class="sst-card"><div class="sst-card-header"><h3>Historique</h3></div><div id="payoutHistory"><div class="sst-loading">Chargement...</div></div></div>
      `;
      document.getElementById('requestPayoutBtn').addEventListener('click', async () => {
        const amountRequested = Number(document.getElementById('payoutAmount').value);
        try {
          await callSst('CreatePayoutRequest', { method: 'POST', auth: currentUser, body: { organizationId: org.id, amountRequested } });
          showToast('Demande de decaissement envoyee.');
        } catch (error) { showToast(error.message, 'error'); }
      });

      const payoutsQuery = query(collection(db, 'payoutRequests'), where('organizationId', '==', org.id));
      unsubscribers.push(onSnapshot(payoutsQuery, (snap) => {
        const list = document.getElementById('payoutHistory');
        if (!list) return;
        if (snap.empty) { list.innerHTML = '<div class="sst-empty">Aucune demande pour le moment.</div>'; return; }
        list.innerHTML = `
          <table class="sst-table">
            <thead><tr><th>Montant</th><th>Statut</th><th>Reference</th></tr></thead>
            <tbody>
              ${snap.docs.map((d) => {
                const p = d.data();
                return `<tr><td>${formatCurrency(p.amountRequested)}</td><td><span class="sst-badge ${p.status}">${escapeHtml(p.status)}</span></td><td>${escapeHtml(p.providerReference || '-')}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        `;
      }, () => {}));
    }

    // ---------- Settings ----------
    function renderSettingsTab(content, org) {
      content.innerHTML = `
        <div class="sst-card">
          <div class="sst-card-header"><h3>Informations organisation</h3></div>
          <div class="sst-grid cols-2">
            <div><div class="sst-label">Nom</div><div>${escapeHtml(org.name)}</div></div>
            <div><div class="sst-label">Statut KYC</div><div><span class="sst-badge ${org.kycStatus === 'approved' ? 'approved' : 'pending'}">${escapeHtml(org.kycStatus || 'not_started')}</span></div></div>
          </div>
          <p class="sst-hint" style="margin-top:1rem;">La verification KYC est validee manuellement par l'equipe SmartCut avant votre premier decaissement (voir SECURITY_MODEL.md).</p>
        </div>
        <div class="sst-card">
          <div class="sst-card-header"><h3>Publier une page publique</h3></div>
          <p class="sst-hint" style="margin-bottom:.8rem;">Un fois un formulaire ou une boutique publie, generez son lien public ici.</p>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;">
            <div class="sst-field" style="margin-bottom:0;"><label class="sst-label">Slug souhaite</label><input class="sst-input" id="pageSlug" placeholder="mon-evenement"></div>
            <div class="sst-field" style="margin-bottom:0;"><label class="sst-label">Type</label>
              <select class="sst-select" id="pageAppId"><option value="forms">Formulaire</option><option value="shops">Boutique</option></select>
            </div>
            <button class="sst-btn sst-btn-secondary" id="checkSlugBtn">Verifier</button>
          </div>
          <div id="slugResult" style="margin-top:.6rem;"></div>
        </div>
      `;
      document.getElementById('checkSlugBtn').addEventListener('click', async () => {
        const slug = document.getElementById('pageSlug').value.trim();
        const result = await callSst('CheckSlugAvailability', { query: { slug } });
        const resultEl = document.getElementById('slugResult');
        resultEl.innerHTML = result.available
          ? `<div class="sst-success" style="margin:0;">Slug disponible ! URL publique : /smartsolutiontek/page.html?org=${org.id}&app=${document.getElementById('pageAppId').value}&slug=${escapeHtml(slug)}</div>`
          : `<div class="sst-error" style="margin:0;">Ce slug n'est pas disponible.</div>`;
      });
    }

    renderLoginGate();
  </script>
</body>
</html>
