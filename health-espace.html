     aside (même gabarit que health-pharmacy-dashboard.html / health-doctor.html), pas une
     page de contenu — aucun des autres dashboards prestataires n'affiche ce pied de page

<script type="module">import './firebase-init.js'; const mount=async(id,loader,options={})=>{const root=document.getElementById(id);if(!root)return;try{const mod=await loader();new mod.default(id,options)}catch(error){console.error(`Erreur ${id}:`,error)}};mount('health-header-root',()=>import('./health-header.js?v=20260831-4'));mount('health-root',()=>import('./health.js?v=20260831-4'),{view:'space'});</script>
