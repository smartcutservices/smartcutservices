<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil | Smart Cut Services</title>
  <meta name="description" content="Gérez votre profil, vos commandes et vos favoris Smart Cut Services.">
  <link rel="stylesheet" href="./site-foundation.css?v=20260831-4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { color-scheme: light; }
    html, body { min-height: 100%; overflow-y: auto !important; }
    body { margin: 0; background: #f6f7f8; color: #131921; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body.modal-open { overflow: auto !important; }
    .profile-page-main { width: 100%; margin: 0 0 32px; }
    .profile-home-btn { display:inline-flex; align-items:center; gap:7px; padding:9px 12px; border:1px solid #e4c58f; border-radius:7px; background:#fffaf2; color:#c77b0b !important; font-size:13px; font-weight:800; text-decoration:none; transition:background .2s ease, border-color .2s ease; }
    .profile-home-btn:hover { background:#fff2dc; border-color:#d99b3d; }
    .profile-panel-page .profile-overlay { display: none !important; }
    .profile-panel-page .profile-container {
      position: relative !important; inset: auto !important; width: 100% !important; max-width: none !important;
      min-height: calc(100vh - 160px); height: auto !important; margin: 0 !important; border: 1px solid #d5d9d9;
      border-radius: 0; overflow: hidden; transform: none !important; opacity: 1 !important;
      box-shadow: 0 18px 48px rgba(15, 25, 35, .08) !important;
    }
    .profile-panel-page .profile-container > div:first-child { position:relative; padding: 24px 42px !important; background: #ffffff !important; border-bottom: 1px solid #e5e8eb; }
    .profile-panel-page .profile-container > div:first-child > div { min-height:52px; align-items:center !important; }
    .profile-panel-page .profile-container > div:first-child > div > div:first-child { padding-left:72px; }
    .profile-panel-page .profile-avatar { position:absolute; left:42px; top:50%; transform:translateY(-50%); width:54px; height:54px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:#e8edf1; color:#263541; font-size:1.35rem; font-weight:800; }
    .profile-panel-page .profile-avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-panel-page .profile-container > div:first-child h2 { color: #131921 !important; font-size: clamp(1.45rem, 2vw, 2rem) !important; letter-spacing: -.035em; }
    .profile-panel-page .profile-container > div:first-child p { color: #687581 !important; }
    .profile-panel-page .profile-container > div:first-child [style*="color:#FFA41C"] { color: #a8772f !important; }
    .profile-panel-page .profile-container > div:first-child .profile-logout-btn { color: #263541 !important; border-color: #d5d9d9 !important; }
    .profile-panel-page .profile-container > div:nth-child(2) { padding: 34px 42px 48px !important; background: #f6f7f8 !important; }
    .profile-panel-page .profile-container > div:nth-child(2).profile-workspace { padding: 0 !important; }
    .profile-panel-page .profile-container > div:nth-child(2) > div { border-radius: 14px !important; }
    .profile-panel-page .profile-container > div:nth-child(2) [style*="border-radius:1rem"] { border-radius: 12px !important; }
    .profile-panel-page .profile-container > div:nth-child(2) .profile-personal-info-btn { background: #fff !important; border-color: #e0e4e7 !important; }
    .profile-panel-page .profile-container > div:nth-child(2) .likes-header,
    .profile-panel-page .profile-container > div:nth-child(2) .orders-header { padding: 2px 0 10px; border-bottom: 1px solid #e3e7e9; }
    .profile-panel-page .profile-workspace { display:flex; min-height:560px; background:#f6f7f8; }
    .profile-panel-page .profile-sidebar { width:clamp(220px,22vw,340px); flex:0 0 clamp(220px,22vw,340px); align-self:stretch; position:sticky; top:0; height:fit-content; min-height:560px; display:flex; flex-direction:column; padding:26px 20px; background:#fff; border-right:1px solid #e1e5e8; }
    .profile-panel-page .profile-sidebar-label { margin:0 10px 10px; color:#89939c; font-size:.68rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .profile-panel-page .profile-sidebar-link { display:flex; align-items:center; gap:10px; width:100%; padding:11px 10px; margin:3px 0; border:0; border-radius:8px; background:transparent; color:#53616d; font:700 .84rem Inter,system-ui,sans-serif; text-align:left; text-decoration:none; cursor:pointer; }
    .profile-panel-page .profile-sidebar-link i { width:17px; color:#8b6c2f; text-align:center; }
    .profile-panel-page .profile-sidebar-link:hover,.profile-panel-page .profile-sidebar-link.is-active { background:#f3f0eb; color:#182431; }
    .profile-panel-page .profile-sidebar-help { margin: auto 0 0; padding:18px 14px; border:1px solid #f0d7ad; border-radius:12px; background:#fffaf2; color:#53616d; }
    .profile-panel-page .profile-sidebar-help i { color:#ed9414; font-size:1.25rem; margin-bottom:10px; }
    .profile-panel-page .profile-sidebar-help strong { display:block; color:#182431; font-size:.85rem; }
    .profile-panel-page .profile-sidebar-help p { margin:8px 0 12px; font-size:.76rem; line-height:1.45; }
    .profile-panel-page .profile-sidebar-help a { display:block; padding:8px 10px; border:1px solid #f0d7ad; border-radius:7px; color:#d98308; background:#fff; font-size:.78rem; font-weight:800; text-align:center; text-decoration:none; }
    .profile-panel-page .profile-content { min-width:0; }
    .profile-panel-page .profile-content > * { max-width:none; }
    .profile-panel-page .profile-greeting { margin: 0 0 22px; }
    .profile-panel-page .profile-greeting h1 { margin:0; color:#17212b; font-size:1.45rem; letter-spacing:-.03em; }
    .profile-panel-page .profile-greeting p { margin:4px 0 0; color:#76828c; font-size:.9rem; }
    .profile-panel-page .profile-summary-card { border-color:#e3e7e9 !important; box-shadow:0 3px 12px rgba(15,25,35,.04); }
    .profile-panel-page .profile-summary-card:hover { border-color:#f0c27a !important; }
    .profile-panel-page .profile-summary-icon { width:2.5rem !important; height:2.5rem !important; background:#fff2f0 !important; color:#ee4438 !important; }
    .profile-panel-page .profile-summary-icon-commandes { background:#f0efff !important; color:#5d54df !important; }
    .profile-panel-page .profile-summary-icon-confirmees { background:#ecfaef !important; color:#13a052 !important; }
    .profile-panel-page .profile-summary-icon-ventes-totales { background:#fff7e7 !important; color:#ef9414 !important; }
    .profile-panel-page .close-profile-btn { display: none !important; }
    .profile-panel-page .profile-logout-btn { border-radius: 6px !important; }
    .profile-suggested { width: 100%; margin: 28px 0 0; padding-top: 24px; border-top: 1px solid #e1e5e8; }
    .profile-suggested-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:12px; }
    .profile-suggested-head h1 { margin:0; font-size:clamp(1.35rem,2vw,1.8rem); letter-spacing:-.02em; }
    .profile-suggested-head p { margin:4px 0 0; color:#5b6875; font-size:.9rem; }
    .profile-suggested-track { display:flex; gap:14px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:thin; scrollbar-color:#b89b7b transparent; }
    .profile-suggested-card { flex:0 0 clamp(170px,18vw,220px); color:#131921; background:#fff; border:1px solid #d5d9d9; border-radius:12px; overflow:hidden; text-decoration:none; transition:transform .2s ease, box-shadow .2s ease; }
    .profile-suggested-card:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(15,25,35,.1); }
    .profile-suggested-card img,.profile-suggested-placeholder { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; background:#f1f3f3; }
    .profile-suggested-placeholder { display:grid; place-items:center; color:#89939c; font-size:1.5rem; }
    .profile-suggested-card-body { display:grid; gap:4px; padding:11px 12px 13px; }
    .profile-suggested-card-body strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.9rem; }
    .profile-suggested-card-body span { color:#8b6c2f; font-size:.82rem; font-weight:750; }
    .profile-suggested-empty { color:#5b6875; font-size:.9rem; padding:18px 0; }
    @media (min-width: 701px) {
      .profile-page-main { width: 100%; margin: 0 auto 56px; }
      .profile-panel-page .profile-container { border-radius: 0; border-left: 0; border-right: 0; }
      .profile-panel-page .profile-content { overflow: visible !important; }
    }
    @media (max-width: 700px) {
      .profile-suggested { width: 100%; margin: 24px 0 0; padding-top: 20px; }
      .profile-suggested-head { display:block; }
      .profile-panel-page .profile-container { border-left: 0; border-right: 0; }
      .profile-panel-page .profile-container > div:first-child,
      .profile-panel-page .profile-container > div:nth-child(2) { padding-left: 20px !important; padding-right: 20px !important; }
      .profile-panel-page .profile-container > div:first-child > div > div:first-child { padding-left:62px; }
      .profile-panel-page .profile-avatar { left:20px; }
      .profile-panel-page .profile-workspace { display:block; }
      .profile-panel-page .profile-sidebar { position:static; width:auto; min-height:0; padding:12px 14px; border-right:0; border-bottom:1px solid #e1e5e8; display:flex; flex-direction:row; gap:5px; overflow-x:auto; }
      .profile-panel-page .profile-sidebar-help { display:none; }
      .profile-panel-page .profile-sidebar-label { display:none; }
      .profile-panel-page .profile-sidebar-link { width:auto; flex:0 0 auto; margin:0; white-space:nowrap; }
      .profile-panel-page .profile-sidebar-link span { display:inline; }
      .profile-panel-page .profile-content { overflow:visible !important; padding-top:22px !important; }
      .profile-panel-page .profile-content [style*="grid-template-columns:repeat(4"] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    }
  </style>
</head>
<body>
  <main class="profile-page-main" aria-label="Mon profil">
    <div id="profile-page-root" class="profile-panel-page"></div>
    <section class="profile-suggested" aria-labelledby="profile-suggested-title">
      <div class="profile-suggested-head"><div><h1 id="profile-suggested-title">Suggestions pour vous</h1><p>Découvrez des produits sélectionnés sur Smart Cut Services.</p></div></div>
      <div id="profile-suggested-track" class="profile-suggested-track"><div class="profile-suggested-empty">Chargement des suggestions…</div></div>
    </section>
  </main>
  <script type="module">
    import { getAuthManager } from './auth.js?v=20260831-4';
    import { getProfilePanel } from './profile-panel.js?v=20260831-4';
    import { loadPublicProducts } from './catalog-products.js?v=20260831-4';
    import { buildProductPageUrl } from './product-links.js?v=20260831-4';

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const productImage = (product) => product.imageUrl || product.image || product.mainImage || product.coverImage || (Array.isArray(product.images) ? product.images[0] : '') || '';
    const money = (value) => `${new Intl.NumberFormat('fr-HT').format(Number(value) || 0)} HTG`;
    const renderSuggestions = (products) => {
      const track = document.getElementById('profile-suggested-track');
      if (!track) return;
      const items = products.slice(0, 10);
      track.innerHTML = items.length ? items.map((product) => {
        const image = productImage(product);
        return `<a class="profile-suggested-card" href="${escapeHtml(buildProductPageUrl(product.id))}"><div>${image ? `<img src="${escapeHtml(image)}" alt="" loading="lazy">` : '<span class="profile-suggested-placeholder"><i class="fas fa-box-open"></i></span>'}</div><div class="profile-suggested-card-body"><strong>${escapeHtml(product.name || product.title || 'Produit')}</strong><span>${money(product.price || product.priceHTG)}</span></div></a>`;
      }).join('') : '<div class="profile-suggested-empty">Aucun produit suggéré pour le moment.</div>';
    };
    loadPublicProducts({ maxPerCollection: 80 }).then(renderSuggestions).catch(() => { const track = document.getElementById('profile-suggested-track'); if (track) track.innerHTML = '<div class="profile-suggested-empty">Les suggestions seront disponibles prochainement.</div>'; });

    const authManager = getAuthManager();
    await authManager.waitForAuthReady?.();
    if (!authManager.isAuthenticated?.()) {
      window.location.replace('./index.html?auth=login');
    } else {
      const panel = getProfilePanel();
      await panel.open();
      document.body.style.setProperty('overflow', 'auto', 'important');
      document.documentElement.style.overflowY = 'auto';
      const host = document.querySelector('.profile-panel-page');
      if (panel.modal && host) host.append(panel.modal);
      const suggestions = document.querySelector('.profile-suggested');
      const profileContent = panel.modal?.querySelector('.profile-content');
      if (suggestions && profileContent) profileContent.append(suggestions);
      panel.modal?.querySelector('.close-profile-btn')?.addEventListener('click', () => window.location.assign('./index.html'));
    }
  </script>
</body>
</html>
