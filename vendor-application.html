<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131921">
  <title>Devenir vendeur | Smart Cut Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./tailwind-site.css?v=20260816-1">
  <link rel="stylesheet" href="./site-foundation.css?v=20260816-3">
  <style>
    * { box-sizing: border-box; min-width: 0; }
    html, body { width: 100%; max-width: 100%; overflow-x: clip; }
    body {
      margin: 0;
      font-family: 'Amazon Ember', Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(198, 167, 94, 0.12), transparent 28%),
        linear-gradient(180deg, #f8f4ec 0%, #f2ebdf 100%);
      color: #1F1E1C;
      overflow-x: clip;
    }
    #vendor-application-root {
      width: 100%;
      padding-top: 1.5rem;
      padding-bottom: 4rem;
    }
    @media (max-width: 1024px) {
      #vendor-application-root {
        /* The public header is fixed and its mobile root intentionally has no
           layout height. Keep the first block fully below the measured header. */
        padding-top: calc(var(--header-height-mobile, 104px) + 1rem);
      }
    }
  </style>
</head>
<body>
  <div id="sierra-header-root"></div>
  <main id="vendor-application-root"></main>
  <div id="sierra-footer-root"></div>

  <script type="module">
    import './firebase-init.js';

    const mount = async (rootId, loader, options = {}) => {
      const root = document.getElementById(rootId);
      if (!root) return;
      try {
        const mod = await loader();
        new mod.default(rootId, options);
      } catch (error) {
        console.error(`Erreur composant ${rootId}:`, error);
      }
    };

    mount('sierra-header-root', () => import('./header.js?v=20260714-1'));
    mount('vendor-application-root', () => import('./vendor-application.js?v=20260827-1'));
    mount('sierra-footer-root', () => import('./footer.js'), {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    });
  </script>
</body>
</html>
