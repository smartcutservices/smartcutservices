<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131921">
  <title>Marketplace Vendeurs | Smart Cut Services</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./site-foundation.css?v=20260901-1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
    html, body { width: 100%; max-width: 100%; overflow-x: clip; }
    body {
      font-family: 'Amazon Ember', Arial, Helvetica, sans-serif;
      color: #1f1e1c;
      background:
        radial-gradient(circle at top left, rgba(198, 167, 94, 0.16), transparent 24%),
        linear-gradient(180deg, #fbf7ef 0%, #f2ebde 100%);
      overflow-x: clip;
    }
    #sierra-header-root {
      height: 0 !important;
    }
    #vendor-marketplace-root {
      width: 100%;
      padding-top: calc(var(--header-height, 156px) + .5rem);
    }
    @media (max-width: 1024px) {
      #vendor-marketplace-root {
        padding-top: calc(var(--header-height-mobile, 70px) + 1.25rem);
      }
    }
  </style>
</head>
<body>
  <div id="sierra-header-root"></div>
  <main id="vendor-marketplace-root"></main>
  <div id="sierra-footer-root"></div>
  <script type="module">
    import './firebase-init.js';
    const mount = async (rootId, loader, options = {}) => {
      const root = document.getElementById(rootId);
      if (!root) return;
      try {
        const mod = await loader();
        new mod.default(rootId, options);
      } catch (error) {
        console.error(`Erreur composant ${rootId}:`, error);
      }
    };
    mount('sierra-header-root', () => import('./header.js?v=20260901-1'));
    mount('vendor-marketplace-root', () => import('./vendor-marketplace.js?v=20260901-3'));
    mount('sierra-footer-root', () => import('./footer.js'), {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    });
  </script>
</body>
</html>
