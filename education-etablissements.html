<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131921">
  <title>Établissements | Smart Cut Education</title>
  <meta name="description" content="Découvrez les établissements partenaires de Smart Cut Education.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./site-foundation.css?v=20260829-16">
  <link rel="stylesheet" href="./education.css?v=20260829-16">
  <style>*{box-sizing:border-box;margin:0;padding:0;min-width:0}html,body{width:100%;max-width:100%;overflow-x:clip}body{font-family:'Amazon Ember',Arial,Helvetica,sans-serif;color:#16181d;background:#fff}</style>
</head>
<body class="education-directory-page">
  <div id="education-header-root"></div>
  <main id="education-directory-root" data-education-view="etablissements"></main>
  <div id="sierra-footer-root"></div>
  <script type="module">
    import './firebase-init.js';
    const mount = async (rootId, loader, options = {}) => {
      const root = document.getElementById(rootId);
      if (!root) return;
      try { const mod = await loader(); new mod.default(rootId, options); }
      catch (error) { console.error(`Erreur composant ${rootId}:`, error); }
    };
    mount('education-header-root', () => import('./education-header.js?v=20260829-16'));
    mount('education-directory-root', () => import('./education-directory.js?v=20260829-16'), { view: 'etablissements' });
    mount('sierra-footer-root', () => import('./footer.js'), { imageBasePath:'./', showSocial:true, showContact:true, showInfos:true, showPayments:true, showCopyright:true });
  </script>
</body>
</html>
