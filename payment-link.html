<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Paiement sécurisé | Smart Cut Services</title>
  <link rel="stylesheet" href="./payment-link.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>.payment-visual{margin:20px 0 25px;height:190px;border:1px solid #dce6f3;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#edf5ff,#fff)}.payment-visual img{display:block;width:100%;height:100%;object-fit:contain;padding:16px}.payment-message{margin:18px 0 24px;padding:16px 18px;border-left:3px solid #1769e8;border-radius:0 14px 14px 0;background:#eff6ff}.payment-message span{display:block;margin-bottom:6px;color:#1769e8;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.payment-message p{margin:0;color:#31445f;font-size:.94rem;line-height:1.65}</style>
</head>
<body>
  <main class="payment-page">
    <section class="payment-card" aria-live="polite">
      <a class="brand" href="./index.html" aria-label="Smart Cut Services"><span>SC</span> Smart Cut Services</a>
      <div id="payment-content" class="payment-loading">
        <span class="spinner" aria-hidden="true"></span>
        <p>Préparation de votre paiement sécurisé…</p>
      </div>
    </section>
    <p class="payment-security">Paiement traité de façon sécurisée par <strong>MonCash</strong>.</p>
  </main>
  <script type="module" src="./payment-link.js"></script>
</body>
</html>
