<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vérifier un certificat · Smart Akademi</title><link rel="stylesheet" href="./education.css"></head><body><main style="max-width:560px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #e3e8ee;border-radius:16px;font-family:system-ui"><p style="color:#0b7567;font-weight:700;letter-spacing:.08em">SMART AKADEMI</p><h1>Vérifier un certificat</h1><p>Entrez le code imprimé sur le certificat.</p><form id="form"><input id="code" required placeholder="SA-XXXXXXXX-XXXX" style="width:100%;padding:14px;border:1px solid #b9c4d0;border-radius:8px;box-sizing:border-box"><button style="margin-top:14px;padding:13px 18px;background:#0b7567;color:#fff;border:0;border-radius:8px;font-weight:700">Vérifier</button></form><p id="result" role="status" style="margin-top:20px"></p></main><script>const form=document.querySelector('#form'),result=document.querySelector('#result');form.onsubmit=async e=>{e.preventDefault();result.textContent='Vérification…';try{const r=await fetch('https://us-central1-smartcutservices-9ce54.cloudfunctions.net/educationVerifyCertificate?code='+encodeURIComponent(document.querySelector('#code').value.trim()));const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Certificat invalide');result.textContent='Certificat valide · '+(d.certificate.studentName||'Apprenant');result.style.color='#087443'}catch(err){result.textContent=err.message;result.style.color='#b42318'}};</script></body></html>
