  <!-- Scripts principaux -->
  <script type="module">
    const ASSET_VERSION = '20260908-12';
    window.SMART_CUT_ASSET_VERSION = ASSET_VERSION;
    // Fetch only the active visual first; this avoids making Firebase a prerequisite for LCP.
    fetch('https://us-central1-smartcutservices-9ce54.cloudfunctions.net/getPublicHeroLcp', { cache: 'no-store' })
      .then((response) => response.ok ? response.json() : null)
      .then((payload) => {
        const hero = payload?.hero;
        const fallback = document.querySelector('#sierra-hero-root .hero-lcp-fallback');
        if (!hero || !fallback) return;
        const source = fallback.querySelector('source'); const image = fallback.querySelector('img');
        if (source && hero.desktop) source.srcset = hero.desktop;
        if (image && hero.mobile) { image.src = hero.mobile; image.alt = hero.alt || 'Affiche Smart Cut Services'; }
      }).catch(() => null);
    try {
      const versionKey = 'smartcut_asset_version';
      const previousVersion = localStorage.getItem(versionKey);
      if (previousVersion && previousVersion !== ASSET_VERSION) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.update().catch(() => null)));
        }
      }
      localStorage.setItem(versionKey, ASSET_VERSION);
    } catch (error) {
      console.warn('Cache update check skipped:', error);
    }
    await import(`./firebase-init.js?v=${ASSET_VERSION}`);

    const loaded = new Set();
    const shouldIdle = window.innerWidth > 900;

    // L’accueil s’adapte aux derniers intérêts de navigation. Les blocs
    // « Pour vous » (dans la découverte) et commentaires restent fixes.
    const HOME_SECTION_ORDER_KEY = 'smartcut_home_section_interests_v1';
    const dynamicHomeSections = [
      'sierra-auto-parts-teaser-root',
      'sierra-education-teaser-root', 'sierra-health-teaser-root',
      'affiliate-ecosystem-card'
    ];
    let homeOrderObserver = null;
    const getHomeSectionHistory = () => {
      try { const value = JSON.parse(localStorage.getItem(HOME_SECTION_ORDER_KEY) || '[]'); return Array.isArray(value) ? value.filter((id) => dynamicHomeSections.includes(id)) : []; } catch (_) { return []; }
    };
    const rememberHomeSection = (id) => {
      if (!dynamicHomeSections.includes(id)) return;
      const history = [id, ...getHomeSectionHistory().filter((entry) => entry !== id)].slice(0, dynamicHomeSections.length);
      try { localStorage.setItem(HOME_SECTION_ORDER_KEY, JSON.stringify(history)); } catch (_) {}
      reorderHomeSections();
    };
    const reorderHomeSections = () => {
      const rail = document.getElementById('ecosystem-sections-rail');
      if (!rail) return;
      const history = getHomeSectionHistory();
      // Un écosystème sollicité récemment reste à l’extrémité droite du rail.
      // L’historique est conservé du plus récent au plus ancien afin que le
      // dernier bloc consulté soit toujours le dernier bloc affiché.
      const ordered = [...dynamicHomeSections.filter((id) => !history.includes(id)), ...history.slice().reverse()];
      const current = dynamicHomeSections.map((id) => document.getElementById(id)).filter(Boolean).map((node) => node.id);
      const visibleOrdered = ordered.filter((id) => document.getElementById(id));
      if (current.join('|') === visibleOrdered.join('|')) {
        rail.style.direction = 'ltr';
        rail.scrollLeft = 0;
        return;
      }
      // Déconnecter l'observateur pendant le déplacement des blocs évite une
      // cascade de mutations lorsque plusieurs sections dynamiques arrivent.
      homeOrderObserver?.disconnect();
      ordered.forEach((id) => {
        const node = document.getElementById(id);
        if (!node) return;
        rail.append(node);
      });
      // Après une réorganisation dynamique, le rail doit toujours démarrer
      // au premier bloc à gauche, même si le navigateur a conservé une
      // ancienne position horizontale.
      rail.style.direction = 'ltr';
      rail.scrollLeft = 0;
      homeOrderObserver?.observe(document.body, { childList: true });
    };
    document.addEventListener('click', (event) => {
      const link = event.target.closest?.('a,button');
      if (!link) return;
      const section = link.closest?.('#ecosystem-sections-rail > [id]');
      if (section) rememberHomeSection(section.id);
      const href = String(link.getAttribute('href') || '').toLowerCase();
      const routeMap = [['auto-parts', 'sierra-auto-parts-teaser-root'], ['education', 'sierra-education-teaser-root'], ['health', 'sierra-health-teaser-root'], ['affiliate', 'affiliate-ecosystem-card'], ['smartsolutiontek', 'sierra-sst-showcase-root'], ['printing', 'sierra-products-root']];
      const matchedRoute = routeMap.find(([route]) => href.includes(route));
      if (matchedRoute) rememberHomeSection(matchedRoute[1]);
    }, true);
    homeOrderObserver = new MutationObserver(reorderHomeSections);
    homeOrderObserver.observe(document.body, { childList: true });
    reorderHomeSections();

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    const ensureTopOnEntry = () => {
      if (window.location.hash) return;
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    };

    ensureTopOnEntry();
    window.addEventListener('pageshow', ensureTopOnEntry);
    window.addEventListener('load', ensureTopOnEntry);

    const runTask = (task) => {
      if (!shouldIdle || typeof window.requestIdleCallback !== 'function') {
        task();
        return;
      }
      window.requestIdleCallback(() => task(), { timeout: 1200 });
    };

    const mount = async (key, rootId, loader, options = {}) => {
      if (loaded.has(key)) return;
      const root = document.getElementById(rootId);
      if (!root) return;
      loaded.add(key);
      try {
        const mod = await loader();
        new mod.default(rootId, options);
      } catch (err) {
        console.error(`❌ Erreur composant ${key}:`, err);
      }
    };

    const mountOnVisible = (key, rootId, loader, options = {}, margin = '300px') => {
      const root = document.getElementById(rootId);
      if (!root || loaded.has(key)) return;

      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          observer.disconnect();
          runTask(() => mount(key, rootId, loader, options));
          break;
        }
      }, { rootMargin: margin, threshold: 0.01 });

      observer.observe(root);
    };

    mount('header', 'sierra-header-root', () => import(`./header.js?v=${ASSET_VERSION}`));
    mount('hero', 'sierra-hero-root', () => import(`./hero.js?v=${ASSET_VERSION}`), { autoplay: false });
    mount('categories', 'sierra-home-categories-root', () => import(`./categories.js?v=${ASSET_VERSION}`), {
      layout: 'carousel',
      sectionTitle: 'Catégories',
      scrollHint: false,
      groupedCards: true,
    });

    /* Charger les rails produits à l’approche du viewport réduit le travail
       du thread principal pendant le premier écran. */
    mountOnVisible('products', 'sierra-products-root', () => import(`./products.js?v=${ASSET_VERSION}`), {
      collectionName: 'products',
      filterActive: true,
      imageBasePath: './',
      animationDuration: 800,
      visibleProductsDesktop: 4,
      visibleProductsMobile: 1.2,
      scrollIndicator: false,
      /* Keep the home catalogue as one continuous rail so a partial last
         grid row can never leave a large empty block beside the final card. */
      layout: 'carousel',
      sectionTitle: 'Pour toi',
      maxRelatedProducts: 6,
      maxDisplayCount: 10,
      randomizeOnLoad: true
    }, window.innerWidth <= 767 ? '0px 0px -35%' : '150px');

    // Tickets are below the initial viewport. Delay their network request so
    // it cannot compete with the mobile hero and category rail.
    setTimeout(() => runTask(() => mount('home-tickets', 'sierra-home-tickets-root', () => import(`./homepage-tickets.js?v=${ASSET_VERSION}`))), 2500);

    mountOnVisible('home-discovery', 'sierra-home-discovery-root', () => import(`./homepage-discovery.js?v=${ASSET_VERSION}`), {
      imageBasePath: './',
      maxProducts: 6
    }, '200px');


    mountOnVisible('auto-parts-teaser', 'sierra-auto-parts-teaser-root', () => import(`./auto-parts-teaser.js?v=${ASSET_VERSION}`), {}, '200px');

    mountOnVisible('education-teaser', 'sierra-education-teaser-root', () => import(`./education-teaser.js?v=${ASSET_VERSION}`), {}, '200px');

    mountOnVisible('health-teaser', 'sierra-health-teaser-root', () => import(`./health-teaser.js?v=${ASSET_VERSION}`), {}, '200px');

    mountOnVisible('sst-showcase', 'sierra-sst-showcase-root', () => import(`./smartsolutiontek-showcase.js?v=${ASSET_VERSION}`), {}, '200px');

    mountOnVisible('footer', 'sierra-footer-root', () => import(`./footer.js?v=${ASSET_VERSION}`), {
      imageBasePath: './',
      showSocial: true,
      showContact: true,
      showInfos: true,
      showPayments: true,
      showCopyright: true
    }, '300px');

    if (!window.__articleOpenListenerBound) {
      window.__articleOpenListenerBound = true;
      document.addEventListener('openArticle', async (e) => {
        try {
          const mod = await import(`./article.js?v=${ASSET_VERSION}`);
          new mod.default({
            articleId: e.detail.articleId,
            imageBasePath: './'
          });
        } catch (err) {
          console.error('❌ Erreur chargement article.js:', err);
        }
      });
    }
  </script>
  <script type="module">
    const notificationsEnabled = window.Notification?.permission === 'granted'
      && localStorage.getItem('veltrixa_order_notif_enabled') === '1';
    if (notificationsEnabled && !window.__veltrixaNotificationsBooted) {
      window.__veltrixaNotificationsBooted = true;
      import('./notification.js?v=20260901-1')
        .then(({ NotificationComponent }) => {
          const center = new NotificationComponent({
            mode: 'client',
            defaultUrl: './index.html',
            listenNewProducts: false,
            listenBroadcasts: false
          });
          center.init();
          window.veltrixaNotificationCenter = center;
        })
        .catch((err) => console.error('❌ Erreur notification component:', err));
    }
  </script>
  <script type="module">
    const startMusicOnInteraction = () => {
      if (window.__vitchMusicBooted) return;
      window.__vitchMusicBooted = true;
      import('./musique.js?v=20260901-1')
        .then(({ default: MusiqueComponent }) => {
          new MusiqueComponent({
            configCollection: 'siteMusicConfig',
            configDocId: 'main',
            audioBasePath: './',
            defaultVolume: 0.35
          });
        })
        .catch((err) => console.error('❌ Erreur musique component:', err));
    };
    // Audio cannot play without a gesture on mobile. Waiting for it also keeps
    // its Firebase read and media download out of the initial render path.
    window.addEventListener('pointerdown', startMusicOnInteraction, { once: true, passive: true });
    window.addEventListener('keydown', startMusicOnInteraction, { once: true });
  </script>
  <!-- Styles additionnels -->
  <style>
    /* Container commentaire */
    #sierra-commentaire-root {
      width: 100%;
      max-width: 1440px;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Line-clamp utility */
    .line-clamp-2 {
      display: -webkit-box;
      
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    /* Animation de pulsation */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
  <script>
    (() => {
      const progressRoot = document.getElementById('site-scroll-progress');
      const progressTrack = progressRoot ? progressRoot.querySelector('.progress-track') : null;
      const themeMeta = document.querySelector('meta[name="theme-color"]');

      const updateThemeColor = () => {
        if (!themeMeta) return;
        const computed = getComputedStyle(document.documentElement).getPropertyValue('--luxury').trim();
        themeMeta.setAttribute('content', computed || '#1F1E1C');
      };

      const updateScrollProgress = () => {
        if (!progressTrack) return;
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
        progressTrack.style.width = `${Math.min(100, Math.max(0, progress))}%`;
      };

      let ticking = false;
      window.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          updateScrollProgress();
          ticking = false;
        });
      }, { passive: true });

      window.addEventListener('resize', updateScrollProgress, { passive: true });
      window.addEventListener('load', () => {
        updateThemeColor();
        updateScrollProgress();
      });

      setTimeout(updateThemeColor, 350);
    })();
  </script>
