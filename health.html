<body>
  <div id="health-header-root"></div>
  <main id="health-root"><div class="health-boot"><i class="fas fa-circle-notch fa-spin"></i> Ouverture de Smart Cut Health…</div></main>
  <div id="sierra-footer-root"></div>
  <script type="module">
    import './firebase-init.js';
    const mount = async (id, loader, options = {}) => {
      const root = document.getElementById(id);
      if (!root) return;
      try { const mod = await loader(); new mod.default(id, options); }
      catch (error) { console.error(`Erreur ${id}:`, error); }
    };
    mount('health-header-root', () => import('./health-header.js?v=20260829-16'));
    mount('health-root', () => import('./health.js?v=20260829-16'), { view: 'home' });
    mount('sierra-footer-root', () => import('./footer.js'), { imageBasePath: './', showSocial: true, showContact: true, showInfos: true, showPayments: true, showCopyright: true });
  </script>
</body>
