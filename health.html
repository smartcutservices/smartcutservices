<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f493f">
  <title>Smart Cut Health | Santé & Pharmacie</title>
  <meta name="description" content="Recherchez une pharmacie vérifiée, envoyez une ordonnance et réservez auprès de professionnels de santé partenaires.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./site-foundation.css?v=20260825-1">
  <link rel="stylesheet" href="./health.css?v=20260825-2">
</head>
<body>
  <div id="sierra-header-root"></div>
  <main id="health-root"><div class="health-boot"><i class="fas fa-circle-notch fa-spin"></i> Ouverture de Smart Cut Health…</div></main>
  <div id="sierra-footer-root"></div>
  <script type="module">
    import './firebase-init.js';
    const mount = async (id, loader, options = {}) => {
      const root = document.getElementById(id);
      if (!root) return;
      try { const mod = await loader(); new mod.default(id, options); }
      catch (error) { console.error(`Erreur ${id}:`, error); }
    };
    mount('sierra-header-root', () => import('./header.js?v=20260825-4'));
    mount('health-root', () => import('./health.js?v=20260825-1'));
    mount('sierra-footer-root', () => import('./footer.js'), { imageBasePath: './', showSocial: true, showContact: true, showInfos: true, showPayments: true, showCopyright: true });
  </script>
</body>
</html>
